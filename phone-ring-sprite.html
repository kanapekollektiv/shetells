<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>she tells — ringing sprite</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    width: var(--sw, 620px);
    height: var(--sh, 620px);
  }

  .cell {
    position: absolute;
    top: 0; left: 0;
    width: var(--cw, 620px);
    height: var(--ch, 620px);
  }

  .art {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    transform: rotate(var(--rot, 0deg)) translate(var(--dx, 0px), var(--dy, 0px));
    transform-origin: 50% 62%;
  }

  /* The site's own curl line, used as the ring mark. */
  .curl {
    position: absolute;
    top: 50%;
    left: calc(50% + var(--off, 0px));
    width: var(--cw2, 120px);
    transform: translate(-50%, -50%) rotate(var(--crot, 0deg)) scaleX(var(--flip, 1));
    height: auto;
    opacity: var(--op, 1);
    overflow: visible;
  }

  #stage.play .cell { visibility: hidden; }
  #stage.play .cell.on { visibility: visible; }
  #stage.sheet .cell { visibility: visible; }

  #bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    font: 500 12px/1 -apple-system, Helvetica, Arial, sans-serif;
    color: #fff; background: rgba(0,0,0,.6);
    padding: 8px 14px; border-radius: 999px; z-index: 10;
  }
  #bar button {
    font: inherit; color: #fff; background: transparent;
    border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: 5px 10px; cursor: pointer;
  }
  body.rendering #bar { display: none; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="bar">
  <button id="slower">−</button>
  <span id="rate">8 fps</span>
  <button id="faster">+</button>
  <button id="sheetBtn">sheet</button>
  <button id="swapBtn">phone / shell</button>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   she tells — ringing, 5-frame sprite

   Two receivers, same ring: an old desk phone, or a conch shell.
   The ring marks are asset19.svg, the curl line used on the site.

   Preview:  phone-ring-sprite.html
   Options:  ?shell=1    conch shell receiver instead of the phone
             ?frame=2    show one frame only (for PNG export)
             ?sheet=1    lay all frames out as a strip
             ?fps=8      playback rate
             ?render=1   hide UI chrome
   ───────────────────────────────────────────────────────────── */

const Q = new URLSearchParams(location.search);

const VB = 400;
const CELL = 620;
const SHELL = Q.has('shell');
const INK = '#FFFFFF';

/* The curl line from asset19.svg, inlined so its weight can be set here.
   The file itself is drawn at a 0.75 stroke, which renders as a hairline
   next to the receiver — inline, it can be matched to the rest. */
const CURL_D = 'M19.38,106.66c-2.26,2.22-8.96,7.35-11.46,5.41-3.15-2.44.28-12.7,2.95-15.66,2.23-2.47,11.8-6.99,12.75-3.81.68,2.25-6.65,2.84-9,2.72-3.64-.19-11.56-2.52-13.44-5.64-1.69-2.81-.41-10.21,1.21-13.06.62-1.1,3.21-2.07,4.08-2.99.75-.79,1.63-2.85,2.37-3.65,1.54-1.68,9.02-4.21,7.21-5.6,1.13.86-.76,5.23-2.18,5.24-2.52.02-4.15-6.75-4-9.27.12-2.13,2.93-5.73,4.27-7.39,1.61-1.99,5.13-6.12,7.57-6.89,2.13-.67,7.63-.7,8.87,1.17.42.64-.06,2.91-.82,2.96-1.91.13-2.98-5.11-3.06-7.02-.07-1.62,1.53-4.61,2.05-6.14.76-2.22,1.54-7.13,3.12-8.88,2.23-2.47,8.82-6.53,12.03-5.67,2.47.66,6.33,5.88,5.83,8.38-.16.8-3.54,1.57-2.75,1.77-1.83-.48-3.27-4.83-3.55-6.71-.45-2.99.67-9.3,2.26-11.86,2.88-4.65,12.15-11.77,17.42-13.23,2.09-.58,7.57-.97,8.61.92';
const CURL_VB = '0 0 72.07 112.87';

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function smooth(pts, close = false) {
  const n = pts.length;
  const at = close ? i => pts[(i + n) % n]
                   : i => pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const last = close ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)}` +
         ` ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + (close ? ' Z' : '');
}

/* Closed hand-drawn outline through the given points. */
function blob(pts, seed, jit = 3) {
  const rnd = mulberry32(seed);
  return smooth(pts.map(([x, y]) => [x + (rnd() - 0.5) * jit, y + (rnd() - 0.5) * jit]), true);
}
function open_(pts, seed, jit = 3) {
  const rnd = mulberry32(seed);
  return smooth(pts.map(([x, y]) => [x + (rnd() - 0.5) * jit, y + (rnd() - 0.5) * jit]), false);
}

/* Coiled handset cord — a helix flattened onto the page. */
function cord(x0, y0, x1, y1, loops, r, seed) {
  const rnd = mulberry32(seed);
  const N = 90, pts = [];
  for (let i = 0; i <= N; i++) {
    const f = i / N;
    const th = f * Math.PI * 2 * loops;
    pts.push([
      x0 + (x1 - x0) * f + r * Math.cos(th) + (rnd() - 0.5) * 1.6,
      y0 + (y1 - y0) * f + r * 0.55 * Math.sin(th) + (rnd() - 0.5) * 1.6,
    ]);
  }
  return smooth(pts);
}

function ring(cx, cy, r, seed, wobble = 0.1) {
  const rnd = mulberry32(seed);
  const N = 12, pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    const rr = r * (1 - wobble / 2 + rnd() * wobble);
    pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
  }
  return smooth(pts, true);
}

/* ── The old desk phone: handset resting on a wedge body, dial, coiled cord. */
function phoneArt() {
  let d = '';
  const S = 'stroke-width="5.2"', T = 'stroke-width="4"';

  // body
  d += `<path ${S} d="${blob([
    [116, 274], [113, 250], [124, 226], [142, 215], [172, 205], [200, 203],
    [228, 205], [258, 215], [276, 226], [287, 250], [284, 274],
    [250, 281], [200, 283], [150, 281],
  ], 21)}"/>`;

  // handset bar + the two cups it rests in
  d += `<path ${S} d="${open_([
    [146, 182], [172, 170], [200, 167], [228, 170], [254, 182],
  ], 33)}"/>`;
  d += `<path ${S} d="${blob([
    [106, 194], [102, 180], [110, 166], [126, 163], [142, 166], [148, 180],
    [145, 194], [126, 200],
  ], 47)}"/>`;
  d += `<path ${S} d="${blob([
    [255, 194], [252, 180], [258, 166], [274, 163], [290, 166], [298, 180],
    [294, 194], [274, 200],
  ], 59)}"/>`;

  // rotary dial
  d += `<path ${T} d="${ring(200, 243, 26, 71)}"/>`;
  d += `<path ${T} d="${ring(200, 243, 9, 83, 0.2)}"/>`;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * 0.82 + (i / 6) * Math.PI * 1.45;
    d += `<path ${T} d="${ring(200 + 17 * Math.cos(a), 243 + 17 * Math.sin(a), 3.4,
           91 + i * 7, 0.3)}"/>`;
  }

  // cord away to the right
  d += `<path ${T} d="${cord(288, 262, 352, 300, 4.5, 11, 103)}"/>`;
  return d;
}

/* ── The conch: a spiralling shell, held to the ear. */
function shellArt() {
  let d = '';
  const S = 'stroke-width="5.2"', T = 'stroke-width="4"';

  // outline — spire top, body whorl, siphon drawn out to the lower left
  d += `<path ${S} d="${blob([
    [206, 140], [238, 152], [262, 178], [274, 212], [270, 246], [250, 272],
    [220, 286], [186, 288], [152, 294], [124, 306], [140, 280], [156, 258],
    [162, 232], [166, 200], [180, 164],
  ], 17)}"/>`;

  // the whorl at the spire
  const rnd = mulberry32(29);
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const f = i / 30;
    const th = Math.PI * 0.4 + f * Math.PI * 2 * 1.45;
    const r = 8 + 42 * f;
    pts.push([212 + r * Math.cos(th) + (rnd() - 0.5) * 3,
              212 + r * 0.86 * Math.sin(th) + (rnd() - 0.5) * 3]);
  }
  d += `<path ${T} d="${smooth(pts)}"/>`;

  // ridges across the body
  d += `<path ${T} d="${open_([[176, 250], [200, 262], [230, 266], [256, 258]], 37)}"/>`;
  d += `<path ${T} d="${open_([[170, 226], [196, 240], [232, 244], [262, 234]], 43)}"/>`;
  return d;
}

/* Rest, three pulses outward, then the last ring dissipating. The receiver
   shakes against each pulse. */
const FRAMES = [
  { rot:  0, dx: 0,  dy: 0, off: 0,   sc: 0,    op: 0 },
  { rot:  6, dx: 3,  dy: -2, off: 150, sc: 0.62, op: 1 },
  { rot: -7, dx: -4, dy: 2,  off: 176, sc: 0.86, op: 1 },
  { rot:  6, dx: 4,  dy: -3, off: 200, sc: 1.05, op: 1 },
  { rot: -2, dx: -2, dy: 1,  off: 216, sc: 0.7,  op: 0.55 },
];

const stage = document.getElementById('stage');
const SHEET = Q.has('sheet');
const ONE = Q.has('frame') ? parseInt(Q.get('frame'), 10) : null;
const shown = ONE !== null && FRAMES[ONE] !== undefined ? [ONE]
            : FRAMES.map((_, i) => i);

const ART = SHELL ? shellArt() : phoneArt();

shown.forEach((fi, slot) => {
  const f = FRAMES[fi];

  const curls = f.sc === 0 ? '' : [1, -1].map((dir, k) =>
    `<svg class="curl" viewBox="${CURL_VB}" xmlns="http://www.w3.org/2000/svg" style="` +
    `--off:${dir * f.off}px; --cw2:${(128 * f.sc).toFixed(0)}px; ` +
    `--crot:${dir * (18 + fi * 5)}deg; --flip:${dir}; --op:${f.op}">` +
    `<path d="${CURL_D}" fill="none" stroke="${INK}" stroke-width="3.6"` +
    ` stroke-linecap="round" stroke-linejoin="round"/></svg>`
  ).join('');

  const cell = document.createElement('div');
  cell.className = 'cell';
  if (SHEET) cell.style.left = slot * CELL + 'px';
  cell.innerHTML =
    `<div class="art" style="--rot:${f.rot}deg; --dx:${f.dx}px; --dy:${f.dy}px">
       <svg viewBox="0 0 ${VB} ${VB}" xmlns="http://www.w3.org/2000/svg"
            style="position:absolute;inset:0;width:100%;height:100%">
         <g fill="none" stroke="${INK}" stroke-linecap="round"
            stroke-linejoin="round">${ART}</g>
       </svg>
     </div>` + curls;
  stage.appendChild(cell);
});

const SW = SHEET ? CELL * shown.length : CELL;
stage.style.setProperty('--sw', SW + 'px');
stage.style.setProperty('--sh', CELL + 'px');
document.documentElement.style.setProperty('--cw', CELL + 'px');
document.documentElement.style.setProperty('--ch', CELL + 'px');
stage.classList.add(SHEET ? 'sheet' : 'play');

function fit() {
  if (Q.has('render')) {
    document.documentElement.style.setProperty('--fit', 1);
    return;
  }
  const s = Math.min(innerWidth / SW, innerHeight / CELL, 1.5) * 0.85;
  document.documentElement.style.setProperty('--fit', s);
}
fit();
addEventListener('resize', fit);

if (Q.has('render')) document.body.classList.add('rendering');

let fps = parseFloat(Q.get('fps')) || 8;
let idx = 0, timer = null;
const cells = [...stage.querySelectorAll('.cell')];

function step() {
  cells.forEach((c, i) => c.classList.toggle('on', i === idx));
  idx = (idx + 1) % cells.length;
}
function play() {
  clearInterval(timer);
  if (SHEET || ONE !== null) { cells.forEach(c => c.classList.add('on')); return; }
  step();
  timer = setInterval(step, 1000 / fps);
}

Promise.all([...document.querySelectorAll('img')].map(img =>
  img.complete ? Promise.resolve()
               : new Promise(r => { img.onload = r; img.onerror = r; })
)).then(() => {
  play();
  document.body.dataset.frameReady = '1';
});

document.getElementById('rate').textContent = fps + ' fps';
document.getElementById('faster').onclick = () => {
  fps = Math.min(24, fps + 2); document.getElementById('rate').textContent = fps + ' fps'; play();
};
document.getElementById('slower').onclick = () => {
  fps = Math.max(2, fps - 2); document.getElementById('rate').textContent = fps + ' fps'; play();
};
document.getElementById('sheetBtn').onclick = () => {
  location.search = SHELL ? '?sheet=1&shell=1' : '?sheet=1';
};
document.getElementById('swapBtn').onclick = () => {
  location.search = SHELL ? '' : '?shell=1';
};

window.RING = { FRAMES: FRAMES.length, CELL };
</script>

</body>
</html>
