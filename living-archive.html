<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>she tells — the living archive</title>
  <script src="lang.js?v=4"></script>
  <style>
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1.2rem; text-decoration: none; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(52px, 7.5vw, 108px);
      line-height: 1;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(13px, 1.6vw, 22px);
      color: #111111;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5em;
      white-space: nowrap;
    }

    .brand-line {
      display: inline-block;
      height: clamp(8px, 1vw, 12px);
      width: clamp(40px, 4vw, 60px);
      flex-shrink: 0;
    }

    /* ── Nav buttons (mirrors main page style) ── */
    .const-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      align-self: flex-start;
      padding-top: 0.2rem;
    }

    .c-btn {
      font-family: 'Celescript', cursive;
      font-size: clamp(11px, 1.2vw, 16px);
      cursor: pointer;
      border: none;
      transition: background 0.18s, color 0.18s, transform 0.12s;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .c-btn:active { transform: scale(0.96); }

    .c-btn-circle {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      border: 1.5px solid #111111;
      background: transparent;
      color: #111111;
    }
    .c-btn-circle:hover { background: #111111; color: #ffffff; }

    .c-btn-filled {
      background: #111111;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
    }
    .c-btn-filled:hover { background: #333; }

    .c-btn-outline {
      background: transparent;
      color: #111111;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
      border: 1.5px solid #111111;
    }
    .c-btn-outline:hover { background: #111111; color: #ffffff; }
    .c-btn-outline.playing { background: #111111; color: #ffffff; }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 4300px;
      height: 2800px;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 1px 4px rgba(0,0,0,0.10),
        0 3px 10px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 8px 24px rgba(0,0,0,0.14),
        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
      flex-shrink: 0;
    }

    .card-body {
      width: 100%;
      flex: 1;
      background: #DAD7D0;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }

    .card-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 10px;
      color: rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    .card-cats-dots {
      display: flex;
      gap: 3px;
      justify-content: center;
    }

    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .map-legend {
      position: fixed;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 1.1rem 1.3rem;
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .legend-item:not(.dimmed):hover .legend-dot { transform: scale(1.45); }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      color: #111111;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.9);
      color: #111111;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .zoom-btn:hover { background: #111111; color: #fff; border-color: #111111; }

    .map-hint {
      position: absolute;
      bottom: 16px; right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.55);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 20;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 8px 14px;
      line-height: 1.7;
      text-align: right;
    }

    /* ── Filter transitions ── */
    .card-wrap { transition: opacity 0.22s ease; }
    .card-wrap.dimmed { opacity: 0.08; }
    .card-wrap:hover { z-index: 30 !important; position: relative; }

    /* ── Idle water-float ── */
    @keyframes floatWater {
      0%   { transform: translate(0px, 0px); }
      20%  { transform: translate(var(--fx), calc(var(--fy) * -1)); }
      45%  { transform: translate(calc(var(--fx) * -0.6), var(--fy)); }
      70%  { transform: translate(calc(var(--fx) * 0.4), calc(var(--fy) * -0.8)); }
      100% { transform: translate(0px, 0px); }
    }

    .canvas-idle .card-wrap {
      animation: floatWater var(--fdur, 7s) ease-in-out infinite var(--fdelay, 0s);
    }

    /* ── Cluster headline labels ── */
    .cluster-label {
      position: absolute;
      transform: translateX(-50%);
      font-family: 'Celescript', cursive;
      font-size: 13pt;
      line-height: 1;
      padding: 8px 22px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      z-index: 6;
      transition: opacity 0.22s ease;
    }
    .cluster-label.dimmed { opacity: 0.05; }

    /* ── Link pill card ── */
    .card-link-pill {
      border-radius: 999px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.2);
      box-shadow: none !important;
      display: flex; align-items: center; justify-content: center;
      overflow: visible !important;
    }
    .card-link-pill:hover { background: #f5f5f5; transform: none !important; }
    .card-link-text {
      font-family: 'Celescript', cursive;
      font-size: 10px; color: #111; letter-spacing: 0.04em; white-space: nowrap;
    }

    /* ── Text preview card ── */
    .card-text-box {
      border-radius: 12px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
      padding: 11px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .card-text-box:hover { border-color: rgba(0,0,0,0.3) !important; }
    .card-text-preview {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; line-height: 1.52; color: #333;
    }
    .card-text-hint {
      font-family: 'Celescript', cursive;
      font-size: 8.5px; color: rgba(0,0,0,0.28); letter-spacing: 0.05em; white-space: nowrap;
    }

    /* ── Credits card ── */
    .card-credits-box {
      background: transparent; border: none;
      box-shadow: none !important; padding: 2px 0;
    }
    .card-credits-box:hover { transform: none !important; box-shadow: none !important; }
    .card-credits-text {
      font-family: 'Celescript', cursive;
      font-size: 9px; color: rgba(0,0,0,0.38); letter-spacing: 0.04em; line-height: 1.5;
    }

    /* ── Card Popup Modal (matches ? info overlay style) ── */
    .card-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .card-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .card-popup {
      background: #ffffff;
      color: #111111;
      border: 1.5px solid #111111;
      border-radius: 1.2rem;
      max-width: 680px;
      width: 90%;
      max-height: 78vh;
      overflow: hidden;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    .card-overlay.active .card-popup { transform: translateY(0); }

    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
    }
    .dp-chip {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 14px;
      letter-spacing: 0.05em;
    }
    .dp-close {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 1.4rem;
      color: #111111;
      line-height: 1;
      padding: 2px 6px;
      transition: opacity 0.15s;
    }
    .dp-close:hover { opacity: 0.5; }

    .dp-body {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #111111 rgba(0,0,0,0.06);
    }
    .dp-body::-webkit-scrollbar { width: 6px; }
    .dp-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.06); }
    .dp-body::-webkit-scrollbar-thumb { background: #111111; }

    .dp-hero { width: 100%; overflow: hidden; flex-shrink: 0; }
    .dp-hero img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

    .dp-content { padding: 1.5rem 1.6rem 2.5rem; }
    .dp-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 1rem;
    }
    .dp-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.78;
      color: #444;
      margin-bottom: 1.4rem;
    }
    .dp-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 1.2rem 0; }
    .dp-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 0.9rem;
    }
    .dp-book {
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .dp-book-cover {
      width: 68px; flex-shrink: 0;
      border-radius: 3px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }
    .dp-book-cover img { width: 100%; display: block; }
    .dp-book-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 15px;
      color: #111; line-height: 1.3; margin-bottom: 0.25rem;
    }
    .dp-book-author {
      font-family: system-ui, sans-serif;
      font-size: 12px; color: rgba(0,0,0,0.42); margin-bottom: 0.6rem;
    }
    .dp-pill {
      font-family: 'Celescript', cursive;
      font-size: 10px; border-radius: 999px;
      padding: 3px 13px; text-decoration: none;
      display: inline-flex; transition: opacity 0.15s;
    }
    .dp-pill:hover { opacity: 0.75; }
    .dp-ext-link {
      display: flex; align-items: baseline; gap: 0.8rem;
      text-decoration: none; padding: 0.75rem 1rem;
      border: 1.5px solid rgba(0,0,0,0.09); border-radius: 10px;
      margin-bottom: 0.5rem; transition: border-color 0.18s, background 0.18s;
    }
    .dp-ext-link:hover { background: rgba(0,0,0,0.025); border-color: rgba(0,0,0,0.22); }
    .dp-ext-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 14px; color: #111; flex: 1; line-height: 1.4;
    }
    .dp-ext-arrow { font-size: 12px; flex-shrink: 0; opacity: 0.45; }
    .dp-photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 5px; margin-bottom: 5px;
    }
    .dp-photo-grid img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-video-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px; margin-bottom: 0.8rem;
    }
    .dp-video-grid video {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-credits {
      font-family: 'Celescript', cursive;
      font-size: 10px; letter-spacing: 0.05em; color: rgba(0,0,0,0.35);
    }
    .dp-placeholder {
      font-family: 'Celescript', cursive;
      font-size: 12px; color: rgba(0,0,0,0.28);
      letter-spacing: 0.06em; margin-top: 1.6rem;
    }
  </style>
</head>
<body>

  <audio id="streamAudio" src="https://shell.kokott.art/ambient.mp3" preload="none"></audio>

  <header class="const-header">
    <a class="brand" href="index.html">
      <span class="brand-title">she tells</span>
      <span class="brand-sub">
        <svg class="brand-line" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55.87 5.06" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=".75"
            d="M.91,3.32c3.46.66,15.77,1.65,22.92.28,4.78-.91,15.54-2.85,19.76-2.83,3.81.02,8.93,0,11.38.86"/>
        </svg>
        sea shells
      </span>
    </a>
    <nav class="const-nav">
      <button class="c-btn c-btn-circle" id="btnInfo" aria-label="About">?</button>
      <button class="c-btn c-btn-circle lang-toggle" onclick="toggleLang()" aria-label="Switch language">PT</button>
      <button class="c-btn c-btn-outline" id="btnStream">&#9654;</button>
      <a href="memories.html" class="c-btn c-btn-filled">contribute to the living archive</a>
    </nav>
  </header>

  <div class="map-viewport" id="viewport">
    <div class="canvas-inner" id="canvasInner">
      <svg id="linesSvg" width="4300" height="2800"
           style="position:absolute;top:0;left:0;pointer-events:none;shape-rendering:geometricPrecision;" aria-hidden="true">
      </svg>
    </div>

    <div class="map-controls">
      <button class="zoom-btn" id="btnZoomIn"  aria-label="Zoom in">+</button>
      <button class="zoom-btn" id="btnZoomOut" aria-label="Zoom out">−</button>
    </div>
    <p class="map-hint">drag to explore<br>scroll to zoom<br>press h to center</p>
  </div>

  <footer class="map-legend" id="mapLegend"></footer>

  <div class="card-overlay" id="cardOverlay" role="dialog" aria-modal="true">
    <div class="card-popup">
      <div class="dp-header">
        <span class="dp-chip" id="dpChip"></span>
        <button class="dp-close" id="btnClosePanel" aria-label="Close">✕</button>
      </div>
      <div class="dp-body" id="dpBody"></div>
    </div>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════
     CATEGORY DEFINITIONS
     Three color families from the landing page:
       Blue  #0046FF — water, ocean, data, future
       Yellow #F5DE0A — making, practice, tools
       Purple #6e00b0 — creative, human, cultural
  ═══════════════════════════════════════════════════ */
  const CATS = [
    { key: 'hypersea',    label: 'Hypersea',            color: '#9CB2FF' },
    { key: 'sargassum',   label: 'Sargassum',           color: '#00652E' },
    { key: 'speculative', label: 'Speculative Futures',  color: '#FF6EE6' },
    { key: 'data',        label: 'Data',                 color: '#32BE3A' },
    { key: 'workshop',    label: 'Workshops',            color: '#CCDE07' },
    { key: 'toolkit',     label: 'Toolkit',              color: '#CB561D' },
    { key: 'future',      label: 'Future Products',      color: '#FF5E33' },
    { key: 'drawings',    label: 'Drawings',             color: '#92CEF8' },
    { key: 'exhibition',  label: 'Exhibition',           color: '#5B2915' },
    { key: 'local',       label: 'Local Stories',        color: '#9861FF' },
    { key: 'nonhuman',    label: 'Non Human',            color: '#4B06F7' },
  ];
  const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));

  /* ── Cluster center coordinates for drawing connection lines ── */
  const CENTERS = {
    hypersea:    [ 563,  471],
    local:       [1458,  260],
    workshop:    [2686,  297],
    drawings:    [3797,  294],
    speculative: [2621, 1270],
    sargassum:   [ 352, 1226],
    exhibition:  [1470, 1261],
    toolkit:     [2678, 2177],
    data:        [3761, 1254],
    future:      [ 305, 2173],
    nonhuman:    [1652, 2250],
  };

  /* ═══════════════════════════════════════════════════
     CONNECTION LINES
     Open bezier curves showing relationships between
     clusters. Not closed loops — they flow between nodes.
     color: '#0046FF' (blue) or '#F5DE0A' (yellow)
     bend: controls how far the curve deviates from straight line
           positive = curves one way, negative = other way
  ═══════════════════════════════════════════════════ */
  const CONNECTIONS = [
    // ── Blue connections (water / knowledge / ocean)
    { from: 'hypersea',    to: 'sargassum',   color: '#0046FF', bend: -0.45 },
    { from: 'sargassum',   to: 'nonhuman',    color: '#0046FF', bend:  0.38 },
    { from: 'hypersea',    to: 'local',       color: '#0046FF', bend: -0.30 },
    { from: 'data',        to: 'speculative', color: '#0046FF', bend: -0.35 },
    { from: 'nonhuman',    to: 'data',        color: '#0046FF', bend:  0.40 },
    { from: 'sargassum',   to: 'exhibition',  color: '#0046FF', bend:  0.28 },
    { from: 'hypersea',    to: 'speculative', color: '#0046FF', bend: -0.18 }, // long sweep

    // ── Yellow connections (making / practice / process)
    { from: 'workshop',    to: 'toolkit',     color: '#F5DE0A', bend: -0.40 },
    { from: 'workshop',    to: 'drawings',    color: '#F5DE0A', bend: -0.32 },
    { from: 'toolkit',     to: 'data',        color: '#F5DE0A', bend: -0.30 },
    { from: 'drawings',    to: 'speculative', color: '#F5DE0A', bend: -0.28 },
    { from: 'future',      to: 'toolkit',     color: '#F5DE0A', bend:  0.35 },
    { from: 'speculative', to: 'future',      color: '#F5DE0A', bend:  0.42 }, // long sweep

  /* ═══════════════════════════════════════════════════
     CATMULL-ROM OPEN PATH
     For open (non-closed) smooth curves through points.
  ═══════════════════════════════════════════════════ */
  function catmullOpen(pts, tension = 0.38) {
    const n = pts.length;
    if (n < 2) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(i + 2, n - 1)];
      const cp1x = (p1[0] + (p2[0] - p0[0]) * tension).toFixed(1);
      const cp1y = (p1[1] + (p2[1] - p0[1]) * tension).toFixed(1);
      const cp2x = (p2[0] - (p3[0] - p1[0]) * tension).toFixed(1);
      const cp2y = (p2[1] - (p3[1] - p1[1]) * tension).toFixed(1);
      d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ═══════════════════════════════════════════════════
     QUADRATIC BEZIER CONNECTION between two cluster centers
     bend: how far the midpoint curves off the straight line
     (positive = left of direction, negative = right)
  ═══════════════════════════════════════════════════ */
  function connectionPath(x1, y1, x2, y2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    // Perpendicular unit vector
    const px = -dy / len, py = dx / len;
    const offset = len * bend;
    const cx = (x1 + x2) / 2 + px * offset;
    const cy = (y1 + y2) / 2 + py * offset;
    return `M ${x1.toFixed(0)},${y1.toFixed(0)} Q ${cx.toFixed(0)},${cy.toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`;
  }

  /* ═══════════════════════════════════════════════════
     BUILD CONNECTION LINES
  ═══════════════════════════════════════════════════ */
  const svg = document.getElementById('linesSvg');
  // Keep the line layer exactly as large as the canvas, so connection lines to
  // the outermost clusters are never clipped when the canvas is resized.
  const canvasEl = document.getElementById('canvasInner');
  svg.setAttribute('width',  canvasEl.offsetWidth);
  svg.setAttribute('height', canvasEl.offsetHeight);

  CONNECTIONS.forEach(({ from, to, bend }) => {
    const [x1, y1] = CENTERS[from];
    const [x2, y2] = CENTERS[to];
    const color = CAT_MAP[from]?.color || '#999';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', connectionPath(x1, y1, x2, y2, bend));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-opacity', '0.55');
    path.setAttribute('stroke-linecap', 'round');
    path.dataset.connection = `${from}-${to}`;
    svg.appendChild(path);
  });

    let _spx = 0, _spy = 0, _spt = 0;
    wrap.addEventListener('pointerdown', e => {
      _spx = e.clientX; _spy = e.clientY; _spt = Date.now();
      e.stopPropagation();
    }, { passive: true });
    wrap.addEventListener('pointerup', e => {
      if (Math.hypot(e.clientX - _spx, e.clientY - _spy) > 12 || Date.now() - _spt > 600) return;
      if (content && content.img && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.img) {
        openMediaPopup({ img: content.img, alt: content.alt, title }, cats[0]);
      } else if (content && content.vid) {
        openMediaPopup({ vid: content.vid, title }, cats[0]);
      } else if (content && content.txt) {
        openTextPopup(content.full || content.txt, cats[0]);
      } else if (!content || (!content.credits)) {

  /* ═══════════════════════════════════════════════════
     BUILD CLUSTER LABELS
  ═══════════════════════════════════════════════════ */
  // Categories whose colour is light enough to need dark text on the cluster label
  const YELLOW_CATS = new Set(['hypersea', 'workshop', 'drawings']);

  CATS.forEach(({ key, label, color }) => {
    const members = CARDS.filter(([cats]) => cats.includes(key));
    if (!members.length) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity;
    members.forEach(([, x, y, w]) => {
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x + w);
      minY = Math.min(minY, y);
    });

    const cx = (minX + maxX) / 2;

    lbl.className = 'cluster-label';

    lbl.addEventListener('click', (e) => {

  /* ═══════════════════════════════════════════════════
     BUILD LEGEND
  ═══════════════════════════════════════════════════ */
  const legendEl = document.getElementById('mapLegend');
  let activeFilter = null;

  CATS.forEach(({ key, label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cat = key;

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const lbl = document.createElement('span');
    lbl.className = 'legend-label';
    lbl.textContent = label;

    item.appendChild(dot);
    item.appendChild(lbl);
    legendEl.appendChild(item);

    item.addEventListener('click', () => {
      if (activeFilter === key) {
        activeFilter = null;
        applyFilter(null);
        flyToOverview();
      } else {
        activeFilter = key;
        applyFilter(key);
        flyToCluster(key);
      }
    });
  });

  function applyFilter(key) {
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    document.querySelectorAll('.card-wrap').forEach(el => {
      const cats = el.dataset.cats.split(',');
      el.classList.toggle('dimmed', key !== null && !cats.includes(key));
    });
    document.querySelectorAll('.cluster-label').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    svg.querySelectorAll('path').forEach(el => {
      const conn = el.dataset.connection || '';
      const relevant = key === null || conn.includes(key);
      el.style.transition = 'opacity 0.22s ease';
      el.style.opacity = relevant ? '' : '0.04';
    });
  }

  /* ── Compute bounding box of all cards for a category ── */
  function clusterBounds(key) {
    const members = CARDS.filter(([cats]) => cats.includes(key));
    if (!members.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    members.forEach(([, x, y, w, h]) => {
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2,
             w: maxX - minX, h: maxY - minY };
  }

  /* ── Animated fly to a cluster ── */
  let flyTimer = null;

  function flyTo(targetTx, targetTy, targetScale) {
    canvasInner.style.transition = 'transform 0.72s cubic-bezier(0.4, 0, 0.2, 1)';
    scale = targetScale;
    tx = targetTx;
    ty = targetTy;
    applyTransform();
    clearTimeout(flyTimer);
    flyTimer = setTimeout(() => { canvasInner.style.transition = ''; }, 800);
  }

  function flyToCluster(key) {
    const bounds = clusterBounds(key);
    if (!bounds) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const legendW = document.getElementById('mapLegend')?.offsetWidth || 220;
    const usableW = vw - legendW;
    const PAD = 100;
    const targetScale = Math.min(
      usableW / (bounds.w + PAD * 2),
      vh      / (bounds.h + PAD * 2),
      1.2
    );
    // Center within the usable area (right of legend)
    const centerX = legendW + usableW / 2;
    flyTo(
      centerX - bounds.cx * targetScale,
      vh / 2 - bounds.cy * targetScale,
      Math.max(0.3, targetScale)
    );
  }

  /* Width reserved on the left for the legend panel, so the overview and
     the per-cluster fly-to never park content underneath it. */
  const LEGEND_GUTTER = 240;

  /* Measure the real extent of the map so the overview never goes stale
     when clusters are moved or the canvas is resized. */
  function contentBounds() {
    const PAD = 120;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvasInner.querySelectorAll('.card-wrap, .cluster-label').forEach(el => {
      const w = el.offsetWidth, h = el.offsetHeight;
      // cluster labels are centred on their x via translateX(-50%)
      const x = el.classList.contains('cluster-label') ? el.offsetLeft - w / 2 : el.offsetLeft;
      const y = el.offsetTop;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (!isFinite(minX)) return { x: 0, y: 0, w: 1000, h: 1000 };
    return { x: minX - PAD, y: minY - PAD, w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2 };
  }

  function flyToOverview() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    const targetScale = Math.min(availW / b.w, vh / b.h) * 0.92;
    flyTo(
      LEGEND_GUTTER + (availW - b.w * targetScale) / 2 - b.x * targetScale,
      (vh - b.h * targetScale) / 2 - b.y * targetScale,
      targetScale
    );
  }

  /* ═══════════════════════════════════════════════════
     PAN + ZOOM
  ═══════════════════════════════════════════════════ */
  const viewport = document.getElementById('viewport');
  let scale = 0.36;
  let tx = 0, ty = 0;
  let isPanning = false;
  let startX = 0, startY = 0;
  let dragOriginX = 0, dragOriginY = 0;

  let videoTimer = null;
  function updateVideos() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    document.querySelectorAll('.card-wrap').forEach(wrap => {
      const vid = wrap.querySelector('video');
      if (!vid) return;
      const cx = parseFloat(wrap.style.left);
      const cy = parseFloat(wrap.style.top);
      const cw = parseFloat(wrap.style.width);
      const cardEl = wrap.querySelector('.card');
      const ch = cardEl ? parseFloat(cardEl.style.height) : 80;
      const sx = cx * scale + tx, sy = cy * scale + ty;
      const visible = (cx + cw) * scale + tx > 0 && sx < vw &&
                      (cy + ch) * scale + ty > 0 && sy < vh;
      if (visible && scale > 0.45) {
        if (vid.paused) vid.play().catch(() => {});
      } else {
        if (!vid.paused) vid.pause();
      }
    });
  }

  function applyTransform() {
    canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    clearTimeout(videoTimer);
    videoTimer = setTimeout(updateVideos, 350);
  }

  function initView() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    scale = Math.min(availW / b.w, vh / b.h) * 0.92;
    tx = LEGEND_GUTTER + (availW - b.w * scale) / 2 - b.x * scale;
    ty = (vh - b.h * scale) / 2 - b.y * scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-controls')) return;
    isPanning = true;
    didDrag = false;
    startX = e.clientX; startY = e.clientY;
    dragOriginX = e.clientX; dragOriginY = e.clientY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!isPanning) return;
    const moved = Math.hypot(e.clientX - dragOriginX, e.clientY - dragOriginY);
    if (moved > 14) didDrag = true;
    tx += e.clientX - startX;
    ty += e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    applyTransform();
  });

  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
    setTimeout(() => { didDrag = false; }, 50);
  });

  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.11 : 0.90;
    const newScale = Math.max(0.15, Math.min(3, scale * factor));
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }, { passive: false });

  let pinchDist = 0;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const pcx = cx - rect.left, pcy = cy - rect.top;
    const canX = (pcx - tx) / scale;
    const canY = (pcy - ty) / scale;
    scale = Math.max(0.15, Math.min(3, scale * (d / pinchDist)));
    tx = pcx - canX * scale;
    ty = pcy - canY * scale;
    pinchDist = d;
    applyTransform();
  }, { passive: false });

  function zoomToCenter(f) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2, cy = vh / 2;
    const newScale = Math.max(0.15, Math.min(3, scale * f));
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }

  document.getElementById('btnZoomIn').addEventListener('click',  () => zoomToCenter(1.3));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomToCenter(0.77));

  // Init once layout is fully painted (requestAnimationFrame ensures flex heights are settled)
  if (document.readyState === 'complete') {
    requestAnimationFrame(initView);
  } else {
    window.addEventListener('load', () => requestAnimationFrame(initView));
  }
  window.addEventListener('resize', initView);

  /* ── H key → center ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') flyToOverview();
  });

  /* ── Idle water-float ── */
  let idleTimer = null;

  function goIdle() {
    canvasInner.classList.add('canvas-idle');
  }

  function wakeUp() {
    canvasInner.classList.remove('canvas-idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goIdle, 2500);
  }

  ['mousedown', 'touchstart', 'wheel'].forEach(ev =>
    viewport.addEventListener(ev, wakeUp, { passive: true })
  );

  // Start idle after 2s on load
  idleTimer = setTimeout(goIdle, 2000);

  /* ═══════════════════════════════════════════════════
     SECTION PANEL CONTENT
  ═══════════════════════════════════════════════════ */
  const LIGHT_TEXT_CATS = new Set(['hypersea', 'workshop', 'drawings']);

  const SECTIONS = {
    hypersea: {
      title: 'Hypersea',
      heroImg: 'la/hypersea/dunes.jpg',
      heroAlt: 'Esposende coastline sand dunes',
      body: 'We have been using the Hypersea concept by Mark A. S. McMenamin and Dianna L. Schulte McMenamin as prompts to remember and reimagine. Inviting participants to reconsider their entanglement with water, to recall the partial liquidity of their own bodies, and to sense the connective tissue that water forms across ecosystems.',
      streamLink: { title: 'Water Memory Stream', href: 'https://shetells.stream' },
      reading: {
        label: 'Reading',
        items: [
          {
            type: 'book',
            title: 'Hypersea: Life on Land',
            author: 'Mark A. S. McMenamin & Dianna L. Schulte McMenamin',
            href: 'https://www.sciencedirect.com/science/article/abs/pii/030326479390043C',
            cover: 'la/hypersea/book.jpg',
          },
          {
            type: 'link',
            title: 'The Ocean in Excess: Towards a More-Than-Wet Ontology',
            href: 'https://www.researchgate.net/publication/335701988_The_ocean_in_excess_Towards_a_more-than-wet_ontology',
          },
          {
            type: 'link',
            title: 'Astrida Neimanis — Hydrofeminism: On Becoming Body of Water',
            href: 'https://spacestudios.org.uk/wp-content/uploads/2017/11/hydrofeminism_or_on_becoming_a_body_of_water.pdf',
          },
        ],
      },
      glassSection: {
        label: 'Glass Blowing',
        body: 'We created the glass sculptures working with the materiality of sand as an object of the Hypersea, a point of remembering. Sand is already sea — ground shell and rock and marine sediment gathered by the water — and in melting it into glass we make one more Hypersea gesture: sea-matter changing state, becoming a vessel that can hold field recordings from the Esposende coastline.',
        photos: [
          { src: 'la/hypersea/IMG_8668.jpg', alt: 'Glass vessel taking shape' },
          { src: 'la/hypersea/IMG_8677.jpg', alt: 'Glass sphere with torch flame' },
          { src: 'la/hypersea/IMG_8729.jpg', alt: 'Glass blowing workshop' },
        ],
        videos: ['la/hypersea/glass1.mp4', 'la/hypersea/glass2.mp4'],
        credits: 'glass blown by @berlinglassworks and @vivianestroede',
      },
      footerImg: { src: 'la/hypersea/IMG_7465.jpg', alt: 'Esposende coastline at dusk' },
    },
  };

  function openTextPopup(txt, catKey) {
    const cat = CAT_MAP[catKey];
    const overlay = document.getElementById('cardOverlay');
    const chip    = document.getElementById('dpChip');
    const body    = document.getElementById('dpBody');
    const darkText = LIGHT_TEXT_CATS.has(catKey);
    chip.textContent = cat.label;
    chip.style.background = cat.color;
    chip.style.color = darkText ? '#1a1200' : '#ffffff';
    body.innerHTML = '';
    const div = document.createElement('div');
    div.style.cssText = 'padding:1.5rem 1.6rem 2rem;font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.78;color:#333;';
    div.textContent = txt;
    body.appendChild(div);
    overlay.classList.add('active');
    body.scrollTop = 0;
  }

  function openMediaPopup(content, catKey) {
    const cat = CAT_MAP[catKey];
    const overlay = document.getElementById('cardOverlay');
    const chip    = document.getElementById('dpChip');
    const body    = document.getElementById('dpBody');
    const darkText = LIGHT_TEXT_CATS.has(catKey);

    chip.textContent      = cat.label;
    chip.style.background = cat.color;
    chip.style.color      = darkText ? '#1a1200' : '#ffffff';

    body.innerHTML = '';

    if (content.img) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'background:#f8f8f8;display:flex;align-items:center;justify-content:center;padding:1rem;';
      const img = document.createElement('img');
      img.src   = content.img;
      img.alt   = content.alt || '';
      img.style.cssText = 'max-width:100%;max-height:68vh;object-fit:contain;display:block;border-radius:4px;';
      wrap.appendChild(img);
      body.appendChild(wrap);
      if (content.title) {
        const cap = document.createElement('p');
        cap.style.cssText = 'padding:0.8rem 1.2rem 1rem;font-family:\'NaNTresorM\',serif;font-weight:200;font-size:14px;color:#555;';
        cap.textContent = content.title;
        body.appendChild(cap);
      }
    } else if (content.vid) {
      const vid = document.createElement('video');
      vid.src        = content.vid;
      vid.controls   = true;
      vid.playsInline = true;
      vid.autoplay   = true;
      vid.style.cssText = 'width:100%;max-height:68vh;object-fit:contain;display:block;background:#000;';
      body.appendChild(vid);
    }

    overlay.classList.add('active');
    body.scrollTop = 0;
  }

  function openPanel(catKey) {
    const cat = CAT_MAP[catKey];
    if (!cat) return;
    const section = SECTIONS[catKey];

    const overlay  = document.getElementById('cardOverlay');
    const chip     = document.getElementById('dpChip');
    const body     = document.getElementById('dpBody');
    const darkText = LIGHT_TEXT_CATS.has(catKey);

    chip.textContent   = cat.label;
    chip.style.background = cat.color;
    chip.style.color   = darkText ? '#1a1200' : '#ffffff';

    body.innerHTML = '';

    if (!section) {
      const content = document.createElement('div');
      content.className = 'dp-content';
      content.innerHTML = `<h2 class="dp-title">${cat.label}</h2><p class="dp-placeholder">content being woven</p>`;
      body.appendChild(content);
    } else {
      if (section.heroImg) {
        const hero = document.createElement('div');
        hero.className = 'dp-hero';
        const img = document.createElement('img');
        img.src = section.heroImg; img.alt = section.heroAlt || ''; img.loading = 'lazy';
        hero.appendChild(img);
        body.appendChild(hero);
      }

      const content = document.createElement('div');
      content.className = 'dp-content';

      let html = `<h2 class="dp-title">${section.title}</h2>`;

      if (section.body) {
        html += `<p class="dp-text">${section.body}</p>`;
      }

      if (section.streamLink) {
        html += `<a class="dp-ext-link" href="${section.streamLink.href}" target="_blank" rel="noopener">
          <span class="dp-ext-title">${section.streamLink.title}</span>
          <span class="dp-ext-arrow">↗</span>
        </a>`;
      }

      if (section.reading) {
        html += `<div class="dp-divider"></div><p class="dp-label">${section.reading.label}</p>`;
        section.reading.items.forEach(item => {
          if (item.type === 'book') {
            html += `<a class="dp-book" href="${item.href}" target="_blank" rel="noopener">
              <div class="dp-book-cover"><img src="${item.cover}" alt="${item.title}" /></div>
              <div>
                <p class="dp-book-title">${item.title}</p>
                <p class="dp-book-author">${item.author}</p>
                <span class="dp-pill" style="background:${cat.color};color:${darkText?'#1a1200':'#fff'}">read →</span>
              </div>
            </a>`;
          } else {
            html += `<a class="dp-ext-link" href="${item.href}" target="_blank" rel="noopener">
              <span class="dp-ext-title">${item.title}</span>
              <span class="dp-ext-arrow">↗</span>
            </a>`;
          }
        });
      }

      if (section.glassSection) {
        const gs = section.glassSection;
        html += `<div class="dp-divider"></div><p class="dp-label">${gs.label}</p>`;
        if (gs.body) html += `<p class="dp-text">${gs.body}</p>`;
        if (gs.photos && gs.photos.length) {
          html += `<div class="dp-photo-grid">${gs.photos.map(p => `<img src="${p.src}" alt="${p.alt}" loading="lazy" />`).join('')}</div>`;
        }
        if (gs.videos && gs.videos.length) {
          html += `<div class="dp-video-grid">${gs.videos.map(v => `<video src="${v}" controls playsinline preload="metadata"></video>`).join('')}</div>`;
        }
        if (gs.credits) html += `<p class="dp-credits">${gs.credits}</p>`;
      }

      content.innerHTML = html;
      body.appendChild(content);

      if (section.footerImg) {
        const footer = document.createElement('div');
        footer.className = 'dp-hero';
        const img = document.createElement('img');
        img.src = section.footerImg.src; img.alt = section.footerImg.alt || ''; img.loading = 'lazy';
        footer.appendChild(img);
        body.appendChild(footer);
      }
    }

    overlay.classList.add('active');
    body.scrollTop = 0;
  }

  function closePanel() {
    document.getElementById('cardOverlay').classList.remove('active');
  }

  document.getElementById('btnClosePanel').addEventListener('click', closePanel);
  document.getElementById('cardOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('cardOverlay')) closePanel();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  /* ── Stream play/pause ── */
  const streamAudio = document.getElementById('streamAudio');
  const btnStream   = document.getElementById('btnStream');
  let streamPlaying = false;

  btnStream.addEventListener('click', () => {
    if (streamPlaying) {
      streamAudio.pause();
      btnStream.innerHTML = '&#9654;';
      btnStream.classList.remove('playing');
    } else {
      streamAudio.play();
      btnStream.innerHTML = '&#9646;&#9646;';
      btnStream.classList.add('playing');
    }
    streamPlaying = !streamPlaying;
  });
  </script>

</body>
