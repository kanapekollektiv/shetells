<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>she tells — the living archive</title>
  <script src="lang.js?v=7"></script>
  <style>
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1.2rem; text-decoration: none; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(52px, 7.5vw, 108px);
      line-height: 1;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(13px, 1.6vw, 22px);
      color: #111111;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5em;
      white-space: nowrap;
    }

    .brand-line {
      display: inline-block;
      height: clamp(8px, 1vw, 12px);
      width: clamp(40px, 4vw, 60px);
      flex-shrink: 0;
    }

    /* ── Nav buttons (mirrors main page style) ── */
    .const-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      align-self: flex-start;
      padding-top: 0.2rem;
    }

    .c-btn {
      font-family: 'Celescript', cursive;
      font-size: clamp(11px, 1.2vw, 16px);
      cursor: pointer;
      border: none;
      transition: background 0.18s, color 0.18s, transform 0.12s;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .c-btn:active { transform: scale(0.96); }

    .c-btn-circle {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      border: 1.5px solid #111111;
      background: transparent;
      color: #111111;
    }
    .c-btn-circle:hover { background: #111111; color: #ffffff; }

    .c-btn-filled {
      background: #111111;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
    }
    .c-btn-filled:hover { background: #333; }

    .c-btn-outline {
      background: transparent;
      color: #111111;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
      border: 1.5px solid #111111;
    }
    .c-btn-outline:hover { background: #111111; color: #ffffff; }
    .c-btn-outline.playing { background: #111111; color: #ffffff; }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 4500px;
      height: 2300px;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 1px 4px rgba(0,0,0,0.10),
        0 3px 10px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 8px 24px rgba(0,0,0,0.14),
        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
      flex-shrink: 0;
    }

    .card-body {
      width: 100%;
      flex: 1;
      background: #DAD7D0;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }

    .card-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 10px;
      color: rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    .card-cats-dots {
      display: flex;
      gap: 3px;
      justify-content: center;
    }

    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .map-legend {
      position: fixed;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 1.1rem 1.3rem;
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .legend-item:not(.dimmed):hover .legend-dot { transform: scale(1.45); }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      color: #111111;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.9);
      color: #111111;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .zoom-btn:hover { background: #111111; color: #fff; border-color: #111111; }

    .map-hint {
      position: absolute;
      bottom: 16px; right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.55);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 20;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 8px 14px;
      line-height: 1.7;
      text-align: right;
    }

    /* ── Filter transitions ── */
    .card-wrap { transition: opacity 0.22s ease; }
    .card-wrap.dimmed { opacity: 0.08; }
    .card-wrap:hover { z-index: 30 !important; position: relative; }

    /* ── Idle water-float ── */
    @keyframes floatWater {
      0%   { transform: translate(0px, 0px); }
      20%  { transform: translate(var(--fx), calc(var(--fy) * -1)); }
      45%  { transform: translate(calc(var(--fx) * -0.6), var(--fy)); }
      70%  { transform: translate(calc(var(--fx) * 0.4), calc(var(--fy) * -0.8)); }
      100% { transform: translate(0px, 0px); }
    }

    .canvas-idle .card-wrap {
      animation: floatWater var(--fdur, 7s) ease-in-out infinite var(--fdelay, 0s);
    }

    /* ── Cluster headline labels ── */
    .cluster-label {
      position: absolute;
      transform: translateX(-50%);
      font-family: 'Celescript', cursive;
      font-size: 13pt;
      line-height: 1;
      padding: 8px 22px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      z-index: 6;
      transition: opacity 0.22s ease;
    }
    .cluster-label.dimmed { opacity: 0.05; }

    /* ── Link pill card ── */
    .card-link-pill {
      border-radius: 999px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.2);
      box-shadow: none !important;
      display: flex; align-items: center; justify-content: center;
      overflow: visible !important;
    }
    .card-link-pill:hover { background: #f5f5f5; transform: none !important; }
    .card-link-text {
      font-family: 'Celescript', cursive;
      font-size: 10px; color: #111; letter-spacing: 0.04em; white-space: nowrap;
    }

    .card-img-missing {
      display: flex; align-items: center; justify-content: center;
      background: #f2f2f2; padding: 8px;
    }

    /* ── Text preview card ── */
    .card-text-box {
      border-radius: 12px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
      padding: 11px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .card-text-box:hover { border-color: rgba(0,0,0,0.3) !important; }
    .card-text-preview {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; line-height: 1.52; color: #333;
      white-space: pre-line;
    }
    .card-text-hint {
      font-family: 'Celescript', cursive;
      font-size: 8.5px; color: rgba(0,0,0,0.28); letter-spacing: 0.05em; white-space: nowrap;
    }

    /* ── Credits card ── */
    .card-credits-box {
      background: transparent; border: none;
      box-shadow: none !important; padding: 2px 0;
    }
    .card-credits-box:hover { transform: none !important; box-shadow: none !important; }
    .card-credits-text {
      font-family: 'Celescript', cursive;
      font-size: 9px; color: rgba(0,0,0,0.38); letter-spacing: 0.04em; line-height: 1.5;
      white-space: pre-line;
    }

    /* ── Card Popup Modal (matches ? info overlay style) ── */
    .card-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .card-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .card-popup {
      background: #ffffff;
      color: #111111;
      border: 1.5px solid #111111;
      border-radius: 1.2rem;
      max-width: 680px;
      width: 90%;
      max-height: 78vh;
      overflow: hidden;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    .card-overlay.active .card-popup { transform: translateY(0); }

    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
    }
    .dp-chip {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 14px;
      letter-spacing: 0.05em;
    }
    .dp-close {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 1.4rem;
      color: #111111;
      line-height: 1;
      padding: 2px 6px;
      transition: opacity 0.15s;
    }
    .dp-close:hover { opacity: 0.5; }

    .dp-body {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #111111 rgba(0,0,0,0.06);
    }
    .dp-body::-webkit-scrollbar { width: 6px; }
    .dp-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.06); }
    .dp-body::-webkit-scrollbar-thumb { background: #111111; }

    .dp-hero { width: 100%; overflow: hidden; flex-shrink: 0; }
    .dp-hero img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

    .dp-content { padding: 1.5rem 1.6rem 2.5rem; }
    .dp-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 1rem;
    }
    .dp-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.78;
      color: #444;
      margin-bottom: 1.4rem;
    }
    .dp-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 1.2rem 0; }
    .dp-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 0.9rem;
    }
    .dp-book {
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .dp-book-cover {
      width: 68px; flex-shrink: 0;
      border-radius: 3px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }
    .dp-book-cover img { width: 100%; display: block; }
    .dp-book-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 15px;
      color: #111; line-height: 1.3; margin-bottom: 0.25rem;
    }
    .dp-book-author {
      font-family: system-ui, sans-serif;
      font-size: 12px; color: rgba(0,0,0,0.42); margin-bottom: 0.6rem;
    }
    .dp-pill {
      font-family: 'Celescript', cursive;
      font-size: 10px; border-radius: 999px;
      padding: 3px 13px; text-decoration: none;
      display: inline-flex; transition: opacity 0.15s;
    }
    .dp-pill:hover { opacity: 0.75; }
    .dp-ext-link {
      display: flex; align-items: baseline; gap: 0.8rem;
      text-decoration: none; padding: 0.75rem 1rem;
      border: 1.5px solid rgba(0,0,0,0.09); border-radius: 10px;
      margin-bottom: 0.5rem; transition: border-color 0.18s, background 0.18s;
    }
    .dp-ext-link:hover { background: rgba(0,0,0,0.025); border-color: rgba(0,0,0,0.22); }
    .dp-ext-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 14px; color: #111; flex: 1; line-height: 1.4;
    }
    .dp-ext-arrow { font-size: 12px; flex-shrink: 0; opacity: 0.45; }
    .dp-photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 5px; margin-bottom: 5px;
    }
    .dp-photo-grid img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-video-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px; margin-bottom: 0.8rem;
    }
    .dp-video-grid video {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-credits {
      font-family: 'Celescript', cursive;
      font-size: 10px; letter-spacing: 0.05em; color: rgba(0,0,0,0.35);
    }
    .dp-mt-notice {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px; font-style: italic;
      color: rgba(0,0,0,0.3); margin-top: 0.4rem;
    }
    .dp-placeholder {
      font-family: 'Celescript', cursive;
      font-size: 12px; color: rgba(0,0,0,0.28);
      letter-spacing: 0.06em; margin-top: 1.6rem;
    }

    /* ══ Mobile: list of clusters -> field notes ══════════════════════ */
    .m-view { display: none; }

    @media (max-width: 768px) {
      .map-viewport, .map-legend { display: none !important; }
      /* the map pins the page to the viewport; the list has to scroll */
      html, body { overflow: auto !important; height: auto !important; }
      .m-view { display: block; padding: 0 1.25rem 3rem; }
      /* explicit display rules below would otherwise beat the hidden attribute */
      .m-view [hidden] { display: none !important; }

      .const-header { flex-direction: column; align-items: flex-start; gap: 0.9rem; }
      .const-nav { gap: 0.5rem; }
      .const-nav .c-btn-filled { display: none; }   /* returns at the list foot */

      .m-list { list-style: none; margin: 1.5rem 0 0; padding: 0; }
      .m-item {
        display: flex; align-items: center; gap: 1rem;
        padding: 1.15rem 0.25rem;
        border-bottom: 1.5px solid var(--black, #111);
        cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
        width: 100%; text-align: left;
        font-family: 'Celescript', cursive; font-size: 15px;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--black, #111);
      }
      .m-list li:last-child .m-item { border-bottom: 0; }
      .m-item:active { opacity: 0.55; }
      .m-dot { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }

      .m-cta {
        display: block; margin: 2rem 0 0; padding: 0.85rem 1.2rem;
        border-radius: 999px; background: #111; color: #fff;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.06em; text-transform: uppercase;
        text-align: center; text-decoration: none;
      }

      /* ── field notes ── */
      .m-notes { padding-top: 1.25rem; }
      .m-back {
        background: none; border: 0; padding: 0 0 1rem; cursor: pointer;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.06em; color: rgba(0,0,0,0.5);
      }
      .m-notes-chip {
        display: inline-block; padding: 7px 18px; border-radius: 999px;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.05em; text-transform: uppercase;
      }
      .m-notes-body { margin-top: 1.4rem; }
      .m-notes-body > * { margin: 0 0 1.15rem; }
      .m-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px; line-height: 1.72; color: #333; white-space: pre-line;
      }
      .m-link {
        display: block; padding: 0.72rem 1.1rem; border-radius: 999px;
        border: 1.5px solid rgba(0,0,0,0.16); background: #fff;
        font-family: 'Celescript', cursive; font-size: 12.5px;
        letter-spacing: 0.04em; color: #111; text-decoration: none;
      }
      .m-media { width: 100%; border-radius: 4px; display: block; }
      /* several of these are tall portrait frames; uncapped they ran well over
         a full screen each. The map crops them the same way. */
      .m-figure:not(.m-figure-centred) .m-media,
      video.m-media { max-height: 46vh; object-fit: cover; }
      .m-figure { margin: 0 0 1.15rem; }
      .m-figure-centred { text-align: center; }
      .m-figure-centred .m-media { margin: 0 auto; }
      .m-caption {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11.5px; color: rgba(0,0,0,0.42); margin-top: 0.4rem;
      }
      .m-heading {
        font-family: 'Celescript', cursive; font-size: 14px;
        letter-spacing: 0.06em; text-transform: uppercase; color: #111;
      }
      .m-credits {
        font-family: 'Celescript', cursive; font-size: 11px;
        letter-spacing: 0.04em; color: rgba(0,0,0,0.4);
        white-space: pre-line; line-height: 1.6;
      }
      .m-empty {
        font-family: 'Celescript', cursive; font-size: 13px;
        color: rgba(0,0,0,0.3);
      }
    }
  </style>
</head>
<body>

  <audio id="streamAudio" src="https://shell.kokott.art/ambient.mp3" preload="none"></audio>

  <header class="const-header">
    <a class="brand" href="index.html">
      <span class="brand-title">she tells</span>
      <span class="brand-sub">
        <svg class="brand-line" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55.87 5.06" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=".75"
            d="M.91,3.32c3.46.66,15.77,1.65,22.92.28,4.78-.91,15.54-2.85,19.76-2.83,3.81.02,8.93,0,11.38.86"/>
        </svg>
        sea shells
      </span>
    </a>
    <nav class="const-nav">
      <button class="c-btn c-btn-circle" id="btnInfo" aria-label="About">?</button>
      <button class="c-btn c-btn-circle lang-toggle" onclick="toggleLang()" aria-label="Switch language">PT</button>
      <button class="c-btn c-btn-outline" id="btnStream">&#9654;</button>
      <a href="memories.html" class="c-btn c-btn-filled" data-i18n="archive.contribute">contribute to the living archive</a>

    // ── HYPERSEA — intro text card (right of book, clear gap)
    [['hypersea'], 562, 264, 308, 272, null, { txt: { en: 'We have been using the Hypersea concept by Mark A. S. McMenamin (Author), Dianna L. Schulte McMenamin as prompts to remember and reimagine. Inviting participants to reconsider their entanglement with water, to recall the partial liquidity of their own bodies, and to sense the connective tissue that water forms across ecosystems. Here you can fin some related reading and our path to the Hypersea…', pt: 'Temos vindo a utilizar o conceito «Hypersea», da autoria de Mark A. S. McMenamin (autor) e Dianna L. Schulte McMenamin, como pontos de partida para recordar e reimaginar. Convidamos os participantes a reconsiderar a sua relação com a água, a recordar a liquidez parcial dos seus próprios corpos e a sentir o tecido conjuntivo que a água forma entre os ecossistemas. Aqui podem encontrar algumas leituras relacionadas e o nosso percurso até ao Hypersea' }, full: { en: 'We have been using the Hypersea concept by Mark A. S. McMenamin (Author), Dianna L. Schulte McMenamin as prompts to remember and reimagine. Inviting participants to reconsider their entanglement with water, to recall the partial liquidity of their own bodies, and to sense the connective tissue that water forms across ecosystems. Here you can fin some related reading and our path to the Hypersea…', pt: 'Temos vindo a utilizar o conceito «Hypersea», da autoria de Mark A. S. McMenamin (autor) e Dianna L. Schulte McMenamin, como pontos de partida para recordar e reimaginar. Convidamos os participantes a reconsiderar a sua relação com a água, a recordar a liquidez parcial dos seus próprios corpos e a sentir o tecido conjuntivo que a água forma entre os ecossistemas. Aqui podem encontrar algumas leituras relacionadas e o nosso percurso até ao Hypersea' } }],

    // ── HYPERSEA — glass text card (below book, spanning bottom-left)
    [['hypersea', 'sargassum'], 150, 504, 300, 248, null, { txt: { en: 'We created the glass sculptures working with the materiality of sand as an object of the Hypersea, a point of remembering. Sand is already sea, ground shell and rock and marine sediment gathered by the water, and in melting it into glass we make one more Hypersea gesture: sea-matter changing state, becoming a vessel that can hold field recordings from the Esposende coastline and the stories entangled with sargassum.', pt: 'Criámos as esculturas de vidro trabalhando com a materialidade da areia como um objeto do Hypersea, um ponto de memória. A areia já é mar, conchas trituradas, rocha e sedimentos marinhos reunidos pela água; e, ao fundi-la em vidro, fazemos mais um gesto do Hypersea: a matéria do mar muda de estado, tornando-se um recipiente capaz de conter gravações de campo da costa de Esposende e as histórias entrelaçadas com as algas sargaço.' }, full: { en: 'We created the glass sculptures working with the materiality of sand as an object of the Hypersea, a point of remembering. Sand is already sea, ground shell and rock and marine sediment gathered by the water, and in melting it into glass we make one more Hypersea gesture: sea-matter changing state, becoming a vessel that can hold field recordings from the Esposende coastline and the stories entangled with sargassum. The sculpture becomes a body of water in another form, a place where the ocean is remembered rather than extracted.', pt: 'Criámos as esculturas de vidro trabalhando com a materialidade da areia como um objeto do Hypersea, um ponto de memória. A areia já é mar, conchas trituradas, rocha e sedimentos marinhos reunidos pela água; e, ao fundi-la em vidro, fazemos mais um gesto do Hypersea: a matéria do mar muda de estado, tornando-se um recipiente capaz de conter gravações de campo da costa de Esposende e as histórias entrelaçadas com as algas sargaço. A escultura torna-se uma massa de água sob outra forma, um lugar onde o oceano é recordado em vez de extraído.' } }],

    [['sargassum'], 1080,  190, 180,  34, null, { link: 'https://www.visitesposende.com/en/fazer/monumentos/sargasso-museum', label: { en: 'Sargasso Museum →', pt: 'Museu do Sargaço →' } }],
    [['sargassum'], 1080,  238, 300, 260, null, { txt: { en: 'Esposende has an entanglement with sargassum that goes years and years back.\n\nWhen we set out for the research project, we asked how an old tradition reflects on the future. Futures of creating speculative ways of creating…', pt: 'Esposende tem uma ligação com as algas sargaço que remonta a muitos e muitos anos.\n\nQuando nos lançámos neste projeto de investigação, questionámo-nos sobre como uma tradição antiga se reflete no futuro. Futuros que envolvem formas…' }, full: { en: 'Esposende has an entanglement with sargassum that goes years and years back.\n\nWhen we set out for the research project, we asked how an old tradition reflects on the future. Futures of creating speculative ways of creating rituals, as an act of care, an act of observation, an act of listening, an act of remembering the water ecology we cohabit.\n\nAs Sargaceiros gleaned sargassum, today most interfaces glean data; we often think of this data as residing in an invisible cloud but forget the physical infrastructure it carries. As part of a speculative ritual, our project gleans memories of what has been and what could be for the futures of waters in Esposende.\n\nThe rising temperatures heavily affect the Esposende coast, as they do in a global network of water bodies. The changing water will also affect the kelp forests along the town\'s coast. We ask how we could speculate futures of tradition, how the kelp, once the heart of the livelihood of Esposende, could take its shape in communal futures.', pt: 'Esposende tem uma ligação com as algas sargaço que remonta a muitos e muitos anos.\n\nQuando nos lançámos neste projeto de investigação, questionámo-nos sobre como uma tradição antiga se reflete no futuro. Futuros que envolvem formas especulativas de criar rituais, como um ato de cuidado, um ato de observação, um ato de escuta, um ato de recordar a ecologia aquática com a qual coabitamos.\n\nTal como os Sargaceiros recolhiam sargaço, hoje em dia a maioria das interfaces recolhe dados; muitas vezes pensamos que esses dados residem numa nuvem invisível, mas esquecemo-nos da infraestrutura física que os suporta. Como parte de um ritual especulativo, o nosso projeto recolhe memórias do que foi e do que poderá ser para o futuro das águas em Esposende.\n\nO aumento das temperaturas afeta fortemente a costa de Esposende, tal como acontece numa rede global de massas de água. As alterações nas águas afetarão também as florestas de algas ao longo da costa da cidade. Questionamo-nos sobre como poderíamos especular sobre os futuros da tradição; como é que as algas, outrora o cerne do sustento de Esposende, poderiam assumir a sua forma em futuros comunitários.' } }],

    [['sargassum','local'], 1760,  502, 140,  92, null, { img: 'la/sargassum/sargaceiras-averomar.webp', alt: { en: 'Sargaceiras carrying seaweed up the beach at Aver-o-Mar, Póvoa de Varzim', pt: 'Sargaceiras a carregar algas na praia de Aver-o-Mar, Póvoa de Varzim' }, credit: { en: 'Aver-o-Mar, Póvoa de Varzim. Observador', pt: 'Aver-o-Mar, Póvoa de Varzim. Observador' }, sources: [{ href: 'https://observador.pt/2016/03/06/maresia-das-algas-do-areal-laboratorio/', label: { en: 'Observador. Maresia das algas, do areal ao laboratório', pt: 'Observador. Maresia das algas, do areal ao laboratório' } }] }],
    [['sargassum','local'], 1580,  502, 166, 118, 'Tidal Archive', { img: 'la/sargassum/sargaceiro-historico.jpg', alt: { en: 'A sargaceiro pulling a net of sargaço onto the sand', pt: 'Um sargaceiro a puxar uma rede de sargaço para a areia' }, credit: { en: 'Esposende, 1936. Biblioteca Municipal Manuel de Boaventura', pt: 'Esposende, 1936. Biblioteca Municipal Manuel de Boaventura' }, full: { en: 'For centuries the sargaço was gathered along the sands of Apúlia, in Esposende, by the sargaceiros and the sargaceiras, who kept one foot in the sea and one in the field. They waded out with a graveta and a long net, hauled the weed ashore, and left it to dry in the sun for three days before it was carried, together with pilado, onto the masseira fields: plots dug down towards the water table and fed by whatever the tide had given up. By royal decision the seaweed was free of any tax, which is part of why the practice took such hold here.\n\nThe harvest thinned as chemical fertiliser arrived and the masseira fields gave way. What remained moved sideways rather than disappearing: sargaço is gathered today mainly for the pharmaceutical, cosmetic and food industries, and the Museu do Sargaço in Apúlia keeps the tools, the boats and the clothing of the older economy.\n\nOffshore, the same coast holds something the sargaceiras and the sargaceiros had no word for. The kelp forests of northern Portugal, largely Laminaria hyperborea and Saccorhiza polyschides, are estimated to store some 16.5 gigagrams of carbon across roughly 5,100 hectares, and to export around a third of the carbon captured each year by all of the country\'s marine plant habitats. Researchers at CIIMAR and MARE have also recorded a tropicalisation of Portuguese waters that puts those forests, and everything living in them, at risk.\n\nSo the question the tradition leaves open is not whether sargaço will be gathered, but what gathering will come to mean.', pt: 'Durante séculos o sargaço foi recolhido nos areais da Apúlia, em Esposende, pelos sargaceiros e pelas sargaceiras, que mantinham um pé no mar e outro na terra. Entravam na água com uma graveta e uma rede comprida, arrastavam a alga para a praia e deixavam-na secar ao sol durante três dias, antes de ser levada, juntamente com o pilado, para os campos de masseira: courelas cavadas em direção ao lençol freático e alimentadas pelo que a maré ia entregando. Por decisão régia, o sargaço estava isento de qualquer imposto, o que ajuda a explicar a força que a prática ganhou aqui.\n\nA apanha foi diminuindo à medida que chegou o adubo químico e os campos de masseira foram cedendo. O que restou deslocou-se em vez de desaparecer: hoje o sargaço é recolhido sobretudo para as indústrias farmacêutica, cosmética e alimentar, e o Museu do Sargaço, na Apúlia, guarda as alfaias, os barcos e o vestuário dessa economia mais antiga.\n\nAo largo, a mesma costa guarda algo para que as sargaceiras e os sargaceiros não tinham palavra. As florestas de kelp do norte de Portugal, sobretudo Laminaria hyperborea e Saccorhiza polyschides, armazenam cerca de 16,5 gigagramas de carbono em aproximadamente 5100 hectares e exportam perto de um terço do carbono captado anualmente por todos os habitats de plantas marinhas do país. Investigadores do CIIMAR e do MARE registaram também uma tropicalização das águas portuguesas que coloca em risco essas florestas e tudo o que nelas vive.\n\nA questão que a tradição deixa em aberto não é, portanto, se o sargaço continuará a ser recolhido, mas o que passará a significar recolhê-lo.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' }, sources: [{ href: 'https://www.visitesposende.com/en/fazer/monumentos/sargasso-museum', label: { en: 'Museu do Sargaço, Esposende. The harvesting tradition, the tools and the masseira fields', pt: 'Museu do Sargaço, Esposende. A tradição da apanha, as alfaias e os campos de masseira' } }, { href: 'https://www.ciimar.up.pt/marine-forests-in-northern-portugal-allies-in-the-fight-against-climate-change/', label: { en: 'CIIMAR. Marine forests in northern Portugal, allies against climate change', pt: 'CIIMAR. Florestas marinhas no norte de Portugal, aliadas contra as alterações climáticas' } }, { href: 'https://www.mare-centre.pt/en/kelp_carbon', label: { en: 'MARE. The carbon sequestration potential of kelp', pt: 'MARE. O potencial de sequestro de carbono do kelp' } }, { href: 'https://arquivos.rtp.pt/conteudos/o-sargaceiro-da-apulia/', label: { en: 'RTP Arquivos. O Sargaceiro da Apúlia', pt: 'RTP Arquivos. O Sargaceiro da Apúlia' } }, { href: 'https://observador.pt/2016/03/06/maresia-das-algas-do-areal-laboratorio/', label: { en: 'Observador. Maresia das algas, do areal ao laboratório', pt: 'Observador. Maresia das algas, do areal ao laboratório' } }] }],

  /* ═══════════════════════════════════════════════════
     CATMULL-ROM OPEN PATH
     For open (non-closed) smooth curves through points.
  ═══════════════════════════════════════════════════ */
  function catmullOpen(pts, tension = 0.38) {
    const n = pts.length;
    if (n < 2) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(i + 2, n - 1)];
      const cp1x = (p1[0] + (p2[0] - p0[0]) * tension).toFixed(1);
      const cp1y = (p1[1] + (p2[1] - p0[1]) * tension).toFixed(1);
      const cp2x = (p2[0] - (p3[0] - p1[0]) * tension).toFixed(1);
      const cp2y = (p2[1] - (p3[1] - p1[1]) * tension).toFixed(1);
      d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ═══════════════════════════════════════════════════
     QUADRATIC BEZIER CONNECTION between two cluster centers
     bend: how far the midpoint curves off the straight line
     (positive = left of direction, negative = right)
  ═══════════════════════════════════════════════════ */
  function connectionPath(x1, y1, x2, y2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    // Perpendicular unit vector
    const px = -dy / len, py = dx / len;
    const offset = len * bend;
    const cx = (x1 + x2) / 2 + px * offset;
    const cy = (y1 + y2) / 2 + py * offset;
    return `M ${x1.toFixed(0)},${y1.toFixed(0)} Q ${cx.toFixed(0)},${cy.toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`;
  }

  /* ═══════════════════════════════════════════════════
     BUILD CONNECTION LINES
  ═══════════════════════════════════════════════════ */
  const svg = document.getElementById('linesSvg');
  // Keep the line layer exactly as large as the canvas, so connection lines to
  // the outermost clusters are never clipped when the canvas is resized.
  const canvasEl = document.getElementById('canvasInner');
  svg.setAttribute('width',  canvasEl.offsetWidth);
  svg.setAttribute('height', canvasEl.offsetHeight);

  CONNECTIONS.forEach(({ from, to, bend }) => {
    const [x1, y1] = CENTERS[from];
    const [x2, y2] = CENTERS[to];
    const color = CAT_MAP[from]?.color || '#999';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', connectionPath(x1, y1, x2, y2, bend));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-opacity', '0.55');
    path.setAttribute('stroke-linecap', 'round');
    path.dataset.connection = `${from}-${to}`;
    svg.appendChild(path);
  });

  /* ═══════════════════════════════════════════════════
     BUILD CARDS
  ═══════════════════════════════════════════════════ */
  const canvasInner = document.getElementById('canvasInner');

  let prevWrap = null;   // previous card, for content.stackBelow
  CARDS.forEach(([cats, x, y, w, h, title, content]) => {
    const colors = cats.map(k => CAT_MAP[k].color);

    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.dataset.cats = cats.join(',');
    wrap.dataset.primaryCat = cats[0];
    wrap.style.cssText = `left:${x}px; top:${y}px; width:${w}px; cursor:pointer;`;

    const card = document.createElement('div');
    card.className = 'card';
    // Text and credits cards hug their content; everything else keeps its authored height
    const hugsContent = !!(content && (content.txt || content.credits));
    card.style.cssText = `width:${w}px;` + (hugsContent ? '' : ` height:${h}px;`);

    if (content && content.img) {
      const img = document.createElement('img');
      img.src = content.img;
      // A photograph that has not landed yet must not leave a broken or empty
      // card: hide the image and fall back to the card's title.
      img.addEventListener('error', () => {
        img.style.display = 'none';
        if (title && !card.querySelector('.card-title')) {
          card.classList.add('card-img-missing');
          const t2 = document.createElement('span');
          t2.className = 'card-title';
          onLang(() => { t2.textContent = L(title); });
          card.appendChild(t2);
        }
      });
      onLang(() => { img.alt = L(content.alt) || ''; });
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(img);
    } else if (content && content.vid) {
      const vid = document.createElement('video');
      vid.src = content.vid; vid.muted = true; vid.loop = true;
      vid.playsInline = true; vid.preload = 'none';
      vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(vid);
    } else if (content && (content.link || content.goTo)) {
      card.className += ' card-link-pill';
      const span = document.createElement('span');
      span.className = 'card-link-text';
      onLang(() => { span.textContent = L(content.label); });
      card.appendChild(span);
    } else if (content && content.txt) {
      card.className += ' card-text-box';
      const pre = document.createElement('p');
      pre.className = 'card-text-preview';
      // separate text node so the inline hint survives a language swap
      const preText = document.createTextNode('');
      const hint = document.createElement('span');
      hint.className = 'card-text-hint';
      pre.appendChild(preText);
      pre.appendChild(hint);
      onLang(() => {
        preText.nodeValue = L(content.txt) + ' ';
        hint.textContent = t('archive.readmore');
      });
      card.appendChild(pre);
    } else if (content && content.credits) {
      card.className += ' card-credits-box';
      const span = document.createElement('span');
      span.className = 'card-credits-text';
      onLang(() => {
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        span.textContent = L(content.credits) + (note ? '\n' + note : '');
      });
      card.appendChild(span);
    } else {
      const band = document.createElement('div');
      band.className = 'card-band';
      if (colors.length === 1) {
        band.style.background = colors[0];
      } else {
        const stops = colors.map((c,i) => {
          const pct = 100 / colors.length;
          return `${c} ${(i*pct).toFixed(0)}%, ${c} ${((i+1)*pct).toFixed(0)}%`;
        }).join(', ');
        band.style.background = `linear-gradient(to right, ${stops})`;
      }
      const body = document.createElement('div');
      body.className = 'card-body';
      if (title) {
        // named titleEl, not t — t() is the global translator from lang.js
        const titleEl = document.createElement('span');
        titleEl.className = 'card-title';
        onLang(() => { titleEl.textContent = L(title); });
        body.appendChild(titleEl);
      }
      card.appendChild(band);
      card.appendChild(body);
    }

    const dots = document.createElement('div');
    dots.className = 'card-cats-dots';
    cats.forEach(k => {
      const d = document.createElement('span');
      d.className = 'cat-dot';
      d.style.background = CAT_MAP[k].color;
      dots.appendChild(d);
    });

    wrap.appendChild(card);
    // Dots mark cross-cluster relationships, so only show them when a card
    // actually carries more than one tag. Credits cards never show them.
    if (cats.length > 1 && !(content && content.credits)) {
      wrap.appendChild(dots);
    }

    // Per-card random float parameters
    const rSign = () => (Math.random() < 0.5 ? 1 : -1);
    wrap.style.setProperty('--fx',    (rSign() * (2 + Math.random() * 3)).toFixed(2) + 'px');
    wrap.style.setProperty('--fy',    (rSign() * (1.5 + Math.random() * 2.5)).toFixed(2) + 'px');
    wrap.style.setProperty('--fr',    (rSign() * (0.3 + Math.random() * 0.6)).toFixed(3));
    wrap.style.setProperty('--fdur',  (5 + Math.random() * 3.5).toFixed(1) + 's');
    wrap.style.setProperty('--fdelay',(-(Math.random() * 9)).toFixed(2) + 's');

    let _spx = 0, _spy = 0, _spt = 0;
    wrap.addEventListener('pointerdown', e => {
      _spx = e.clientX; _spy = e.clientY; _spt = Date.now();
      e.stopPropagation();
    }, { passive: true });
    wrap.addEventListener('pointerup', e => {
      if (Math.hypot(e.clientX - _spx, e.clientY - _spy) > 12 || Date.now() - _spt > 600) return;
      if (content && content.goTo) {
        flyToCluster(content.goTo);
      } else if (content && content.img && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.img) {
        openMediaPopup({ img: content.img, alt: content.alt, credit: content.credit, full: content.full, note: content.note, sources: content.sources, title }, cats[0]);
      } else if (content && content.vid) {
        openMediaPopup({ vid: content.vid, title }, cats[0]);
      } else if (content && content.txt) {
        openTextPopup(content.full || content.txt, cats[0]);
      } else if (!content || (!content.credits)) {
        openPanel(cats[0]);
      }
    }, { passive: true });

    canvasInner.appendChild(wrap);

    // A card marked stackBelow sits directly under the previous card rather
    // than at a fixed y. Text cards hug their content, so their height
    // changes with the language — anything pinned underneath them would
    // otherwise collide once the copy gets longer in translation.
    if (content && content.stackBelow) {
      const anchor = prevWrap;
      const gap = content.gap ?? 6;
      // registered after the anchor's own text updater, so it measures the
      // height the anchor has *after* the language swap
      onLang(() => { wrap.style.top = (anchor.offsetTop + anchor.offsetHeight + gap) + 'px'; });
    }
    prevWrap = wrap;
  });

  /* ═══════════════════════════════════════════════════
     BUILD CLUSTER LABELS
  ═══════════════════════════════════════════════════ */
  // Categories whose colour is light enough to need dark text on the cluster label
  const YELLOW_CATS = new Set(['hypersea', 'workshop', 'drawings']);

  CATS.forEach(({ key, label, color }) => {
    // Anchor the header to the cards that actually live in this cluster.
    // cats.includes() pulled in cross-tagged cards owned by other clusters,
    // which dragged e.g. the Sargassum header into the middle of Hypersea.
    // Cross-cluster ties are shown by the connection lines and card dots.
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity;
    members.forEach(([, x, y, w]) => {
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x + w);
      minY = Math.min(minY, y);
    });

    const cx = (minX + maxX) / 2;
    const lbl = document.createElement('div');
    lbl.className = 'cluster-label';
    lbl.dataset.cat = key;
    onLang(() => { lbl.textContent = L(label); });
    lbl.style.left   = cx + 'px';
    lbl.style.top    = (minY - 54) + 'px';
    lbl.style.background = color;
    lbl.style.color = YELLOW_CATS.has(key) ? '#1a1200' : '#ffffff';
    lbl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (key === 'hypersea') {
        window.location.href = 'hypersea.html';
      } else {
        openPanel(key);
      }

    canvasInner.appendChild(lbl);
  });

  /* ═══════════════════════════════════════════════════
     BUILD LEGEND
  ═══════════════════════════════════════════════════ */
  const legendEl = document.getElementById('mapLegend');
  let activeFilter = null;

  CATS.forEach(({ key, label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cat = key;

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const lbl = document.createElement('span');
    lbl.className = 'legend-label';
    onLang(() => { lbl.textContent = L(label); });

    item.appendChild(dot);
    item.appendChild(lbl);
    legendEl.appendChild(item);

    item.addEventListener('click', () => {
      if (activeFilter === key) {
        activeFilter = null;
        applyFilter(null);
        flyToOverview();
      } else {
        activeFilter = key;
        applyFilter(key);
        flyToCluster(key);
      }
    });
  });

  function applyFilter(key) {
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    document.querySelectorAll('.card-wrap').forEach(el => {
      const cats = el.dataset.cats.split(',');
      el.classList.toggle('dimmed', key !== null && !cats.includes(key));
    });
    document.querySelectorAll('.cluster-label').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    svg.querySelectorAll('path').forEach(el => {
      const conn = el.dataset.connection || '';
      const relevant = key === null || conn.includes(key);
      el.style.transition = 'opacity 0.22s ease';
      el.style.opacity = relevant ? '' : '0.04';
    });
  }

  /* ── Compute bounding box of all cards for a category ── */
  function clusterBounds(key) {
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    members.forEach(([, x, y, w, h]) => {
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, minY,
             w: maxX - minX, h: maxY - minY };
  }

  /* ── Animated fly to a cluster ── */
  let flyTimer = null;

  function flyTo(targetTx, targetTy, targetScale) {
    canvasInner.style.transition = 'transform 0.72s cubic-bezier(0.4, 0, 0.2, 1)';
    scale = targetScale;
    tx = targetTx;
    ty = targetTy;
    applyTransform();
    clearTimeout(flyTimer);
    flyTimer = setTimeout(() => { canvasInner.style.transition = ''; }, 800);
  }

  function flyToCluster(key) {
    const bounds = clusterBounds(key);
    if (!bounds) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const legendW = document.getElementById('mapLegend')?.offsetWidth || 220;
    const usableW = vw - legendW;
    const PAD = 60;
    // Fit the cluster if it is small, but never drop below MIN_READ: at the
    // old fit-everything scale a cluster the size of Hypersea landed around
    // 0.8x and the card text and photos were too small to read. Anything
    // taller than the viewport can be reached by dragging.
    const MIN_READ = 1.25, MAX_ZOOM = 1.8;
    const fit = Math.min(
      usableW / (bounds.w + PAD * 2),
      vh      / (bounds.h + PAD * 2),
      MAX_ZOOM
    );
    const targetScale = Math.max(fit, MIN_READ);
    // Center within the usable area (right of legend)
    const centerX = legendW + usableW / 2;
    // A cluster taller than the viewport should start at its top — its header
    // and opening cards — and be scrolled down through, rather than being
    // centred so that both ends are cut off.
    const LABEL_ROOM = 70;
    const fitsVertically = bounds.h * targetScale <= vh;
    const ty = fitsVertically
      ? vh / 2 - bounds.cy * targetScale
      : LABEL_ROOM - (bounds.minY - 54) * targetScale;
    flyTo(centerX - bounds.cx * targetScale, ty, targetScale);
  }

  /* Width reserved on the left for the legend panel, so the overview and
     the per-cluster fly-to never park content underneath it. */
  const LEGEND_GUTTER = 240;

  /* Measure the real extent of the map so the overview never goes stale
     when clusters are moved or the canvas is resized. */
  function contentBounds() {
    const PAD = 120;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvasInner.querySelectorAll('.card-wrap, .cluster-label').forEach(el => {
      const w = el.offsetWidth, h = el.offsetHeight;
      // cluster labels are centred on their x via translateX(-50%)
      const x = el.classList.contains('cluster-label') ? el.offsetLeft - w / 2 : el.offsetLeft;
      const y = el.offsetTop;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (!isFinite(minX)) return { x: 0, y: 0, w: 1000, h: 1000 };
    return { x: minX - PAD, y: minY - PAD, w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2 };
  }

  function flyToOverview() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    const targetScale = Math.min(availW / b.w, vh / b.h) * 0.92;
    flyTo(
      LEGEND_GUTTER + (availW - b.w * targetScale) / 2 - b.x * targetScale,
      (vh - b.h * targetScale) / 2 - b.y * targetScale,
      targetScale
    );
  }

  /* ═══════════════════════════════════════════════════
     PAN + ZOOM
  ═══════════════════════════════════════════════════ */
  const viewport = document.getElementById('viewport');
  let scale = 0.36;
  let tx = 0, ty = 0;
  let isPanning = false;
  let startX = 0, startY = 0;
  let dragOriginX = 0, dragOriginY = 0;
  let didDrag = false;

  let videoTimer = null;
  function updateVideos() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    document.querySelectorAll('.card-wrap').forEach(wrap => {
      const vid = wrap.querySelector('video');
      if (!vid) return;
      const cx = parseFloat(wrap.style.left);
      const cy = parseFloat(wrap.style.top);
      const cw = parseFloat(wrap.style.width);
      const cardEl = wrap.querySelector('.card');
      const ch = cardEl ? parseFloat(cardEl.style.height) : 80;
      const sx = cx * scale + tx, sy = cy * scale + ty;
      const visible = (cx + cw) * scale + tx > 0 && sx < vw &&
                      (cy + ch) * scale + ty > 0 && sy < vh;
      if (visible && scale > 0.45) {
        if (vid.paused) vid.play().catch(() => {});
      } else {
        if (!vid.paused) vid.pause();
      }
    });
  }

  function applyTransform() {
    canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    clearTimeout(videoTimer);
    videoTimer = setTimeout(updateVideos, 350);
  }

  function initView() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    scale = Math.min(availW / b.w, vh / b.h) * 0.92;
    tx = LEGEND_GUTTER + (availW - b.w * scale) / 2 - b.x * scale;
    ty = (vh - b.h * scale) / 2 - b.y * scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-controls')) return;
    isPanning = true;
    didDrag = false;
    startX = e.clientX; startY = e.clientY;
    dragOriginX = e.clientX; dragOriginY = e.clientY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!isPanning) return;
    const moved = Math.hypot(e.clientX - dragOriginX, e.clientY - dragOriginY);
    if (moved > 14) didDrag = true;
    tx += e.clientX - startX;
    ty += e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    applyTransform();
  });

  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
    setTimeout(() => { didDrag = false; }, 50);
  });

  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.11 : 0.90;
    const newScale = Math.max(0.15, Math.min(3, scale * factor));
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }, { passive: false });

  let pinchDist = 0;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const pcx = cx - rect.left, pcy = cy - rect.top;
    const canX = (pcx - tx) / scale;
    const canY = (pcy - ty) / scale;
    scale = Math.max(0.15, Math.min(3, scale * (d / pinchDist)));
    tx = pcx - canX * scale;
    ty = pcy - canY * scale;
    pinchDist = d;
    applyTransform();
  }, { passive: false });

  function zoomToCenter(f) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2, cy = vh / 2;
    const newScale = Math.max(0.15, Math.min(3, scale * f));
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }

  document.getElementById('btnZoomIn').addEventListener('click',  () => zoomToCenter(1.3));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomToCenter(0.77));

  // Init once layout is fully painted (requestAnimationFrame ensures flex heights are settled)
  if (document.readyState === 'complete') {
    requestAnimationFrame(initView);
  } else {
    window.addEventListener('load', () => requestAnimationFrame(initView));
  }
  window.addEventListener('resize', initView);

  /* ── H key → center ── */
  document.addEventListener('keydown', e => {

  );

  idleTimer = setTimeout(goIdle, 2000);

  // The map places cards spatially; a phone needs a reading order, so group
  // by kind: words first, then what to read next, then the images, then credits.
  function notesOrder(cards) {
    const rank = c => {
      const k = c[6];
      if (k && k.txt) return 0;
      if (k && ((k.link && !k.img) || k.goTo)) return 1;
      if (k && (k.img || k.vid)) return 2;
      if (!k) return 3;
      if (k && k.credits) return 4;
      return 3;
    };
    return cards.map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(p => p[0]);
  }

          st.textContent = L(content.full);
          mNotesBody.appendChild(st);

        if (L(content.note)) {

        v.className = 'm-media'; v.src = content.vid;
        v.controls = true; v.playsInline = true; v.preload = 'metadata';
        mNotesBody.appendChild(v); rendered++;
      } else if (content && content.credits) {
        const p = document.createElement('p');
        p.className = 'm-credits';
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        p.textContent = L(content.credits) + (note ? '\n' + note : '');
        mNotesBody.appendChild(p); rendered++;
      } else if (title) {
        const h = document.createElement('p');
        h.className = 'm-heading';
        h.textContent = L(title);
        mNotesBody.appendChild(h); rendered++;
      }
    });

    if (!rendered) {
      const p = document.createElement('p');
      p.className = 'm-empty';
      p.textContent = t('archive.placeholder');
      mNotesBody.appendChild(p);
    }

    mList.hidden = true; mCta.hidden = true; mNotes.hidden = false;
    window.scrollTo(0, 0);
    openNotesKey = key;
  }

  function closeNotes() {
    mNotes.hidden = true; mList.hidden = false; mCta.hidden = false;
    openNotesKey = null;
  }
  let openNotesKey = null;
  mBack.addEventListener('click', closeNotes);
  onLang(() => {
    mBack.textContent = '← ' + t('archive.back');
    if (openNotesKey) openNotes(openNotesKey);   // redraw notes in the new language
  });

  const streamAudio = document.getElementById('streamAudio');
  const btnStream   = document.getElementById('btnStream');
  let streamPlaying = false;

  btnStream.addEventListener('click', () => {
    if (streamPlaying) {
      streamAudio.pause();
      btnStream.innerHTML = '&#9654;';
      btnStream.classList.remove('playing');
    } else {
      streamAudio.play();
      btnStream.innerHTML = '&#9646;&#9646;';
      btnStream.classList.add('playing');
    }
    streamPlaying = !streamPlaying;
  });
  </script>

</body>
</html>
