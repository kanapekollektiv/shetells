<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>she tells — the living archive</title>
  <script src="lang.js?v=9"></script>
  <script src="content.js?v=22"></script>
  <style>
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Fonts/Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1.2rem; text-decoration: none; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(52px, 7.5vw, 108px);
      line-height: 1;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(13px, 1.6vw, 22px);
      color: #111111;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5em;
      white-space: nowrap;
    }

    .brand-line {
      display: inline-block;
      height: clamp(8px, 1vw, 12px);
      width: clamp(40px, 4vw, 60px);
      flex-shrink: 0;
    }

    /* ── Nav buttons (mirrors main page style) ── */
    .const-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      align-self: flex-start;
      padding-top: 0.2rem;
    }

    .c-btn {
      font-family: 'Celescript', cursive;
      font-size: clamp(11px, 1.2vw, 16px);
      cursor: pointer;
      border: none;
      transition: background 0.18s, color 0.18s, transform 0.12s;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .c-btn:active { transform: scale(0.96); }

    .c-btn-circle {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      border: 1.5px solid #111111;
      background: transparent;
      color: #111111;
    }
    .c-btn-circle:hover { background: #111111; color: #ffffff; }

    .c-btn-filled {
      background: #111111;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
    }
    .c-btn-filled:hover { background: #333; }

    .c-btn-outline {
      background: transparent;
      color: #111111;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
      border: 1.5px solid #111111;
    }
    .c-btn-outline:hover { background: #111111; color: #ffffff; }
    .c-btn-outline.playing { background: #111111; color: #ffffff; }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 4300px;
      height: 2500px;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 1px 4px rgba(0,0,0,0.10),
        0 3px 10px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    /* Some cards are the drawing itself rather than an object on the map, so
       they carry no box: no shadow, no hairline, nothing but the artwork. */
    .card-bare {
      box-shadow: none;
      border-radius: 0;
      background: transparent;
    }
    .card-bare:hover {
      box-shadow: none;
      transform: translateY(-4px) scale(1.04);
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 8px 24px rgba(0,0,0,0.14),
        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
      flex-shrink: 0;
    }

    .card-body {
      width: 100%;
      flex: 1;
      background: #DAD7D0;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }

    .card-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 10px;
      color: rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    /* Opt in with mapTitle. A carousel is a stack of images and nothing on the
       map says what it is, so a card can carry its name underneath. Off by
       default: it adds height below the card, which the packer does not know
       about. */
    .card-maptitle {
      display: block; margin-top: 7px; text-align: center;
      font-family: 'Celescript', cursive; font-size: 11px;
      letter-spacing: 0.04em; color: rgba(0,0,0,0.5); line-height: 1.35;
    }

    .card-cats-dots {
      display: flex;
      gap: 3px;
      justify-content: center;
    }

    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .map-legend {
      position: fixed;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 1.1rem 1.3rem;
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .legend-item:not(.dimmed):hover .legend-dot { transform: scale(1.45); }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      color: #111111;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.9);
      color: #111111;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .zoom-btn:hover { background: #111111; color: #fff; border-color: #111111; }

    .map-hint {
      position: absolute;
      bottom: 16px; right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.55);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 20;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 8px 14px;
      line-height: 1.7;
      text-align: right;
    }

    /* ── Filter transitions ── */
    .card-wrap { transition: opacity 0.22s ease; }
    .card-wrap.dimmed { opacity: 0.08; }
    .card-wrap:hover { z-index: 30 !important; position: relative; }

    /* ── Idle water-float ── */
    @keyframes floatWater {
      0%   { transform: translate(0px, 0px); }
      20%  { transform: translate(var(--fx), calc(var(--fy) * -1)); }
      45%  { transform: translate(calc(var(--fx) * -0.6), var(--fy)); }
      70%  { transform: translate(calc(var(--fx) * 0.4), calc(var(--fy) * -0.8)); }
      100% { transform: translate(0px, 0px); }
    }

    .canvas-idle .card-wrap {
      animation: floatWater var(--fdur, 7s) ease-in-out infinite var(--fdelay, 0s);
    }

    /* ── Cluster headline labels ── */
    .cluster-label {
      position: absolute;
      transform: translateX(-50%);
      font-family: 'Celescript', cursive;
      font-size: 13pt;
      line-height: 1;
      padding: 8px 22px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      z-index: 6;
      transition: opacity 0.22s ease;
    }
    .cluster-label.dimmed { opacity: 0.05; }

    /* ── Link pill card ── */
    .card-link-pill {
      border-radius: 999px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.2);
      box-shadow: none !important;
      display: flex; align-items: center; justify-content: center;
      overflow: visible !important;
    }
    .card-link-pill:hover { background: #f5f5f5; transform: none !important; }
    .card-link-text {
      font-family: 'Celescript', cursive;
      font-size: 10px; color: #111; letter-spacing: 0.04em; white-space: nowrap;
    }

    .card-img-missing {
      display: flex; align-items: center; justify-content: center;
      background: #f2f2f2; padding: 8px;
    }

    .card-gallery { position: relative; background: #f2f2f2; }
    .gal-dots {
      position: absolute; left: 0; right: 0; bottom: 4px;
      display: flex; justify-content: center; gap: 3px; pointer-events: none;
    }
    .gal-dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 0 2px rgba(0,0,0,0.4);
    }
    .gal-dots span.on { background: #fff; }
    .gal-stage {
      position: relative; background: #f4f4f4;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; min-height: 220px;
    }
    .gal-stage img {
      max-width: 100%; max-height: 66vh;
      object-fit: contain; display: block; border-radius: 4px;
    }
    .gal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.92);
      font-size: 20px; line-height: 1; cursor: pointer; color: #222;
    }
    .gal-nav:hover { background: #fff; }
    .gal-prev { left: 10px; }
    .gal-next { right: 10px; }
    .gal-bar {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; padding: 0.8rem 1.2rem 1.4rem;
    }
    .gal-cap {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.6; color: #555; margin: 0;
    }
    .gal-count {
      font-family: 'Celescript', cursive; font-size: 11px;
      color: rgba(0,0,0,0.4); white-space: nowrap;
    }

    .gal-intro {
      padding: 0.2rem 1.2rem 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.78; color: #333; white-space: pre-line;
    }
    .gal-title {
      padding: 1rem 1.2rem 0; margin: 0;
      font-family: 'Celescript', cursive; font-size: 16px;
      letter-spacing: 0.05em; color: #111;
    }
    .gal-entry { padding: 0 1.2rem 1.2rem; }
    .gal-entry h3 {
      font-family: 'Celescript', cursive; font-size: 14px;
      letter-spacing: 0.05em; color: #111; margin: 0 0 0.35rem;
    }
    .gal-entry p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px; line-height: 1.72; color: #444;
      margin: 0 0 0.5rem; white-space: pre-line;
    }
    .gal-entry a {
      display: block; font-family: system-ui, -apple-system, sans-serif;
      font-size: 12.5px; line-height: 1.6; color: #3a3a3a; margin-bottom: 0.25rem;
    }

    /* ── Text preview card ── */
    .card-text-box {
      border-radius: 12px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
      padding: 11px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .card-text-box:hover { border-color: rgba(0,0,0,0.3) !important; }
    .card-text-preview {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; line-height: 1.52; color: #333;
      white-space: pre-line;
      /* A card opens with about seven lines and the rest slides down when the
         reader asks for it. This is a max-height rather than a line clamp
         because a clamp cannot be animated, and 117px is seven lines at this
         size, so the cut still lands on a line. */
      max-height: 117px;
      overflow: hidden;
      transition: max-height 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .card-text-title {
      font-family: 'Celescript', cursive;
      font-size: 12px; letter-spacing: 0.05em; color: #111; margin: 0;
    }
    .card-text-hint {
      font-family: 'Celescript', cursive;
      font-size: 8.5px; color: rgba(0,0,0,0.28); letter-spacing: 0.05em; white-space: nowrap;
    }

    /* ── Credits card ── */
    .card-credits-box {
      background: transparent; border: none;
      box-shadow: none !important; padding: 2px 0;
    }
    .card-credits-box:hover { transform: none !important; box-shadow: none !important; }
    .card-credits-text {
      font-family: 'Celescript', cursive;
      font-size: 9px; color: rgba(0,0,0,0.38); letter-spacing: 0.04em; line-height: 1.5;
      white-space: pre-line;
    }

    /* ── Card Popup Modal (matches ? info overlay style) ── */
    .card-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .card-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .card-popup {
      background: #ffffff;
      color: #111111;
      border: 1.5px solid #111111;
      border-radius: 1.2rem;
      max-width: 680px;
      width: 90%;
      max-height: 78vh;
      overflow: hidden;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    .card-overlay.active .card-popup { transform: translateY(0); }

    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
    }
    .dp-chip-set { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .dp-chip {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 14px;
      letter-spacing: 0.05em;
    }
    .dp-close {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 1.4rem;
      color: #111111;
      line-height: 1;
      padding: 2px 6px;
      transition: opacity 0.15s;
    }
    .dp-close:hover { opacity: 0.5; }

    .dp-body {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #111111 rgba(0,0,0,0.06);
    }
    .dp-body::-webkit-scrollbar { width: 6px; }
    .dp-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.06); }
    .dp-body::-webkit-scrollbar-thumb { background: #111111; }

    .dp-hero { width: 100%; overflow: hidden; flex-shrink: 0; }
    .dp-hero img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

    .dp-content { padding: 1.5rem 1.6rem 2.5rem; }
    .dp-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 1rem;
    }
    .dp-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.78;
      color: #444;
      margin-bottom: 1.4rem;
    }
    .dp-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 1.2rem 0; }
    .dp-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 0.9rem;
    }
    .dp-book {
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .dp-book-cover {
      width: 68px; flex-shrink: 0;
      border-radius: 3px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }
    .dp-book-cover img { width: 100%; display: block; }
    .dp-book-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 15px;
      color: #111; line-height: 1.3; margin-bottom: 0.25rem;
    }
    .dp-book-author {
      font-family: system-ui, sans-serif;
      font-size: 12px; color: rgba(0,0,0,0.42); margin-bottom: 0.6rem;
    }
    .dp-pill {
      font-family: 'Celescript', cursive;
      font-size: 10px; border-radius: 999px;
      padding: 3px 13px; text-decoration: none;
      display: inline-flex; transition: opacity 0.15s;
    }
    .dp-pill:hover { opacity: 0.75; }
    .dp-ext-link {
      display: flex; align-items: baseline; gap: 0.8rem;
      text-decoration: none; padding: 0.75rem 1rem;
      border: 1.5px solid rgba(0,0,0,0.09); border-radius: 10px;
      margin-bottom: 0.5rem; transition: border-color 0.18s, background 0.18s;
    }
    .dp-ext-link:hover { background: rgba(0,0,0,0.025); border-color: rgba(0,0,0,0.22); }
    .dp-ext-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 14px; color: #111; flex: 1; line-height: 1.4;
    }
    .dp-ext-arrow { font-size: 12px; flex-shrink: 0; opacity: 0.45; }
    .dp-photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 5px; margin-bottom: 5px;
    }
    .dp-photo-grid img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-video-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px; margin-bottom: 0.8rem;
    }
    .dp-video-grid video {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-credits {
      font-family: 'Celescript', cursive;
      font-size: 10px; letter-spacing: 0.05em; color: rgba(0,0,0,0.35);
    }
    .dp-mt-notice {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px; font-style: italic;
      color: rgba(0,0,0,0.3); margin-top: 0.4rem;
    }
    .dp-placeholder {
      font-family: 'Celescript', cursive;
      font-size: 12px; color: rgba(0,0,0,0.28);
      letter-spacing: 0.06em; margin-top: 1.6rem;
    }

    /* ══ Mobile: list of clusters -> field notes ══════════════════════ */
    .m-view { display: none; }

    @media (max-width: 768px) {
      .map-viewport, .map-legend { display: none !important; }
      /* the map pins the page to the viewport; the list has to scroll */
      html, body { overflow: auto !important; height: auto !important; }
      .m-view { display: block; padding: 0 1.25rem 3rem; }
      /* explicit display rules below would otherwise beat the hidden attribute */
      .m-view [hidden] { display: none !important; }

      .const-header { flex-direction: column; align-items: flex-start; gap: 0.9rem; }
      .const-nav { gap: 0.5rem; }
      .const-nav .c-btn-filled { display: none; }   /* returns at the list foot */

      .m-list { list-style: none; margin: 1.5rem 0 0; padding: 0; }
      .m-item {
        display: flex; align-items: center; gap: 1rem;
        padding: 1.15rem 0.25rem;
        border-bottom: 1.5px solid var(--black, #111);
        cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
        width: 100%; text-align: left;
        font-family: 'Celescript', cursive; font-size: 15px;

  const ML_NOTE = { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' };

  // Text in content.js is indented to line up with the entry holding it.
  // Strip that shared indent, so a paragraph break is only a paragraph break.
  function dedent(s) {
    if (typeof s !== 'string' || s.indexOf('\n') < 0) return s;
    const lines = s.split('\n');
    let pad = Infinity;
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      pad = Math.min(pad, lines[i].match(/^ */)[0].length);
    }
    if (!isFinite(pad) || pad === 0) return s;
    return lines.map((l, i) => i === 0 ? l : l.slice(pad)).join('\n');
  }

  function dedentDeep(v) {
    if (typeof v === 'string') return dedent(v);
    if (Array.isArray(v)) return v.map(dedentDeep);
    if (v && typeof v === 'object') {
      const o = {};
      for (const k in v) o[k] = dedentDeep(v[k]);
      return o;
    }
    return v;
  }

  const CARDS = CARDS_LAYOUT.map(function (card) {
    const cats = card[0], x = card[1], y = card[2], w = card[3], h = card[4];
    const id = card[5], flags = card[6];
    let title = null, content = null;
    if (id) {
      const entry = (typeof CONTENT !== 'undefined') ? CONTENT[id] : null;
      if (entry) {
        const data = dedentDeep(entry);
        if (data.title !== undefined) { title = data.title; delete data.title; }
        if (data.note === 'ml') data.note = ML_NOTE;
        if (Object.keys(data).length) content = data;
      }
    }
    if (flags) content = Object.assign(content || {}, flags);
    return [cats, x, y, w, h, title, content];
  });

  // A card pointing at nothing renders blank and a stray entry is dead weight,
  // and neither shows up on the map. Say so out loud instead.
  (function () {
    if (typeof CONTENT === 'undefined') { console.error('content.js did not load'); return; }
    const used = new Set(CARDS_LAYOUT.map(c => c[5]).filter(Boolean));
    const missing = [...used].filter(id => !CONTENT[id]);
    const unused = Object.keys(CONTENT).filter(id => !used.has(id));
    if (missing.length) console.error('content.js has no entry for: ' + missing.join(', '));
    if (unused.length) console.warn('content.js entries nothing uses: ' + unused.join(', '));
  })();


  /* ═══════════════════════════════════════════════════
     CATMULL-ROM OPEN PATH
     For open (non-closed) smooth curves through points.
  ═══════════════════════════════════════════════════ */
  function catmullOpen(pts, tension = 0.38) {
    const n = pts.length;
    if (n < 2) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(i + 2, n - 1)];
      const cp1x = (p1[0] + (p2[0] - p0[0]) * tension).toFixed(1);
      const cp1y = (p1[1] + (p2[1] - p0[1]) * tension).toFixed(1);
      const cp2x = (p2[0] - (p3[0] - p1[0]) * tension).toFixed(1);
      const cp2y = (p2[1] - (p3[1] - p1[1]) * tension).toFixed(1);
      d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ═══════════════════════════════════════════════════
     QUADRATIC BEZIER CONNECTION between two cluster centers
     bend: how far the midpoint curves off the straight line
     (positive = left of direction, negative = right)
  ═══════════════════════════════════════════════════ */
  function connectionPath(x1, y1, x2, y2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    // Perpendicular unit vector
    const px = -dy / len, py = dx / len;
    const offset = len * bend;
    const cx = (x1 + x2) / 2 + px * offset;
    const cy = (y1 + y2) / 2 + py * offset;
    return `M ${x1.toFixed(0)},${y1.toFixed(0)} Q ${cx.toFixed(0)},${cy.toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`;
  }

  /* ═══════════════════════════════════════════════════
     BUILD CONNECTION LINES
  ═══════════════════════════════════════════════════ */
  const svg = document.getElementById('linesSvg');
  // Keep the line layer exactly as large as the canvas, so connection lines to
  // the outermost clusters are never clipped when the canvas is resized.
  const canvasEl = document.getElementById('canvasInner');
  svg.setAttribute('width',  canvasEl.offsetWidth);
  svg.setAttribute('height', canvasEl.offsetHeight);

  CONNECTIONS.forEach(({ from, to, bend }) => {
    const [x1, y1] = CENTERS[from];
    const [x2, y2] = CENTERS[to];
    const color = CAT_MAP[from]?.color || '#999';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', connectionPath(x1, y1, x2, y2, bend));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2.2');
    path.setAttribute('stroke-opacity', '0.7');
    // The canvas is scaled by the viewport transform, so a plain stroke thins
    // out to nothing when zoomed out. This keeps it the same width on screen
    // whatever the zoom, which is where the lines were disappearing.
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    path.setAttribute('stroke-linecap', 'round');
    path.dataset.connection = `${from}-${to}`;
    svg.appendChild(path);
  });

  /* ═══════════════════════════════════════════════════
     BUILD CARDS
  ═══════════════════════════════════════════════════ */
  const canvasInner = document.getElementById('canvasInner');

  let prevWrap = null;   // previous card, for content.stackBelow
  const stacks = [];     // cards to place under their neighbour, once laid out
  CARDS.forEach(([cats, x, y, w, h, title, content]) => {
    const colors = cats.map(k => CAT_MAP[k].color);

    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.dataset.cats = cats.join(',');
    wrap.dataset.primaryCat = cats[0];
    wrap.style.cssText = `left:${x}px; top:${y}px; width:${w}px; cursor:pointer;`;

    const card = document.createElement('div');
    card.className = 'card' + (content && content.bare ? ' card-bare' : '');
    // Text and credits cards hug their content; everything else keeps its authored height
    const hugsContent = !!(content && (content.txt || content.credits));
    card.style.cssText = `width:${w}px;` + (hugsContent ? '' : ` height:${h}px;`);

    if (content && content.gallery) {
      card.classList.add('card-gallery');
      const gimg = document.createElement('img');
      gimg.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
      const gvid = document.createElement('video');
      gvid.muted = true; gvid.loop = true; gvid.playsInline = true; gvid.preload = 'metadata';
      gvid.style.cssText = 'width:100%;height:100%;object-fit:contain;display:none;';
      card.appendChild(gimg); card.appendChild(gvid);
      const dots = document.createElement('div');
      dots.className = 'gal-dots';
      if (content.gallery.length > 1) content.gallery.forEach(() => dots.appendChild(document.createElement('span')));
      card.appendChild(dots);
      let gi = 0;
      const paint = () => {
        const g = content.gallery[gi];
        const isVid = /\.mp4$/.test(g.src);
        gimg.style.display = isVid ? 'none' : 'block';
        gvid.style.display = isVid ? 'block' : 'none';
        if (isVid) { if (gvid.getAttribute('src') !== g.src) gvid.src = g.src; gvid.play().catch(() => {}); }
        else { gvid.pause(); gimg.src = g.src; gimg.alt = L(g.alt) || ''; }
        [...dots.children].forEach((d, k) => d.classList.toggle('on', k === gi));
      };
      onLang(paint);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setInterval(() => { gi = (gi + 1) % content.gallery.length; paint(); }, 3600);
      }
    } else if (content && content.img) {
      const img = document.createElement('img');
      img.src = content.img;
      // A photograph that has not landed yet must not leave a broken or empty
      // card: hide the image and fall back to the card's title.
      img.addEventListener('error', () => {
        img.style.display = 'none';
        if (title && !card.querySelector('.card-title')) {
          card.classList.add('card-img-missing');
          const t2 = document.createElement('span');
          t2.className = 'card-title';
          onLang(() => { t2.textContent = L(title); });
          card.appendChild(t2);
        }
      });
      onLang(() => { img.alt = L(content.alt) || ''; });
      // no lazy loading here: the canvas is transformed, and moving a
      // transformed ancestor does not re-trigger the intersection check, so
      // cards in far clusters would never load.
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(img);
    } else if (content && content.vid) {
      const vid = document.createElement('video');
      vid.src = content.vid; vid.muted = true; vid.loop = true;
      vid.playsInline = true; vid.preload = 'metadata';
      if (content.poster) vid.poster = content.poster;
      // updateVideos may run before the file has enough data, and that play()
      // rejection is swallowed; re-check once it is actually playable.
      vid.addEventListener('canplay', () => updateVideos(), { once: true });
      vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(vid);
    } else if (content && (content.link || content.goTo)) {
      card.className += ' card-link-pill';
      const span = document.createElement('span');
      span.className = 'card-link-text';
      onLang(() => { span.textContent = L(content.label); });
      card.appendChild(span);
    } else if (content && content.txt) {
      card.className += ' card-text-box';
      if (L(title)) {
        const h = document.createElement('p');
        h.className = 'card-text-title';
        onLang(() => { h.textContent = L(title); });
        card.appendChild(h);
      }
      const pre = document.createElement('p');
      pre.className = 'card-text-preview';
      const preText = document.createTextNode('');
      pre.appendChild(preText);
      // The hint is a sibling, not inline: the preview is cut off, and
      // anything inside it would be clipped along with the overflowing text.
      const hint = document.createElement('span');
      hint.className = 'card-text-hint';
      onLang(() => {
        preText.nodeValue = L(content.txt);
        hint.textContent = t('archive.readmore');
      });
      // Copy that already fits has nothing to open, and the Portuguese often
      // overflows where the English did not. Measured on a change of size
      // rather than now, because right now everything measures zero.
      if (window.ResizeObserver) {
        new ResizeObserver(() => {
          hint.style.display = pre.scrollHeight > pre.clientHeight + 2 ? '' : 'none';
        }).observe(pre);
      }
      card.appendChild(pre);
      card.appendChild(hint);
    } else if (content && content.credits) {
      card.className += ' card-credits-box';
      const span = document.createElement('span');
      span.className = 'card-credits-text';
      onLang(() => {
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        span.textContent = L(content.credits) + (note ? '\n' + note : '');
      });
      card.appendChild(span);
    } else {
      const band = document.createElement('div');
      band.className = 'card-band';
      if (colors.length === 1) {
        band.style.background = colors[0];
      } else {
        const stops = colors.map((c,i) => {
          const pct = 100 / colors.length;
          return `${c} ${(i*pct).toFixed(0)}%, ${c} ${((i+1)*pct).toFixed(0)}%`;
        }).join(', ');
        band.style.background = `linear-gradient(to right, ${stops})`;
      }
      const body = document.createElement('div');
      body.className = 'card-body';
      if (title) {
        // named titleEl, not t — t() is the global translator from lang.js
        const titleEl = document.createElement('span');
        titleEl.className = 'card-title';
        onLang(() => { titleEl.textContent = L(title); });
        body.appendChild(titleEl);
      }
      card.appendChild(band);
      card.appendChild(body);
    }

    const dots = document.createElement('div');
    dots.className = 'card-cats-dots';
    cats.forEach(k => {
      const d = document.createElement('span');
      d.className = 'cat-dot';
      d.style.background = CAT_MAP[k].color;
      dots.appendChild(d);
    });

    wrap.appendChild(card);
    if (content && content.mapTitle && L(title)) {
      const mt = document.createElement('span');
      mt.className = 'card-maptitle';
      onLang(() => { mt.textContent = L(title); });
      wrap.appendChild(mt);
    }
    // Dots mark cross-cluster relationships, so only show them when a card
    // actually carries more than one tag. Credits cards never show them.
    if (cats.length > 1 && !(content && content.credits)) {
      wrap.appendChild(dots);
    }

    // Per-card random float parameters
    const rSign = () => (Math.random() < 0.5 ? 1 : -1);
    wrap.style.setProperty('--fx',    (rSign() * (2 + Math.random() * 3)).toFixed(2) + 'px');
    wrap.style.setProperty('--fy',    (rSign() * (1.5 + Math.random() * 2.5)).toFixed(2) + 'px');
    wrap.style.setProperty('--fr',    (rSign() * (0.3 + Math.random() * 0.6)).toFixed(3));
    wrap.style.setProperty('--fdur',  (5 + Math.random() * 3.5).toFixed(1) + 's');
    wrap.style.setProperty('--fdelay',(-(Math.random() * 9)).toFixed(2) + 's');

    let _spx = 0, _spy = 0, _spt = 0;
    wrap.addEventListener('pointerdown', e => {
      _spx = e.clientX; _spy = e.clientY; _spt = Date.now();
      e.stopPropagation();
    }, { passive: true });
    wrap.addEventListener('pointerup', e => {
      if (Math.hypot(e.clientX - _spx, e.clientY - _spy) > 12 || Date.now() - _spt > 600) return;
      if (content && content.gallery) {
        openGalleryPopup(content, cats[0], title, cats);
      } else if (content && content.goTo) {
        flyToCluster(content.goTo);
      } else if (content && content.img && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.img) {
        openMediaPopup({ img: content.img, alt: content.alt, credit: content.credit, full: content.full, note: content.note, sources: content.sources, title }, cats[0]);
      } else if (content && content.vid) {
        openMediaPopup({ vid: content.vid, title }, cats[0]);
      } else if (content && content.txt) {
        openTextPopup(content.full || content.txt, cats[0], title);
      } else if (!content || (!content.credits)) {
        openPanel(cats[0]);
      }
    }, { passive: true });

    canvasInner.appendChild(wrap);

    // A card marked stackBelow sits directly under the previous card rather
    // than at a fixed y. Text cards hug their content, so their height
    // changes with the language, and anything pinned underneath them would
    // otherwise collide once the copy gets longer in translation.
    if (content && content.stackBelow) {
      stacks.push({ wrap, anchor: prevWrap, gap: content.gap ?? 6 });
    }
    prevWrap = wrap;
  });

  // Placing these while the cards were still being built measured the anchor
  // as zero and left every stacked card at its own gap value, piled in the
  // corner of the canvas, until something happened to re-run it. They can only
  // be placed once the cards above them have actually been laid out. Order
  // matters: a chain of stacked cards resolves top down.
  function layoutStacks() {
    stacks.forEach(({ wrap, anchor, gap }) => {
      wrap.style.top = (anchor.offsetTop + anchor.offsetHeight + gap) + 'px';
    });
  }
  layoutStacks();
  onLang(layoutStacks);          // the copy changes length between languages
  window.addEventListener('load', layoutStacks);
  // A webfont landing late reflows the text cards under it.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutStacks);
  // The above are all guesses about when the anchors will have a real height,
  // and every one of them can fire too early. Watching the anchors instead is
  // the only version that cannot be raced: whenever one changes size, for any
  // reason, whatever sits under it moves. Observing fires once on registration
  // too, which is what places them in the first place. Anchors do not resize
  // when we move the cards below them, so this cannot loop.
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(layoutStacks);
    stacks.forEach(({ anchor }) => ro.observe(anchor));
  }

  /* ═══════════════════════════════════════════════════
     BUILD CLUSTER LABELS
  ═══════════════════════════════════════════════════ */
  // Categories whose colour is light enough to need dark text on the cluster label
  const YELLOW_CATS = new Set(['hypersea', 'workshop', 'drawings']);

  CATS.forEach(({ key, label, color }) => {
    // Anchor the header to the cards that actually live in this cluster.
    // cats.includes() pulled in cross-tagged cards owned by other clusters,
    // which dragged e.g. the Sargassum header into the middle of Hypersea.
    // Cross-cluster ties are shown by the connection lines and card dots.
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity;
    members.forEach(([, x, y, w]) => {
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x + w);
      minY = Math.min(minY, y);
    });

    const cx = (minX + maxX) / 2;
    const lbl = document.createElement('div');
    lbl.className = 'cluster-label';
    lbl.dataset.cat = key;
    onLang(() => { lbl.textContent = L(label); });
    lbl.style.left   = cx + 'px';
    lbl.style.top    = (minY - 54) + 'px';
    lbl.style.background = color;
    lbl.style.color = YELLOW_CATS.has(key) ? '#1a1200' : '#ffffff';
    lbl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (key === 'hypersea') {
        window.location.href = 'hypersea.html';
      } else {
        openPanel(key);
      }
    });
    canvasInner.appendChild(lbl);
  });

  /* ═══════════════════════════════════════════════════
     BUILD LEGEND
  ═══════════════════════════════════════════════════ */
  const legendEl = document.getElementById('mapLegend');
  let activeFilter = null;

  CATS.forEach(({ key, label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cat = key;

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const lbl = document.createElement('span');
    lbl.className = 'legend-label';
    onLang(() => { lbl.textContent = L(label); });

    item.appendChild(dot);
    item.appendChild(lbl);
    legendEl.appendChild(item);

    item.addEventListener('click', () => {
      if (activeFilter === key) {
        activeFilter = null;
        applyFilter(null);
        flyToOverview();
      } else {
        activeFilter = key;
        applyFilter(key);
        flyToCluster(key);
      }
    });
  });

  function applyFilter(key) {
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    document.querySelectorAll('.card-wrap').forEach(el => {
      const cats = el.dataset.cats.split(',');
      el.classList.toggle('dimmed', key !== null && !cats.includes(key));
    });
    document.querySelectorAll('.cluster-label').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    svg.querySelectorAll('path').forEach(el => {
      const conn = el.dataset.connection || '';
      const relevant = key === null || conn.includes(key);
      el.style.transition = 'opacity 0.22s ease';
      el.style.opacity = relevant ? '' : '0.04';
    });
  }

  /* ── Compute bounding box of all cards for a category ── */
  function clusterBounds(key) {
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    members.forEach(([, x, y, w, h]) => {
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, minY,
             w: maxX - minX, h: maxY - minY };
  }

  /* ── Animated fly to a cluster ── */
  let flyTimer = null;

  function flyTo(targetTx, targetTy, targetScale) {
    canvasInner.style.transition = 'transform 0.72s cubic-bezier(0.4, 0, 0.2, 1)';
    scale = targetScale;
    tx = targetTx;
    ty = targetTy;
    applyTransform();
    clearTimeout(flyTimer);
    flyTimer = setTimeout(() => { canvasInner.style.transition = ''; }, 800);
  }

  function flyToCluster(key) {
    const bounds = clusterBounds(key);
    if (!bounds) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const legendW = document.getElementById('mapLegend')?.offsetWidth || 220;
    const usableW = vw - legendW;
    const PAD = 60;
    // Fit the cluster if it is small, but never drop below MIN_READ: at the
    // old fit-everything scale a cluster the size of Hypersea landed around
    // 0.8x and the card text and photos were too small to read. Anything
    // taller than the viewport can be reached by dragging.
    const MIN_READ = 1.25, MAX_ZOOM = 1.8;
    const fit = Math.min(
      usableW / (bounds.w + PAD * 2),
      vh      / (bounds.h + PAD * 2),
      MAX_ZOOM
    );
    const targetScale = Math.max(fit, MIN_READ);
    // Center within the usable area (right of legend)
    const centerX = legendW + usableW / 2;
    // A cluster taller than the viewport should start at its top — its header
    // and opening cards — and be scrolled down through, rather than being
    // centred so that both ends are cut off.
    const LABEL_ROOM = 70;
    const fitsVertically = bounds.h * targetScale <= vh;
    const ty = fitsVertically
      ? vh / 2 - bounds.cy * targetScale
      : LABEL_ROOM - (bounds.minY - 54) * targetScale;
    flyTo(centerX - bounds.cx * targetScale, ty, targetScale);
  }

  /* Width reserved on the left for the legend panel, so the overview and
     the per-cluster fly-to never park content underneath it. */
  const LEGEND_GUTTER = 240;

  /* Measure the real extent of the map so the overview never goes stale
     when clusters are moved or the canvas is resized. */
  function contentBounds() {
    const PAD = 120;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvasInner.querySelectorAll('.card-wrap, .cluster-label').forEach(el => {
      const w = el.offsetWidth, h = el.offsetHeight;
      // cluster labels are centred on their x via translateX(-50%)
      const x = el.classList.contains('cluster-label') ? el.offsetLeft - w / 2 : el.offsetLeft;
      const y = el.offsetTop;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (!isFinite(minX)) return { x: 0, y: 0, w: 1000, h: 1000 };
    return { x: minX - PAD, y: minY - PAD, w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2 };
  }

  function flyToOverview() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    const targetScale = Math.min(availW / b.w, vh / b.h) * 0.92;
    flyTo(
      LEGEND_GUTTER + (availW - b.w * targetScale) / 2 - b.x * targetScale,
      (vh - b.h * targetScale) / 2 - b.y * targetScale,
      targetScale
    );
  }

  /* ═══════════════════════════════════════════════════
     PAN + ZOOM
  ═══════════════════════════════════════════════════ */
  const viewport = document.getElementById('viewport');
  let scale = 0.36;
  let tx = 0, ty = 0;
  let isPanning = false;
  let startX = 0, startY = 0;
  let dragOriginX = 0, dragOriginY = 0;
  let didDrag = false;

  let videoTimer = null;
  function updateVideos() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    document.querySelectorAll('.card-wrap').forEach(wrap => {
      const vid = wrap.querySelector('video');
      if (!vid) return;
      const cx = parseFloat(wrap.style.left);
      const cy = parseFloat(wrap.style.top);
      const cw = parseFloat(wrap.style.width);
      const cardEl = wrap.querySelector('.card');
      const ch = cardEl ? parseFloat(cardEl.style.height) : 80;
      const sx = cx * scale + tx, sy = cy * scale + ty;
      const visible = (cx + cw) * scale + tx > 0 && sx < vw &&
                      (cy + ch) * scale + ty > 0 && sy < vh;
      if (visible && scale > 0.45) {
        if (vid.paused) vid.play().catch(() => {});
      } else {
        if (!vid.paused) vid.pause();
      }
    });
  }

  function applyTransform() {
    canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    clearTimeout(videoTimer);
    videoTimer = setTimeout(updateVideos, 350);
  }

  function initView() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    scale = Math.min(availW / b.w, vh / b.h) * 0.92;
    tx = LEGEND_GUTTER + (availW - b.w * scale) / 2 - b.x * scale;
    ty = (vh - b.h * scale) / 2 - b.y * scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-controls')) return;
    isPanning = true;
    didDrag = false;
    startX = e.clientX; startY = e.clientY;
    dragOriginX = e.clientX; dragOriginY = e.clientY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!isPanning) return;
    const moved = Math.hypot(e.clientX - dragOriginX, e.clientY - dragOriginY);
    if (moved > 14) didDrag = true;
    tx += e.clientX - startX;
    ty += e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    applyTransform();
  });

  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
    setTimeout(() => { didDrag = false; }, 50);
  });

  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.11 : 0.90;
    const newScale = Math.max(0.15, Math.min(3, scale * factor));
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }, { passive: false });

  let pinchDist = 0;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const pcx = cx - rect.left, pcy = cy - rect.top;
    const canX = (pcx - tx) / scale;
    const canY = (pcy - ty) / scale;
    scale = Math.max(0.15, Math.min(3, scale * (d / pinchDist)));
    tx = pcx - canX * scale;
    ty = pcy - canY * scale;
    pinchDist = d;
    applyTransform();
  }, { passive: false });

  function zoomToCenter(f) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2, cy = vh / 2;
    const newScale = Math.max(0.15, Math.min(3, scale * f));
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }

  });

  /* ── Stream play/pause ── */
  /* ═══════════════════════════════════════════════════
     MOBILE — cluster list + field notes

     Built from CATS and CARDS, the same data the map draws from, so a
     cluster gains a mobile view as soon as its cards exist and translated
     copy only has to be written once.
  ═══════════════════════════════════════════════════ */
  const mList = document.getElementById('mList');
  const mNotes = document.getElementById('mNotes');
  const mNotesBody = document.getElementById('mNotesBody');
  const mNotesChip = document.getElementById('mNotesChip');
  const mBack = document.getElementById('mBack');

  CATS.forEach(({ key, label, color }) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'm-item';
    btn.type = 'button';
    const dot = document.createElement('span');
    dot.className = 'm-dot';
    dot.style.background = color;
    const txt = document.createElement('span');
    onLang(() => { txt.textContent = L(label); });
    btn.appendChild(dot); btn.appendChild(txt);
    btn.addEventListener('click', () => openNotes(key));
    li.appendChild(btn);
    mList.appendChild(li);
  });

  const mCta = document.createElement('a');
  mCta.className = 'm-cta';
  mCta.href = 'memories.html';
  onLang(() => { mCta.textContent = t('archive.contribute'); });
  mList.parentNode.insertBefore(mCta, mNotes);

  // The map places cards spatially; a phone needs a reading order, so group
  // by kind: words first, then what to read next, then the images, then credits.
  function notesOrder(cards) {
    const rank = c => {
      const k = c[6];
      if (k && k.txt) return 0;
      if (k && ((k.link && !k.img) || k.goTo)) return 1;
      if (k && (k.img || k.vid || k.gallery)) return 2;
      if (!k) return 3;
      if (k && k.credits) return 4;
      return 3;
    };
    return cards.map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(p => p[0]);
  }

  // A block of more than two paragraphs is folded: the first paragraph shows,
  // the rest slides down behind a read more. Anything shorter is left alone,
  // since folding two sentences only adds a tap.
  function mobileBlock(str, cls) {
    const text = L(str) || '';
    const box = document.createElement('div');
    const paras = text.split(/\n\s*\n/).filter(p => p.trim());
    const first = document.createElement('p');
    first.className = cls;
    if (paras.length <= 2) {
      first.textContent = text;
      box.appendChild(first);
      return box;
    }
    first.textContent = paras[0];
    const fold = document.createElement('div');
    fold.className = 'm-fold';
    const rest = document.createElement('p');
    rest.className = cls;
    rest.textContent = paras.slice(1).join('\n\n');
    fold.appendChild(rest);
    const btn = document.createElement('button');
    btn.className = 'm-readmore';
    btn.type = 'button';
    let open = false;
    const label = () => { btn.textContent = t(open ? 'archive.readless' : 'archive.readmore'); };
    label();
    btn.addEventListener('click', () => { open = !open; fold.classList.toggle('open', open); label(); });
    box.appendChild(first); box.appendChild(fold); box.appendChild(btn);
    return box;
  }

  function openNotes(key) {
    const cat = CAT_MAP[key];
    mNotesChip.textContent = L(cat.label);
    mNotesChip.style.background = cat.color;
    mNotesChip.style.color = YELLOW_CATS.has(key) ? '#1a1200' : '#ffffff';
    mNotesBody.innerHTML = '';

    const cards = notesOrder(CARDS.filter(([cats]) => cats[0] === key));
    let rendered = 0;

    cards.forEach(([, , , , , title, content]) => {
      // The map shows a title on the card itself. On a phone the cards are
      // gone, so the title has to lead its section or the words arrive with
      // nothing naming them.
      if (content && L(title)) {
        const h = document.createElement('p');
        h.className = 'm-heading';
        h.textContent = L(title);
        mNotesBody.appendChild(h); rendered++;
      }
      if (content && content.txt) {
        mNotesBody.appendChild(mobileBlock(content.full || content.txt, 'm-text')); rendered++;
      } else if (content && content.gallery) {
        const wrap = document.createElement('div');
        wrap.className = 'm-gal';
        const stage = document.createElement('div');
        stage.className = 'm-gal-stage';
        const im = document.createElement('img');
        const vd = document.createElement('video');
        vd.controls = true; vd.loop = true; vd.muted = true; vd.playsInline = true;
        vd.style.display = 'none';
        stage.appendChild(im); stage.appendChild(vd);
        const prev = document.createElement('button');
        prev.className = 'm-gal-nav m-gal-prev'; prev.type = 'button'; prev.textContent = '‹';
        const next = document.createElement('button');
        next.className = 'm-gal-nav m-gal-next'; next.type = 'button'; next.textContent = '›';
        stage.appendChild(prev); stage.appendChild(next);
        const bar = document.createElement('div');
        bar.className = 'm-gal-bar';
        const cap = document.createElement('p');
        cap.className = 'm-caption';
        const count = document.createElement('span');
        count.className = 'm-gal-count';
        bar.appendChild(cap); bar.appendChild(count);
        let gi = 0;
        // Same rule as the popup: one entry per frame belongs under its frame.
        const perFrame = content.entries && content.entries.length === content.gallery.length;
        const entryBox = document.createElement('div');
        entryBox.className = 'm-entry';
        const fillEntry = (n) => {
          entryBox.innerHTML = '';
          const en = content.entries[n];
          if (!en) return;
          const h = document.createElement('h3');
          h.textContent = L(en.title);
          entryBox.appendChild(h);
          entryBox.appendChild(mobileBlock(en.text, ''));
          (en.sources || []).forEach(sr => {
            const a = document.createElement('a');
            a.className = 'm-link'; a.href = sr.href;
            a.target = '_blank'; a.rel = 'noopener';
            a.textContent = '↗ ' + L(sr.label);
            entryBox.appendChild(a);
          });
        };
        const drawFrame = () => {
          const g = content.gallery[gi];
          const isVid = /\.mp4$/.test(g.src);
          im.style.display = isVid ? 'none' : 'block';
          vd.style.display = isVid ? 'block' : 'none';
          if (isVid) { if (vd.getAttribute('src') !== g.src) vd.src = g.src; }
          else { vd.pause(); im.src = g.src; im.alt = L(g.alt) || ''; }
          cap.textContent = L(g.caption) || '';
          count.textContent = (gi + 1) + ' / ' + content.gallery.length;
          if (perFrame) fillEntry(gi);
        };
        if (content.gallery.length < 2) {
          prev.style.display = 'none'; next.style.display = 'none'; count.style.display = 'none';
        }
        prev.addEventListener('click', () => {
          gi = (gi - 1 + content.gallery.length) % content.gallery.length; drawFrame();
        });
        next.addEventListener('click', () => {
          gi = (gi + 1) % content.gallery.length; drawFrame();
        });
        drawFrame();
        wrap.appendChild(stage); wrap.appendChild(bar);
        if (perFrame) wrap.appendChild(entryBox);
        mNotesBody.appendChild(wrap); rendered++;

        // Everything the desktop popup shows under the carousel: the intro,
        // one section per product, the sources and the ML note.
        if (L(content.full)) mNotesBody.appendChild(mobileBlock(content.full, 'm-text'));
        (perFrame ? [] : (content.entries || [])).forEach(en => {
          const sec = document.createElement('div');
          sec.className = 'm-entry';
          const h = document.createElement('h3');
          h.textContent = L(en.title);
          sec.appendChild(h);
          sec.appendChild(mobileBlock(en.text, ''));
          (en.sources || []).forEach(sr => {
            const a = document.createElement('a');
            a.className = 'm-link'; a.href = sr.href;
            a.target = '_blank'; a.rel = 'noopener';
            a.textContent = '↗ ' + L(sr.label);
            sec.appendChild(a);
          });
          mNotesBody.appendChild(sec);
        });
        (content.sources || []).forEach(sr => {
          const a = document.createElement('a');
          a.className = 'm-link'; a.href = sr.href;
          a.target = '_blank'; a.rel = 'noopener';
          a.textContent = '↗ ' + L(sr.label);
          mNotesBody.appendChild(a);
        });
        if (L(content.note)) {
          const nt = document.createElement('p');
          nt.className = 'm-caption';
          nt.style.cssText = 'font-style:italic;';
          nt.textContent = L(content.note);
          mNotesBody.appendChild(nt);
        }
      } else if (content && content.goTo) {
        const btn = document.createElement('button');
        btn.className = 'm-link'; btn.type = 'button';
        btn.textContent = L(content.label);
        btn.addEventListener('click', () => openNotes(content.goTo));
        mNotesBody.appendChild(btn); rendered++;
      } else if (content && content.link && !content.img) {
        const a = document.createElement('a');
        a.className = 'm-link'; a.href = content.link;
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = L(content.label);
        mNotesBody.appendChild(a); rendered++;
      } else if (content && content.img) {
        const fig = document.createElement('figure');
        fig.className = 'm-figure';
        const img = document.createElement('img');
        img.className = 'm-media'; img.src = content.img;
        img.alt = L(content.alt) || ''; img.loading = 'lazy';
        // book covers and other objects read better small and centred than
        // blown up to the full width of the phone
        if (content.mWidth) {
          fig.classList.add('m-figure-centred');
          img.style.maxWidth = content.mWidth + 'px';
        }
        if (content.link) {
          const a = document.createElement('a');
          a.href = content.link; a.target = '_blank'; a.rel = 'noopener';
          a.appendChild(img); fig.appendChild(a);
        } else {
          fig.appendChild(img);
        }
        if (L(content.caption) || L(content.credit)) {
          const cap = document.createElement('figcaption');
          cap.className = 'm-caption';
          cap.textContent = L(content.caption) || '';
          if (L(content.credit)) {
            const cr = document.createElement('span');
            cr.style.cssText = 'display:block;opacity:0.75;';
            cr.textContent = '© ' + L(content.credit);
            cap.appendChild(cr);
          }
          fig.appendChild(cap);
        }
        mNotesBody.appendChild(fig); rendered++;
        if (L(content.full)) mNotesBody.appendChild(mobileBlock(content.full, 'm-text'));
        if (L(content.note)) {
          const nt = document.createElement('p');
          nt.className = 'm-caption';
          nt.style.cssText = 'font-style:italic;';
          nt.textContent = L(content.note);
          mNotesBody.appendChild(nt);
        }
        (content.sources || []).forEach(src => {
          const a = document.createElement('a');
          a.className = 'm-link'; a.href = src.href;
          a.target = '_blank'; a.rel = 'noopener';
          a.textContent = '↗ ' + L(src.label);
          mNotesBody.appendChild(a);
        });
      } else if (content && content.vid) {
        const v = document.createElement('video');
        v.className = 'm-media'; v.src = content.vid;
        v.controls = true; v.playsInline = true; v.preload = 'metadata';
        mNotesBody.appendChild(v); rendered++;
      } else if (content && content.credits) {
        const p = document.createElement('p');
        p.className = 'm-credits';
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        p.textContent = L(content.credits) + (note ? '\n' + note : '');
        mNotesBody.appendChild(p); rendered++;
      } else if (title) {
        const h = document.createElement('p');
        h.className = 'm-heading';
        h.textContent = L(title);
        mNotesBody.appendChild(h); rendered++;
      }
    });

    if (!rendered) {
      const p = document.createElement('p');
      p.className = 'm-empty';
      p.textContent = t('archive.placeholder');
      mNotesBody.appendChild(p);
    }

    mList.hidden = true; mCta.hidden = true; mNotes.hidden = false;
    window.scrollTo(0, 0);
    openNotesKey = key;
  }

  function closeNotes() {
    mNotes.hidden = true; mList.hidden = false; mCta.hidden = false;
    openNotesKey = null;
  }
  let openNotesKey = null;
  mBack.addEventListener('click', closeNotes);
  onLang(() => {
    mBack.textContent = '← ' + t('archive.back');
    if (openNotesKey) openNotes(openNotesKey);   // redraw notes in the new language
  });

  const streamAudio = document.getElementById('streamAudio');
  const btnStream   = document.getElementById('btnStream');
  let streamPlaying = false;

  btnStream.addEventListener('click', () => {
    if (streamPlaying) {
      streamAudio.pause();
      btnStream.innerHTML = '&#9654;';
      btnStream.classList.remove('playing');
    } else {
      streamAudio.play();
      btnStream.innerHTML = '&#9646;&#9646;';
      btnStream.classList.add('playing');
    }
    streamPlaying = !streamPlaying;
  });
  </script>

</body>
