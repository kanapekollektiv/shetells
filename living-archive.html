    // ── FUTURE PRODUCT
    // FUTURE PRODUCTS: one card. The carousel carries every product and the
    // documentation, and the writing sits underneath it in the same card.
    [['future', 'sargassum'], 3522, 320, 340, 240, { en: 'The range', pt: 'A gama' }, { gallery: [{ src: 'la/future/products-6.jpg', alt: { en: 'Shell Cream, a shell dissolving into cream', pt: 'Shell Cream, uma concha a dissolver-se em creme' } }, { src: 'la/future/products-9.jpg', alt: { en: 'Acid Tabs, white tablets in a corked vial', pt: 'Acid Tabs, pastilhas brancas num frasco com rolha' } }, { src: 'la/future/products-7.jpg', alt: { en: 'Sexy Dunes, a vial of dune sand', pt: 'Sexy Dunes, um frasco de areia de duna' } }, { src: 'la/future/products-8.jpg', alt: { en: 'Deluxe O2, a corked vial of oxygen', pt: 'Deluxe O2, um frasco de oxigénio com rolha' } }, { src: 'la/future/products-5.jpg', alt: { en: 'Sargassum City, sargaço suspended in liquid', pt: 'Sargassum City, sargaço suspenso em líquido' } }, { src: 'la/future/products.jpg', alt: { en: 'The five products lined up', pt: 'Os cinco produtos alinhados' } }, { src: 'la/future/products-3.jpg', alt: { en: 'Shell Cream in front of the range', pt: 'O Shell Cream à frente da gama' } }, { src: 'la/future/products-4.jpg', alt: { en: 'Acid Tabs against the window', pt: 'Os Acid Tabs contra a janela' } }, { src: 'la/future/dune-a.jpg', alt: { en: 'The dune built in a vitrine, installation view', pt: 'A duna construída numa vitrina, vista da instalação' } }, { src: 'la/future/dune-b.jpg', alt: { en: 'The Sexy Dunes flyer in front of the dune', pt: 'O folheto do Sexy Dunes à frente da duna' } }], full: { en: 'We sell products that do not exist. Each one takes something the coast is actually losing and puts it in a jar with a label and a promise.\n\nThey are speculative, and they are specific. Every one starts from something we met in Esposende: a shell we could not find, a kelp forest under warming water, a dune holding on under litter, the oxygen the algae make.\n\nThis is the speculative product line. You can listen to it, and sometimes hear the ads for them, in our eternal stream.', pt: 'Vendemos produtos que não existem. Cada um pega em algo que a costa está mesmo a perder e coloca-o num frasco, com um rótulo e uma promessa.\n\nSão especulativos e são concretos. Todos partem de algo que encontrámos em Esposende: uma concha que não conseguimos achar, uma floresta de algas sob água mais quente, uma duna a aguentar-se sob o lixo, o oxigénio que as algas produzem.\n\nEsta é a linha de produtos especulativos. Podem ouvi-la, e por vezes ouvir os anúncios, na nossa transmissão eterna.' }, entries: [{ title: { en: 'Shell Cream', pt: 'Shell Cream' }, text: { en: 'As the ocean takes up more carbon its pH drops, and the animals that build shells lose the carbonate they need to build them. Shells grow thinner, and some begin to dissolve. Shell Cream is sold as skincare for exactly that. Outlast the acid era. We went looking for shells on this coast and came back with almost nothing.', pt: 'À medida que o oceano absorve mais carbono, o seu pH desce, e os animais que constroem conchas perdem o carbonato de que precisam para as construir. As conchas ficam mais finas e algumas começam a dissolver-se. O Shell Cream é vendido como cosmética para isso mesmo. Sobreviva à era ácida. Fomos à procura de conchas nesta costa e voltámos quase sem nada.' }, sources: [{ href: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4753494/', label: { en: 'Ocean acidification and calcifying marine life', pt: 'Acidificação dos oceanos e vida marinha calcificante' } }] }, { title: { en: 'Acid Tabs', pt: 'Acid Tabs' }, text: { en: 'The same problem from the other side. The long record of falling pH in the Iberian upwelling system covers this coast, and the north of Portugal, Esposende included, is its most exposed part. Marina told us acidification is a serious threat to the sargaço and the kelp forests here, and pointed us to the blue carbon research to understand what is at stake as those forests degrade. So we packaged the acid as a supplement.', pt: 'O mesmo problema pelo outro lado. O longo registo da descida do pH no sistema de afloramento ibérico cobre esta costa, e o norte de Portugal, incluindo Esposende, é a sua parte mais exposta. A Marina disse-nos que a acidificação é uma ameaça séria ao sargaço e às florestas de algas daqui, e encaminhou-nos para a investigação sobre carbono azul para percebermos o que está em jogo à medida que essas florestas se degradam. Por isso embalámos o ácido como suplemento.' }, sources: [{ href: 'https://essd.copernicus.org/articles/12/2647/2020/', label: { en: 'The pH record of the Iberian upwelling system', pt: 'O registo de pH do sistema de afloramento ibérico' } }] }, { title: { en: 'Sexy Dunes', pt: 'Sexy Dunes' }, text: { en: 'The northern Portuguese coast carries some of the highest erosion and flooding risk in the country, and the dunes take it alongside litter and everything else we leave on them. Plastic left on the sand becomes microplastic in the water. Sexy Dunes sells the dune as an object of desire. Research shows that dunes which look sexy have a 25% less chance of getting littered.', pt: 'A costa norte portuguesa apresenta alguns dos maiores riscos de erosão e de galgamento do país, e as dunas suportam-nos a par do lixo e de tudo o resto que lá deixamos. O plástico deixado na areia torna-se microplástico na água. O Sexy Dunes vende a duna como objeto de desejo. A investigação mostra que dunas com ar sexy têm menos 25% de probabilidade de receber lixo.' }, sources: [{ href: 'https://www.mdpi.com/2071-1050/16/20/8891', label: { en: 'Coastal erosion and flooding risk on the Portuguese coast', pt: 'Erosão costeira e risco de galgamento na costa portuguesa' } }, { href: 'https://link.springer.com/chapter/10.1007/978-3-031-08626-7_2', label: { en: 'Litter and pressures on the dune environment', pt: 'Lixo e pressões sobre o ambiente dunar' } }] }, { title: { en: 'Deluxe O2', pt: 'Deluxe O2' }, text: { en: 'Sargaço and the marine algae make oxygen by photosynthesis, the other half of the carbon story. That cycle is real, and warming water makes it less steady: it shifts, and in dense bloom conditions it can run the other way and strip oxygen out. Deluxe O2 bottles that specific oxygen and sells it back. Blue oxygen, our own term, next to the blue carbon everyone already trades in.', pt: 'O sargaço e as algas marinhas produzem oxigénio por fotossíntese, a outra metade da história do carbono. Esse ciclo é real, e a água mais quente torna-o menos estável: altera-se e, em condições de floração densa, pode inverter-se e retirar oxigénio. O Deluxe O2 engarrafa esse oxigénio e revende-o. Oxigénio azul, um termo nosso, ao lado do carbono azul que já toda a gente transaciona.' }, sources: [{ href: 'https://drive.google.com/file/d/1KQ087h4OV0cWnASFKR7XHcTsc7oLzIRj/view?usp=sharing', label: { en: 'Blue carbon reading', pt: 'Leitura sobre carbono azul' } }] }, { title: { en: 'Sargassum City', pt: 'Sargassum City' }, text: { en: 'Sargaço is being used more and will likely be commercialised further, as a resource, for oxygen, for material, for the pharmacy shelf. It is also, first, a habitat that marine life needs in order to exist at all. Sargassum City takes the commodification to its end and builds a whole speculative economy on harvesting it. The joke is that the weed was already a city, with residents, before anyone thought to sell it.', pt: 'O sargaço é cada vez mais utilizado e será provavelmente mais comercializado, como recurso, para oxigénio, para material, para a prateleira da farmácia. É também, antes disso, um habitat de que a vida marinha precisa para simplesmente existir. A Sargassum City leva a mercantilização até ao fim e constrói uma economia especulativa inteira sobre a sua apanha. A piada é que a alga já era uma cidade, com habitantes, antes de alguém pensar em vendê-la.' }, sources: [{ href: 'https://drive.google.com/file/d/1KQ087h4OV0cWnASFKR7XHcTsc7oLzIRj/view?usp=sharing', label: { en: 'Blue carbon reading', pt: 'Leitura sobre carbono azul' } }, { href: 'https://drive.google.com/file/d/1FPEiOMNkUFbWOyPrSDOZuRZYLGdleDMR/view?usp=sharing', label: { en: 'Sargassum as habitat', pt: 'O sargaço como habitat' } }] }], note: { en: 'Text written based on the sources above and edited with ML.', pt: 'Texto escrito com base nas fontes acima e editado com ML. Tradução automática.' } }],

    [['future'], 3936, 562, 200, 132, { en: 'The flyers', pt: 'Os folhetos' }, { vid: 'la/future/prints.mp4' }],
    [['future'], 4224, 562, 300, 130, { en: 'Non human voices', pt: 'Vozes não humanas' }, { txt: { en: 'The ads are not addressed to us. They are for non human water bodies and species, the ones already living with what the products pretend to solve.\n\nWe are speculating on the issues that reach them first.', pt: 'Os anúncios não são dirigidos a nós. São para corpos de água e espécies não humanas, os que já vivem com aquilo que os produtos fingem resolver.\n\nEstamos a especular sobre as questões que chegam primeiro a eles.' }, full: { en: 'The ads are not addressed to us. They are for non human water bodies and species, the ones already living with what the products pretend to solve.\n\nWe are speculating on the issues that reach them first.', pt: 'Os anúncios não são dirigidos a nós. São para corpos de água e espécies não humanas, os que já vivem com aquilo que os produtos fingem resolver.\n\nEstamos a especular sobre as questões que chegam primeiro a eles.' } }],

    // ── CROSS: Non-Human × Sargassum
    [['future', 'sargassum'], 4224, 320, 300, 200, { en: 'Bioplastic futures at home', pt: 'Futuros de bioplástico em casa' }, { gallery: [{ src: 'la/future/bioplastic-cast.jpg', alt: { en: 'A cast piece of sargaço bioplastic, deep red and still wet', pt: 'Uma peça moldada de bioplástico de sargaço, vermelho escuro e ainda húmida' } }, { src: 'la/future/bioplastic-fermented.jpg', alt: { en: 'The fermented biomaterial, amber and translucent', pt: 'O biomaterial fermentado, âmbar e translúcido' } }], full: { en: 'Before the glass, we tried to make the material at home. If sargaço is going to be a resource, we wanted to know what it is like to actually work with, on a kitchen table, with things you can buy.\n\nColleagues sent us their recipes. You melt starch and glycerine into water with vinegar, and you put the weed in: whole, or cut small, or dried and ground to a powder. You can colour it. You can pour it into a mould. It shrinks as it dries, so whatever you cast comes out smaller than you meant.\n\nWe chose glass in the end, and the reason is in the difference between the two. The bioplastic goes back. It shrinks, it warps, and given long enough it returns to the sea it came out of, which is honest and is also the problem: this is an archive, and it has to hold. Glass is the same gesture with the opposite ending. Sand is already sea, and melting it makes a vessel that keeps.\n\nSo the recipes stay here, as the road not taken. They are the version of this work that composts.', pt: 'Antes do vidro, tentámos fazer o material em casa. Se o sargaço vai ser um recurso, queríamos saber como é trabalhá-lo de facto, numa mesa de cozinha, com coisas que se compram.\n\nColegas enviaram-nos as suas receitas. Derrete-se amido e glicerina em água com vinagre e junta-se a alga: inteira, cortada em pedaços pequenos, ou seca e moída em pó. Pode levar cor. Pode ser vertida num molde. Encolhe ao secar, por isso o que se molda sai sempre mais pequeno do que se pensava.\n\nNo fim escolhemos o vidro, e a razão está na diferença entre os dois. O bioplástico volta atrás. Encolhe, deforma-se e, com tempo suficiente, regressa ao mar de onde veio, o que é honesto e é também o problema: isto é um arquivo e tem de aguentar. O vidro é o mesmo gesto com o final oposto. A areia já é mar, e derretê-la faz um recipiente que guarda.\n\nPor isso as receitas ficam aqui, como o caminho não seguido. São a versão deste trabalho que se decompõe.' }, entries: [{ title: { en: 'Recipe from Nayeli', pt: 'Receita da Nayeli' }, text: { en: 'Mix the ingredients, then add the sargaço: whole, cut into small pieces, or dried and ground into a powder. Small pieces of the plant suspended in it look best. Colour can be added. Cast it in a mould, and allow for shrinkage as it dries.\n\n50 g glycerine\n400 ml water\n50 g starch\n60 ml vinegar\n15 g salt', pt: 'Misturar os ingredientes e juntar o sargaço: inteiro, cortado em pedaços pequenos, ou seco e moído em pó. Pequenos pedaços da planta suspensos no material são o que fica melhor. Pode juntar-se cor. Verter num molde, contando com o encolhimento durante a secagem.\n\n50 g de glicerina\n400 ml de água\n50 g de amido\n60 ml de vinagre\n15 g de sal' } }, { title: { en: 'The fermented one', pt: 'A fermentada' }, text: { en: 'A fermented biomaterial, which takes about three weeks, so it is not one for a short workshop. It comes out flexible and can be cut with scissors like paper, which makes it good for a cover or a skin over a structure.', pt: 'Um biomaterial fermentado, que demora cerca de três semanas, por isso não serve para uma oficina curta. Fica flexível e corta-se com tesoura como papel, o que o torna bom para uma capa ou uma pele sobre uma estrutura.' } }], note: { en: 'Recipes collected from colleagues. Text edited with ML.', pt: 'Receitas recolhidas junto de colegas. Texto editado com ML. Tradução automática.' } }],
  ];

  /* ═══════════════════════════════════════════════════
     CATMULL-ROM OPEN PATH
     For open (non-closed) smooth curves through points.
  ═══════════════════════════════════════════════════ */
  function catmullOpen(pts, tension = 0.38) {
    const n = pts.length;
    if (n < 2) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(i + 2, n - 1)];
      const cp1x = (p1[0] + (p2[0] - p0[0]) * tension).toFixed(1);
      const cp1y = (p1[1] + (p2[1] - p0[1]) * tension).toFixed(1);
      const cp2x = (p2[0] - (p3[0] - p1[0]) * tension).toFixed(1);
      const cp2y = (p2[1] - (p3[1] - p1[1]) * tension).toFixed(1);
      d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ═══════════════════════════════════════════════════
     QUADRATIC BEZIER CONNECTION between two cluster centers
     bend: how far the midpoint curves off the straight line
     (positive = left of direction, negative = right)
  ═══════════════════════════════════════════════════ */
  function connectionPath(x1, y1, x2, y2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    // Perpendicular unit vector
    const px = -dy / len, py = dx / len;
    const offset = len * bend;
    const cx = (x1 + x2) / 2 + px * offset;
    const cy = (y1 + y2) / 2 + py * offset;
    return `M ${x1.toFixed(0)},${y1.toFixed(0)} Q ${cx.toFixed(0)},${cy.toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`;
  }

  /* ═══════════════════════════════════════════════════
     BUILD CONNECTION LINES
  ═══════════════════════════════════════════════════ */
  const svg = document.getElementById('linesSvg');
  // Keep the line layer exactly as large as the canvas, so connection lines to
  // the outermost clusters are never clipped when the canvas is resized.
  const canvasEl = document.getElementById('canvasInner');
  svg.setAttribute('width',  canvasEl.offsetWidth);
  svg.setAttribute('height', canvasEl.offsetHeight);

  CONNECTIONS.forEach(({ from, to, bend }) => {
    const [x1, y1] = CENTERS[from];
    const [x2, y2] = CENTERS[to];
    const color = CAT_MAP[from]?.color || '#999';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', connectionPath(x1, y1, x2, y2, bend));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-opacity', '0.55');
    path.setAttribute('stroke-linecap', 'round');
    path.dataset.connection = `${from}-${to}`;
    svg.appendChild(path);
  });

  /* ═══════════════════════════════════════════════════
     BUILD CARDS
  ═══════════════════════════════════════════════════ */
  const canvasInner = document.getElementById('canvasInner');

  let prevWrap = null;   // previous card, for content.stackBelow
  CARDS.forEach(([cats, x, y, w, h, title, content]) => {
    const colors = cats.map(k => CAT_MAP[k].color);

    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.dataset.cats = cats.join(',');
    wrap.dataset.primaryCat = cats[0];
    wrap.style.cssText = `left:${x}px; top:${y}px; width:${w}px; cursor:pointer;`;

    const card = document.createElement('div');
    card.className = 'card';
    // Text and credits cards hug their content; everything else keeps its authored height
    const hugsContent = !!(content && (content.txt || content.credits));
    card.style.cssText = `width:${w}px;` + (hugsContent ? '' : ` height:${h}px;`);

    if (content && content.gallery) {
      card.classList.add('card-gallery');
      const gimg = document.createElement('img');
      gimg.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
      const gvid = document.createElement('video');
      gvid.muted = true; gvid.loop = true; gvid.playsInline = true; gvid.preload = 'metadata';
      gvid.style.cssText = 'width:100%;height:100%;object-fit:contain;display:none;';
      card.appendChild(gimg); card.appendChild(gvid);
      const dots = document.createElement('div');
      dots.className = 'gal-dots';
      content.gallery.forEach(() => dots.appendChild(document.createElement('span')));
      card.appendChild(dots);
      let gi = 0;
      const paint = () => {
        const g = content.gallery[gi];
        const isVid = /\.mp4$/.test(g.src);
        gimg.style.display = isVid ? 'none' : 'block';
        gvid.style.display = isVid ? 'block' : 'none';
        if (isVid) { if (gvid.getAttribute('src') !== g.src) gvid.src = g.src; gvid.play().catch(() => {}); }
        else { gvid.pause(); gimg.src = g.src; gimg.alt = L(g.alt) || ''; }
        [...dots.children].forEach((d, k) => d.classList.toggle('on', k === gi));
      };
      onLang(paint);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setInterval(() => { gi = (gi + 1) % content.gallery.length; paint(); }, 3600);
      }
    } else if (content && content.img) {
      const img = document.createElement('img');
      img.src = content.img;
      // A photograph that has not landed yet must not leave a broken or empty
      // card: hide the image and fall back to the card's title.
      img.addEventListener('error', () => {
        img.style.display = 'none';
        if (title && !card.querySelector('.card-title')) {
          card.classList.add('card-img-missing');
          const t2 = document.createElement('span');
          t2.className = 'card-title';
          onLang(() => { t2.textContent = L(title); });
          card.appendChild(t2);
        }
      });
      onLang(() => { img.alt = L(content.alt) || ''; });
      // no lazy loading here: the canvas is transformed, and moving a
      // transformed ancestor does not re-trigger the intersection check, so
      // cards in far clusters would never load.
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(img);
    } else if (content && content.vid) {
      const vid = document.createElement('video');
      vid.src = content.vid; vid.muted = true; vid.loop = true;
      vid.playsInline = true; vid.preload = 'none';
      vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      card.appendChild(vid);
    } else if (content && (content.link || content.goTo)) {
      card.className += ' card-link-pill';
      const span = document.createElement('span');
      span.className = 'card-link-text';
      onLang(() => { span.textContent = L(content.label); });
      card.appendChild(span);
    } else if (content && content.txt) {
      card.className += ' card-text-box';
      const pre = document.createElement('p');
      pre.className = 'card-text-preview';
      // separate text node so the inline hint survives a language swap
      const preText = document.createTextNode('');
      const hint = document.createElement('span');
      hint.className = 'card-text-hint';
      pre.appendChild(preText);
      pre.appendChild(hint);
      onLang(() => {
        preText.nodeValue = L(content.txt) + ' ';
        hint.textContent = t('archive.readmore');
      });
      card.appendChild(pre);
    } else if (content && content.credits) {
      card.className += ' card-credits-box';
      const span = document.createElement('span');
      span.className = 'card-credits-text';
      onLang(() => {
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        span.textContent = L(content.credits) + (note ? '\n' + note : '');
      });
      card.appendChild(span);
    } else {
      const band = document.createElement('div');
      band.className = 'card-band';
      if (colors.length === 1) {
        band.style.background = colors[0];
      } else {
        const stops = colors.map((c,i) => {
          const pct = 100 / colors.length;
          return `${c} ${(i*pct).toFixed(0)}%, ${c} ${((i+1)*pct).toFixed(0)}%`;
        }).join(', ');
        band.style.background = `linear-gradient(to right, ${stops})`;
      }
      const body = document.createElement('div');
      body.className = 'card-body';
      if (title) {
        // named titleEl, not t — t() is the global translator from lang.js
        const titleEl = document.createElement('span');
        titleEl.className = 'card-title';
        onLang(() => { titleEl.textContent = L(title); });
        body.appendChild(titleEl);
      }
      card.appendChild(band);
      card.appendChild(body);
    }

    const dots = document.createElement('div');
    dots.className = 'card-cats-dots';
    cats.forEach(k => {
      const d = document.createElement('span');
      d.className = 'cat-dot';
      d.style.background = CAT_MAP[k].color;
      dots.appendChild(d);
    });

    wrap.appendChild(card);
    // Dots mark cross-cluster relationships, so only show them when a card
    // actually carries more than one tag. Credits cards never show them.
    if (cats.length > 1 && !(content && content.credits)) {
      wrap.appendChild(dots);
    }

    // Per-card random float parameters
    const rSign = () => (Math.random() < 0.5 ? 1 : -1);
    wrap.style.setProperty('--fx',    (rSign() * (2 + Math.random() * 3)).toFixed(2) + 'px');
    wrap.style.setProperty('--fy',    (rSign() * (1.5 + Math.random() * 2.5)).toFixed(2) + 'px');
    wrap.style.setProperty('--fr',    (rSign() * (0.3 + Math.random() * 0.6)).toFixed(3));
    wrap.style.setProperty('--fdur',  (5 + Math.random() * 3.5).toFixed(1) + 's');
    wrap.style.setProperty('--fdelay',(-(Math.random() * 9)).toFixed(2) + 's');

    let _spx = 0, _spy = 0, _spt = 0;
    wrap.addEventListener('pointerdown', e => {
      _spx = e.clientX; _spy = e.clientY; _spt = Date.now();
      e.stopPropagation();
    }, { passive: true });
    wrap.addEventListener('pointerup', e => {
      if (Math.hypot(e.clientX - _spx, e.clientY - _spy) > 12 || Date.now() - _spt > 600) return;
      if (content && content.gallery) {
        openGalleryPopup(content, cats[0], title);
      } else if (content && content.goTo) {
        flyToCluster(content.goTo);
      } else if (content && content.img && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.link) {
        window.open(content.link, '_blank', 'noopener noreferrer');
      } else if (content && content.img) {
        openMediaPopup({ img: content.img, alt: content.alt, credit: content.credit, full: content.full, note: content.note, sources: content.sources, title }, cats[0]);
      } else if (content && content.vid) {
        openMediaPopup({ vid: content.vid, title }, cats[0]);
      } else if (content && content.txt) {
        openTextPopup(content.full || content.txt, cats[0]);
      } else if (!content || (!content.credits)) {
        openPanel(cats[0]);
      }
    }, { passive: true });

    canvasInner.appendChild(wrap);

    // A card marked stackBelow sits directly under the previous card rather
    // than at a fixed y. Text cards hug their content, so their height
    // changes with the language — anything pinned underneath them would
    // otherwise collide once the copy gets longer in translation.
    if (content && content.stackBelow) {
      const anchor = prevWrap;
      const gap = content.gap ?? 6;
      // registered after the anchor's own text updater, so it measures the
      // height the anchor has *after* the language swap
      onLang(() => { wrap.style.top = (anchor.offsetTop + anchor.offsetHeight + gap) + 'px'; });
    }
    prevWrap = wrap;
  });

  /* ═══════════════════════════════════════════════════
     BUILD CLUSTER LABELS
  ═══════════════════════════════════════════════════ */
  // Categories whose colour is light enough to need dark text on the cluster label
  const YELLOW_CATS = new Set(['hypersea', 'workshop', 'drawings']);

  CATS.forEach(({ key, label, color }) => {
    // Anchor the header to the cards that actually live in this cluster.
    // cats.includes() pulled in cross-tagged cards owned by other clusters,
    // which dragged e.g. the Sargassum header into the middle of Hypersea.
    // Cross-cluster ties are shown by the connection lines and card dots.
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity;
    members.forEach(([, x, y, w]) => {
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x + w);
      minY = Math.min(minY, y);
    });

    const cx = (minX + maxX) / 2;
    const lbl = document.createElement('div');
    lbl.className = 'cluster-label';
    lbl.dataset.cat = key;
    onLang(() => { lbl.textContent = L(label); });
    lbl.style.left   = cx + 'px';
    lbl.style.top    = (minY - 54) + 'px';
    lbl.style.background = color;
    lbl.style.color = YELLOW_CATS.has(key) ? '#1a1200' : '#ffffff';
    lbl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (key === 'hypersea') {
        window.location.href = 'hypersea.html';
      } else {
        openPanel(key);
      }
    });
    canvasInner.appendChild(lbl);
  });

  /* ═══════════════════════════════════════════════════
     BUILD LEGEND
  ═══════════════════════════════════════════════════ */
  const legendEl = document.getElementById('mapLegend');
  let activeFilter = null;

  CATS.forEach(({ key, label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cat = key;

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const lbl = document.createElement('span');
    lbl.className = 'legend-label';
    onLang(() => { lbl.textContent = L(label); });

    item.appendChild(dot);
    item.appendChild(lbl);
    legendEl.appendChild(item);

    item.addEventListener('click', () => {
      if (activeFilter === key) {
        activeFilter = null;
        applyFilter(null);
        flyToOverview();
      } else {
        activeFilter = key;
        applyFilter(key);
        flyToCluster(key);
      }
    });
  });

  function applyFilter(key) {
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    document.querySelectorAll('.card-wrap').forEach(el => {
      const cats = el.dataset.cats.split(',');
      el.classList.toggle('dimmed', key !== null && !cats.includes(key));
    });
    document.querySelectorAll('.cluster-label').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    svg.querySelectorAll('path').forEach(el => {
      const conn = el.dataset.connection || '';
      const relevant = key === null || conn.includes(key);
      el.style.transition = 'opacity 0.22s ease';
      el.style.opacity = relevant ? '' : '0.04';
    });
  }

  /* ── Compute bounding box of all cards for a category ── */
  function clusterBounds(key) {
    const members = CARDS.filter(([cats]) => cats[0] === key);
    if (!members.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    members.forEach(([, x, y, w, h]) => {
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, minY,
             w: maxX - minX, h: maxY - minY };
  }

  /* ── Animated fly to a cluster ── */
  let flyTimer = null;

  function flyTo(targetTx, targetTy, targetScale) {
    canvasInner.style.transition = 'transform 0.72s cubic-bezier(0.4, 0, 0.2, 1)';
    scale = targetScale;
    tx = targetTx;
    ty = targetTy;
    applyTransform();
    clearTimeout(flyTimer);
    flyTimer = setTimeout(() => { canvasInner.style.transition = ''; }, 800);
  }

  function flyToCluster(key) {
    const bounds = clusterBounds(key);
    if (!bounds) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const legendW = document.getElementById('mapLegend')?.offsetWidth || 220;
    const usableW = vw - legendW;
    const PAD = 60;
    // Fit the cluster if it is small, but never drop below MIN_READ: at the
    // old fit-everything scale a cluster the size of Hypersea landed around
    // 0.8x and the card text and photos were too small to read. Anything
    // taller than the viewport can be reached by dragging.
    const MIN_READ = 1.25, MAX_ZOOM = 1.8;
    const fit = Math.min(
      usableW / (bounds.w + PAD * 2),
      vh      / (bounds.h + PAD * 2),
      MAX_ZOOM
    );
    const targetScale = Math.max(fit, MIN_READ);
    // Center within the usable area (right of legend)
    const centerX = legendW + usableW / 2;
    // A cluster taller than the viewport should start at its top — its header
    // and opening cards — and be scrolled down through, rather than being
    // centred so that both ends are cut off.
    const LABEL_ROOM = 70;
    const fitsVertically = bounds.h * targetScale <= vh;
    const ty = fitsVertically
      ? vh / 2 - bounds.cy * targetScale
      : LABEL_ROOM - (bounds.minY - 54) * targetScale;
    flyTo(centerX - bounds.cx * targetScale, ty, targetScale);
  }

  /* Width reserved on the left for the legend panel, so the overview and
     the per-cluster fly-to never park content underneath it. */
  const LEGEND_GUTTER = 240;

  /* Measure the real extent of the map so the overview never goes stale
     when clusters are moved or the canvas is resized. */
  function contentBounds() {
    const PAD = 120;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvasInner.querySelectorAll('.card-wrap, .cluster-label').forEach(el => {
      const w = el.offsetWidth, h = el.offsetHeight;
      // cluster labels are centred on their x via translateX(-50%)
      const x = el.classList.contains('cluster-label') ? el.offsetLeft - w / 2 : el.offsetLeft;
      const y = el.offsetTop;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (!isFinite(minX)) return { x: 0, y: 0, w: 1000, h: 1000 };
    return { x: minX - PAD, y: minY - PAD, w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2 };
  }

  function flyToOverview() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    const targetScale = Math.min(availW / b.w, vh / b.h) * 0.92;
    flyTo(
      LEGEND_GUTTER + (availW - b.w * targetScale) / 2 - b.x * targetScale,
      (vh - b.h * targetScale) / 2 - b.y * targetScale,
      targetScale
    );
  }

  /* ═══════════════════════════════════════════════════
     PAN + ZOOM
  ═══════════════════════════════════════════════════ */
  const viewport = document.getElementById('viewport');
  let scale = 0.36;
  let tx = 0, ty = 0;
  let isPanning = false;
  let startX = 0, startY = 0;
  let dragOriginX = 0, dragOriginY = 0;
  let didDrag = false;

  let videoTimer = null;
  function updateVideos() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    document.querySelectorAll('.card-wrap').forEach(wrap => {
      const vid = wrap.querySelector('video');
      if (!vid) return;
      const cx = parseFloat(wrap.style.left);
      const cy = parseFloat(wrap.style.top);
      const cw = parseFloat(wrap.style.width);
      const cardEl = wrap.querySelector('.card');
      const ch = cardEl ? parseFloat(cardEl.style.height) : 80;
      const sx = cx * scale + tx, sy = cy * scale + ty;
      const visible = (cx + cw) * scale + tx > 0 && sx < vw &&
                      (cy + ch) * scale + ty > 0 && sy < vh;
      if (visible && scale > 0.45) {
        if (vid.paused) vid.play().catch(() => {});
      } else {
        if (!vid.paused) vid.pause();
      }
    });
  }

  function applyTransform() {
    canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    clearTimeout(videoTimer);
    videoTimer = setTimeout(updateVideos, 350);
  }

  function initView() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const b = contentBounds();
    const availW = Math.max(200, vw - LEGEND_GUTTER);
    scale = Math.min(availW / b.w, vh / b.h) * 0.92;
    tx = LEGEND_GUTTER + (availW - b.w * scale) / 2 - b.x * scale;
    ty = (vh - b.h * scale) / 2 - b.y * scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-controls')) return;
    isPanning = true;
    didDrag = false;
    startX = e.clientX; startY = e.clientY;
    dragOriginX = e.clientX; dragOriginY = e.clientY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!isPanning) return;
    const moved = Math.hypot(e.clientX - dragOriginX, e.clientY - dragOriginY);
    if (moved > 14) didDrag = true;
    tx += e.clientX - startX;
    ty += e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    applyTransform();
  });

  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
    setTimeout(() => { didDrag = false; }, 50);
  });

  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.11 : 0.90;
    const newScale = Math.max(0.15, Math.min(3, scale * factor));
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }, { passive: false });

  let pinchDist = 0;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const pcx = cx - rect.left, pcy = cy - rect.top;
    const canX = (pcx - tx) / scale;
    const canY = (pcy - ty) / scale;
    scale = Math.max(0.15, Math.min(3, scale * (d / pinchDist)));
    tx = pcx - canX * scale;
    ty = pcy - canY * scale;
    pinchDist = d;
    applyTransform();
  }, { passive: false });

  function zoomToCenter(f) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2, cy = vh / 2;
    const newScale = Math.max(0.15, Math.min(3, scale * f));
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }

  document.getElementById('btnZoomIn').addEventListener('click',  () => zoomToCenter(1.3));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomToCenter(0.77));

  // Init once layout is fully painted (requestAnimationFrame ensures flex heights are settled)
  if (document.readyState === 'complete') {
    requestAnimationFrame(initView);
  } else {
    window.addEventListener('load', () => requestAnimationFrame(initView));
  }
  window.addEventListener('resize', initView);

  /* ── H key → center ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') flyToOverview();
  });

  /* ── Idle water-float ── */
  let idleTimer = null;

  function goIdle() {
    canvasInner.classList.add('canvas-idle');
  }

  function wakeUp() {
    canvasInner.classList.remove('canvas-idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goIdle, 2500);
  }

  ['mousedown', 'touchstart', 'wheel'].forEach(ev =>
    viewport.addEventListener(ev, wakeUp, { passive: true })
  );

  // Start idle after 2s on load
  idleTimer = setTimeout(goIdle, 2000);

  /* ═══════════════════════════════════════════════════
     SECTION PANEL CONTENT

        hero.className = 'dp-hero';
        const img = document.createElement('img');
        img.src = section.heroImg; img.alt = L(section.heroAlt) || ''; img.loading = 'lazy';
        hero.appendChild(img);
        body.appendChild(hero);
      }

      const content = document.createElement('div');
      content.className = 'dp-content';

      let html = `<h2 class="dp-title">${L(section.title)}</h2>`;

      if (section.body) {
        html += `<p class="dp-text">${L(section.body)}</p>`;
      }

      if (section.streamLink) {
        html += `<a class="dp-ext-link" href="${section.streamLink.href}" target="_blank" rel="noopener">
          <span class="dp-ext-title">${L(section.streamLink.title)}</span>
          <span class="dp-ext-arrow">↗</span>
        </a>`;
      }

      if (section.reading) {
        html += `<div class="dp-divider"></div><p class="dp-label">${L(section.reading.label)}</p>`;
        section.reading.items.forEach(item => {
          if (item.type === 'book') {
            html += `<a class="dp-book" href="${item.href}" target="_blank" rel="noopener">
              <div class="dp-book-cover"><img src="${item.cover}" alt="${L(item.title)}" /></div>
              <div>
                <p class="dp-book-title">${L(item.title)}</p>
                <p class="dp-book-author">${L(item.author)}</p>
                <span class="dp-pill" style="background:${cat.color};color:${darkText?'#1a1200':'#fff'}">${t('archive.read')}</span>
              </div>
            </a>`;
          } else {
            html += `<a class="dp-ext-link" href="${item.href}" target="_blank" rel="noopener">
              <span class="dp-ext-title">${L(item.title)}</span>
              <span class="dp-ext-arrow">↗</span>
            </a>`;
          }
        });
      }

      if (section.glassSection) {
        const gs = section.glassSection;
        html += `<div class="dp-divider"></div><p class="dp-label">${L(gs.label)}</p>`;
        if (gs.body) html += `<p class="dp-text">${L(gs.body)}</p>`;
        if (gs.photos && gs.photos.length) {
          html += `<div class="dp-photo-grid">${gs.photos.map(p => `<img src="${p.src}" alt="${p.alt}" loading="lazy" />`).join('')}</div>`;
        }
        if (gs.videos && gs.videos.length) {
          html += `<div class="dp-video-grid">${gs.videos.map(v => `<video src="${v}" controls playsinline preload="metadata"></video>`).join('')}</div>`;
        }
        if (gs.credits) html += `<p class="dp-credits">${L(gs.credits)}</p>`;
        if (L(MT_NOTICE)) html += `<p class="dp-mt-notice">${L(MT_NOTICE)}</p>`;
      }

      content.innerHTML = html;
      body.appendChild(content);

      if (section.footerImg) {
        const footer = document.createElement('div');
        footer.className = 'dp-hero';
        const img = document.createElement('img');
        img.src = section.footerImg.src; img.alt = L(section.footerImg.alt) || ''; img.loading = 'lazy';
        footer.appendChild(img);
        body.appendChild(footer);
      }
    }

    overlay.classList.add('active');
    body.scrollTop = 0;
  }

  function closePanel() {
    document.getElementById('cardOverlay').classList.remove('active');
    openPanelKey = null;
  }

  document.getElementById('btnClosePanel').addEventListener('click', closePanel);
  document.getElementById('cardOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('cardOverlay')) closePanel();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  /* ── Stream play/pause ── */
  /* ═══════════════════════════════════════════════════
     MOBILE — cluster list + field notes

     Built from CATS and CARDS, the same data the map draws from, so a
     cluster gains a mobile view as soon as its cards exist and translated
     copy only has to be written once.
  ═══════════════════════════════════════════════════ */
  const mList = document.getElementById('mList');
  const mNotes = document.getElementById('mNotes');
  const mNotesBody = document.getElementById('mNotesBody');
  const mNotesChip = document.getElementById('mNotesChip');
  const mBack = document.getElementById('mBack');

  CATS.forEach(({ key, label, color }) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'm-item';
    btn.type = 'button';
    const dot = document.createElement('span');
    dot.className = 'm-dot';
    dot.style.background = color;
    const txt = document.createElement('span');
    onLang(() => { txt.textContent = L(label); });
    btn.appendChild(dot); btn.appendChild(txt);
    btn.addEventListener('click', () => openNotes(key));
    li.appendChild(btn);
    mList.appendChild(li);
  });

  const mCta = document.createElement('a');
  mCta.className = 'm-cta';
  mCta.href = 'memories.html';
  onLang(() => { mCta.textContent = t('archive.contribute'); });
  mList.parentNode.insertBefore(mCta, mNotes);

  // The map places cards spatially; a phone needs a reading order, so group
  // by kind: words first, then what to read next, then the images, then credits.
  function notesOrder(cards) {
    const rank = c => {
      const k = c[6];
      if (k && k.txt) return 0;
      if (k && ((k.link && !k.img) || k.goTo)) return 1;
      if (k && (k.img || k.vid)) return 2;
      if (!k) return 3;
      if (k && k.credits) return 4;
      return 3;
    };
    return cards.map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(p => p[0]);
  }

  function openNotes(key) {
    const cat = CAT_MAP[key];
    mNotesChip.textContent = L(cat.label);
    mNotesChip.style.background = cat.color;
    mNotesChip.style.color = YELLOW_CATS.has(key) ? '#1a1200' : '#ffffff';
    mNotesBody.innerHTML = '';

    const cards = notesOrder(CARDS.filter(([cats]) => cats[0] === key));
    let rendered = 0;

    cards.forEach(([, , , , , title, content]) => {
      if (content && content.txt) {
        const p = document.createElement('p');
        p.className = 'm-text';
        p.textContent = L(content.full || content.txt);
        mNotesBody.appendChild(p); rendered++;
      } else if (content && content.gallery) {
        const strip = document.createElement('div');
        strip.className = 'm-strip';
        content.gallery.forEach(g => {
          const fig = document.createElement('figure');
          const im = document.createElement('img');
          im.src = g.src; im.alt = L(g.alt) || ''; im.loading = 'lazy';
          fig.appendChild(im);
          if (L(g.alt)) {
            const c = document.createElement('figcaption');
            c.className = 'm-caption'; c.textContent = L(g.alt);
            fig.appendChild(c);
          }
          strip.appendChild(fig);
        });
        mNotesBody.appendChild(strip); rendered++;
      } else if (content && content.goTo) {
        const btn = document.createElement('button');
        btn.className = 'm-link'; btn.type = 'button';
        btn.textContent = L(content.label);
        btn.addEventListener('click', () => openNotes(content.goTo));
        mNotesBody.appendChild(btn); rendered++;
      } else if (content && content.link && !content.img) {
        const a = document.createElement('a');
        a.className = 'm-link'; a.href = content.link;
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = L(content.label);
        mNotesBody.appendChild(a); rendered++;
      } else if (content && content.img) {
        const fig = document.createElement('figure');
        fig.className = 'm-figure';
        const img = document.createElement('img');
        img.className = 'm-media'; img.src = content.img;
        img.alt = L(content.alt) || ''; img.loading = 'lazy';
        // book covers and other objects read better small and centred than
        // blown up to the full width of the phone
        if (content.mWidth) {
          fig.classList.add('m-figure-centred');
          img.style.maxWidth = content.mWidth + 'px';
        }
        if (content.link) {
          const a = document.createElement('a');
          a.href = content.link; a.target = '_blank'; a.rel = 'noopener';
          a.appendChild(img); fig.appendChild(a);
        } else {
          fig.appendChild(img);
        }
        if (L(content.alt) || L(content.credit)) {
          const cap = document.createElement('figcaption');
          cap.className = 'm-caption';
          cap.textContent = L(content.alt) || '';
          if (L(content.credit)) {
            const cr = document.createElement('span');
            cr.style.cssText = 'display:block;opacity:0.75;';
            cr.textContent = '© ' + L(content.credit);
            cap.appendChild(cr);
          }
          fig.appendChild(cap);
        }
        mNotesBody.appendChild(fig); rendered++;
        if (L(content.full)) {
          const st = document.createElement('p');
          st.className = 'm-text';
          st.textContent = L(content.full);
          mNotesBody.appendChild(st);
        }
        if (L(content.note)) {
          const nt = document.createElement('p');
          nt.className = 'm-caption';
          nt.style.cssText = 'font-style:italic;';
          nt.textContent = L(content.note);
          mNotesBody.appendChild(nt);
        }
        (content.sources || []).forEach(src => {
          const a = document.createElement('a');
          a.className = 'm-link'; a.href = src.href;
          a.target = '_blank'; a.rel = 'noopener';
          a.textContent = '↗ ' + L(src.label);
          mNotesBody.appendChild(a);
        });
      } else if (content && content.vid) {
        const v = document.createElement('video');
        v.className = 'm-media'; v.src = content.vid;
        v.controls = true; v.playsInline = true; v.preload = 'metadata';
        mNotesBody.appendChild(v); rendered++;
      } else if (content && content.credits) {
        const p = document.createElement('p');
        p.className = 'm-credits';
        const note = content.mtNotice ? L(MT_NOTICE) : '';
        p.textContent = L(content.credits) + (note ? '\n' + note : '');
        mNotesBody.appendChild(p); rendered++;
      } else if (title) {
        const h = document.createElement('p');
        h.className = 'm-heading';
        h.textContent = L(title);
        mNotesBody.appendChild(h); rendered++;
      }
    });

    if (!rendered) {
      const p = document.createElement('p');
      p.className = 'm-empty';
      p.textContent = t('archive.placeholder');
      mNotesBody.appendChild(p);
    }

    mList.hidden = true; mCta.hidden = true; mNotes.hidden = false;
    window.scrollTo(0, 0);
    openNotesKey = key;
  }

  function closeNotes() {
    mNotes.hidden = true; mList.hidden = false; mCta.hidden = false;
    openNotesKey = null;
  }
  let openNotesKey = null;
  mBack.addEventListener('click', closeNotes);
  onLang(() => {
    mBack.textContent = '← ' + t('archive.back');
    if (openNotesKey) openNotes(openNotesKey);   // redraw notes in the new language
  });

  const streamAudio = document.getElementById('streamAudio');
  const btnStream   = document.getElementById('btnStream');
  let streamPlaying = false;

  btnStream.addEventListener('click', () => {
    if (streamPlaying) {
      streamAudio.pause();
      btnStream.innerHTML = '&#9654;';
      btnStream.classList.remove('playing');
    } else {
      streamAudio.play();
      btnStream.innerHTML = '&#9646;&#9646;';
      btnStream.classList.add('playing');
    }
    streamPlaying = !streamPlaying;
  });
  </script>

</body>
</html>
