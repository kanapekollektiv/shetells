<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>she tells — the living archive</title>
  <script src="lang.js?v=7"></script>
  <style>
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1.2rem; text-decoration: none; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(52px, 7.5vw, 108px);
      line-height: 1;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(13px, 1.6vw, 22px);
      color: #111111;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5em;
      white-space: nowrap;
    }

    .brand-line {
      display: inline-block;
      height: clamp(8px, 1vw, 12px);
      width: clamp(40px, 4vw, 60px);
      flex-shrink: 0;
    }

    /* ── Nav buttons (mirrors main page style) ── */
    .const-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      align-self: flex-start;
      padding-top: 0.2rem;
    }

    .c-btn {
      font-family: 'Celescript', cursive;
      font-size: clamp(11px, 1.2vw, 16px);
      cursor: pointer;
      border: none;
      transition: background 0.18s, color 0.18s, transform 0.12s;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .c-btn:active { transform: scale(0.96); }

    .c-btn-circle {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      border: 1.5px solid #111111;
      background: transparent;
      color: #111111;
    }
    .c-btn-circle:hover { background: #111111; color: #ffffff; }

    .c-btn-filled {
      background: #111111;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
    }
    .c-btn-filled:hover { background: #333; }

    .c-btn-outline {
      background: transparent;
      color: #111111;
      padding: 0.55rem 1.4rem;
      border-radius: 2rem;
      border: 1.5px solid #111111;
    }
    .c-btn-outline:hover { background: #111111; color: #ffffff; }
    .c-btn-outline.playing { background: #111111; color: #ffffff; }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 4800px;
      height: 2300px;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 1px 4px rgba(0,0,0,0.10),
        0 3px 10px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 8px 24px rgba(0,0,0,0.14),
        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
      flex-shrink: 0;
    }

    .card-body {
      width: 100%;
      flex: 1;
      background: #DAD7D0;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }

    .card-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 10px;
      color: rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    .card-cats-dots {
      display: flex;
      gap: 3px;
      justify-content: center;
    }

    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .map-legend {
      position: fixed;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 1.1rem 1.3rem;
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .legend-item:not(.dimmed):hover .legend-dot { transform: scale(1.45); }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      color: #111111;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.9);
      color: #111111;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .zoom-btn:hover { background: #111111; color: #fff; border-color: #111111; }

    .map-hint {
      position: absolute;
      bottom: 16px; right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.55);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 20;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 8px 14px;
      line-height: 1.7;
      text-align: right;
    }

    /* ── Filter transitions ── */
    .card-wrap { transition: opacity 0.22s ease; }
    .card-wrap.dimmed { opacity: 0.08; }
    .card-wrap:hover { z-index: 30 !important; position: relative; }

    /* ── Idle water-float ── */
    @keyframes floatWater {
      0%   { transform: translate(0px, 0px); }
      20%  { transform: translate(var(--fx), calc(var(--fy) * -1)); }
      45%  { transform: translate(calc(var(--fx) * -0.6), var(--fy)); }
      70%  { transform: translate(calc(var(--fx) * 0.4), calc(var(--fy) * -0.8)); }
      100% { transform: translate(0px, 0px); }
    }

    .canvas-idle .card-wrap {
      animation: floatWater var(--fdur, 7s) ease-in-out infinite var(--fdelay, 0s);
    }

    /* ── Cluster headline labels ── */
    .cluster-label {
      position: absolute;
      transform: translateX(-50%);
      font-family: 'Celescript', cursive;
      font-size: 13pt;
      line-height: 1;
      padding: 8px 22px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      z-index: 6;
      transition: opacity 0.22s ease;
    }
    .cluster-label.dimmed { opacity: 0.05; }

    /* ── Link pill card ── */
    .card-link-pill {
      border-radius: 999px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.2);
      box-shadow: none !important;
      display: flex; align-items: center; justify-content: center;
      overflow: visible !important;
    }
    .card-link-pill:hover { background: #f5f5f5; transform: none !important; }
    .card-link-text {
      font-family: 'Celescript', cursive;
      font-size: 10px; color: #111; letter-spacing: 0.04em; white-space: nowrap;
    }

    .card-img-missing {
      display: flex; align-items: center; justify-content: center;
      background: #f2f2f2; padding: 8px;
    }

    .card-gallery { position: relative; background: #f2f2f2; }
    .gal-dots {
      position: absolute; left: 0; right: 0; bottom: 4px;
      display: flex; justify-content: center; gap: 3px; pointer-events: none;
    }
    .gal-dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 0 2px rgba(0,0,0,0.4);
    }
    .gal-dots span.on { background: #fff; }
    .gal-stage {
      position: relative; background: #f4f4f4;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; min-height: 220px;
    }
    .gal-stage img {
      max-width: 100%; max-height: 66vh;
      object-fit: contain; display: block; border-radius: 4px;
    }
    .gal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.92);
      font-size: 20px; line-height: 1; cursor: pointer; color: #222;
    }
    .gal-nav:hover { background: #fff; }
    .gal-prev { left: 10px; }
    .gal-next { right: 10px; }
    .gal-bar {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; padding: 0.8rem 1.2rem 1.4rem;
    }
    .gal-cap {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.6; color: #555; margin: 0;
    }
    .gal-count {
      font-family: 'Celescript', cursive; font-size: 11px;
      color: rgba(0,0,0,0.4); white-space: nowrap;
    }

    .gal-intro {
      padding: 0.2rem 1.2rem 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.78; color: #333; white-space: pre-line;
    }
    .gal-entry { padding: 0 1.2rem 1.2rem; }
    .gal-entry h3 {
      font-family: 'Celescript', cursive; font-size: 14px;
      letter-spacing: 0.05em; color: #111; margin: 0 0 0.35rem;
    }
    .gal-entry p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px; line-height: 1.72; color: #444;
      margin: 0 0 0.5rem; white-space: pre-line;
    }
    .gal-entry a {
      display: block; font-family: system-ui, -apple-system, sans-serif;
      font-size: 12.5px; line-height: 1.6; color: #3a3a3a; margin-bottom: 0.25rem;
    }

    /* ── Text preview card ── */
    .card-text-box {
      border-radius: 12px !important;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
      padding: 11px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .card-text-box:hover { border-color: rgba(0,0,0,0.3) !important; }
    .card-text-preview {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; line-height: 1.52; color: #333;
      white-space: pre-line;
    }
    .card-text-hint {
      font-family: 'Celescript', cursive;
      font-size: 8.5px; color: rgba(0,0,0,0.28); letter-spacing: 0.05em; white-space: nowrap;
    }

    /* ── Credits card ── */
    .card-credits-box {
      background: transparent; border: none;
      box-shadow: none !important; padding: 2px 0;
    }
    .card-credits-box:hover { transform: none !important; box-shadow: none !important; }
    .card-credits-text {
      font-family: 'Celescript', cursive;
      font-size: 9px; color: rgba(0,0,0,0.38); letter-spacing: 0.04em; line-height: 1.5;
      white-space: pre-line;
    }

    /* ── Card Popup Modal (matches ? info overlay style) ── */
    .card-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .card-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .card-popup {
      background: #ffffff;
      color: #111111;
      border: 1.5px solid #111111;
      border-radius: 1.2rem;
      max-width: 680px;
      width: 90%;
      max-height: 78vh;
      overflow: hidden;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    .card-overlay.active .card-popup { transform: translateY(0); }

    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
    }
    .dp-chip {
      font-family: 'Celescript', cursive;
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 14px;
      letter-spacing: 0.05em;
    }
    .dp-close {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 1.4rem;
      color: #111111;
      line-height: 1;
      padding: 2px 6px;
      transition: opacity 0.15s;
    }
    .dp-close:hover { opacity: 0.5; }

    .dp-body {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #111111 rgba(0,0,0,0.06);
    }
    .dp-body::-webkit-scrollbar { width: 6px; }
    .dp-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.06); }
    .dp-body::-webkit-scrollbar-thumb { background: #111111; }

    .dp-hero { width: 100%; overflow: hidden; flex-shrink: 0; }
    .dp-hero img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

    .dp-content { padding: 1.5rem 1.6rem 2.5rem; }
    .dp-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 1rem;
    }
    .dp-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.78;
      color: #444;
      margin-bottom: 1.4rem;
    }
    .dp-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 1.2rem 0; }
    .dp-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 0.9rem;
    }
    .dp-book {
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .dp-book-cover {
      width: 68px; flex-shrink: 0;
      border-radius: 3px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }
    .dp-book-cover img { width: 100%; display: block; }
    .dp-book-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 15px;
      color: #111; line-height: 1.3; margin-bottom: 0.25rem;
    }
    .dp-book-author {
      font-family: system-ui, sans-serif;
      font-size: 12px; color: rgba(0,0,0,0.42); margin-bottom: 0.6rem;
    }
    .dp-pill {
      font-family: 'Celescript', cursive;
      font-size: 10px; border-radius: 999px;
      padding: 3px 13px; text-decoration: none;
      display: inline-flex; transition: opacity 0.15s;
    }
    .dp-pill:hover { opacity: 0.75; }
    .dp-ext-link {
      display: flex; align-items: baseline; gap: 0.8rem;
      text-decoration: none; padding: 0.75rem 1rem;
      border: 1.5px solid rgba(0,0,0,0.09); border-radius: 10px;
      margin-bottom: 0.5rem; transition: border-color 0.18s, background 0.18s;
    }
    .dp-ext-link:hover { background: rgba(0,0,0,0.025); border-color: rgba(0,0,0,0.22); }
    .dp-ext-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400; font-size: 14px; color: #111; flex: 1; line-height: 1.4;
    }
    .dp-ext-arrow { font-size: 12px; flex-shrink: 0; opacity: 0.45; }
    .dp-photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 5px; margin-bottom: 5px;
    }
    .dp-photo-grid img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-video-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px; margin-bottom: 0.8rem;
    }
    .dp-video-grid video {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .dp-credits {
      font-family: 'Celescript', cursive;
      font-size: 10px; letter-spacing: 0.05em; color: rgba(0,0,0,0.35);
    }
    .dp-mt-notice {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px; font-style: italic;
      color: rgba(0,0,0,0.3); margin-top: 0.4rem;
    }
    .dp-placeholder {
      font-family: 'Celescript', cursive;
      font-size: 12px; color: rgba(0,0,0,0.28);
      letter-spacing: 0.06em; margin-top: 1.6rem;
    }

    /* ══ Mobile: list of clusters -> field notes ══════════════════════ */
    .m-view { display: none; }

    @media (max-width: 768px) {
      .map-viewport, .map-legend { display: none !important; }
      /* the map pins the page to the viewport; the list has to scroll */
      html, body { overflow: auto !important; height: auto !important; }
      .m-view { display: block; padding: 0 1.25rem 3rem; }
      /* explicit display rules below would otherwise beat the hidden attribute */
      .m-view [hidden] { display: none !important; }

      .const-header { flex-direction: column; align-items: flex-start; gap: 0.9rem; }
      .const-nav { gap: 0.5rem; }
      .const-nav .c-btn-filled { display: none; }   /* returns at the list foot */

      .m-list { list-style: none; margin: 1.5rem 0 0; padding: 0; }
      .m-item {
        display: flex; align-items: center; gap: 1rem;
        padding: 1.15rem 0.25rem;
        border-bottom: 1.5px solid var(--black, #111);
        cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
        width: 100%; text-align: left;
        font-family: 'Celescript', cursive; font-size: 15px;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--black, #111);
      }
      .m-list li:last-child .m-item { border-bottom: 0; }
      .m-item:active { opacity: 0.55; }
      .m-dot { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }

      .m-cta {
        display: block; margin: 2rem 0 0; padding: 0.85rem 1.2rem;
        border-radius: 999px; background: #111; color: #fff;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.06em; text-transform: uppercase;
        text-align: center; text-decoration: none;
      }

      /* ── field notes ── */
      .m-notes { padding-top: 1.25rem; }
      .m-back {
        background: none; border: 0; padding: 0 0 1rem; cursor: pointer;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.06em; color: rgba(0,0,0,0.5);
      }
      .m-notes-chip {
        display: inline-block; padding: 7px 18px; border-radius: 999px;
        font-family: 'Celescript', cursive; font-size: 13px;
        letter-spacing: 0.05em; text-transform: uppercase;
      }
      .m-notes-body { margin-top: 1.4rem; }
      .m-notes-body > * { margin: 0 0 1.15rem; }
      .m-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px; line-height: 1.72; color: #333; white-space: pre-line;
      }
      .m-link {
        display: block; padding: 0.72rem 1.1rem; border-radius: 999px;

      /* a gallery scrolls sideways rather than stacking every frame */

  /* ═══════════════════════════════════════════════════
     BILINGUAL CONTENT
     Any string in CATS / CARDS / SECTIONS may be written either as a plain

     { en: '…', pt: '…' }. L() returns the active language and falls back to
     English, so untranslated entries keep rendering instead of going blank.
     Chrome that lives in the HTML uses the site-wide data-i18n mechanism in
     lang.js instead.
  ═══════════════════════════════════════════════════ */
  function L(v) {
    if (v == null || typeof v === 'string') return v;
    const lang = (typeof currentLang !== 'undefined') ? currentLang : 'en';
    return v[lang] ?? v.en ?? '';
  }

  // Re-apply language-dependent text to DOM that is already built, so
  // switching language never rebuilds the map — a rebuild would throw away
  // the current pan, zoom and per-card float phase.
  let openPanelKey = null;

  const langUpdaters = [];
  function onLang(fn) { langUpdaters.push(fn); fn(); }
  document.addEventListener('langchange', () => {

  /* ═══════════════════════════════════════════════════

  const CONNECTIONS = [

  /* ═══════════════════════════════════════════════════
     CARD DATA
     [cats[], x, y, w, h, title, url]
  ═══════════════════════════════════════════════════ */
  const CARDS = [
    // ── HYPERSEA — reading link pills
    [['hypersea'], 214, 150, 442, 34, null, { link: 'https://spacestudios.org.uk/wp-content/uploads/2017/11/hydrofeminism_or_on_becoming_a_body_of_water.pdf', label: 'Astrida Neimanis — Hydrofeminism: On Becoming Body of Water →' }],
    [['hypersea'], 272, 197, 422, 34, null, { link: 'https://www.researchgate.net/publication/335701988_The_ocean_in_excess_Towards_a_more-than-wet_ontology', label: 'The ocean in excess: Towards a more-than-wet ontology →' }],

    // ── HYPERSEA — book cover + link pill below
    [['hypersea', 'local'], 272, 262, 125, 168, null, { img: 'la/hypersea/book.jpg', alt: 'Hypersea: Life on Land', link: 'https://www.sciencedirect.com/science/article/abs/pii/030326479390043C', mWidth: 165 }],
    [['hypersea'], 272, 455, 172,  34, null, { link: 'https://www.sciencedirect.com/science/article/abs/pii/030326479390043C', label: { en: 'Link to the Book →', pt: 'Link para o livro →' } }],

    // ── HYPERSEA — intro text card (right of book, clear gap)
    [['hypersea'], 562, 264, 308, 272, null, { txt: { en: 'We have been using the Hypersea concept by Mark A. S. McMenamin (Author), Dianna L. Schulte McMenamin as prompts to remember and reimagine. Inviting participants to reconsider their entanglement with water, to recall the partial liquidity of their own bodies, and to sense the connective tissue that water forms across ecosystems. Here you can fin some related reading and our path to the Hypersea…', pt: 'Temos vindo a utilizar o conceito «Hypersea», da autoria de Mark A. S. McMenamin (autor) e Dianna L. Schulte McMenamin, como pontos de partida para recordar e reimaginar. Convidamos os participantes a reconsiderar a sua relação com a água, a recordar a liquidez parcial dos seus próprios corpos e a sentir o tecido conjuntivo que a água forma entre os ecossistemas. Aqui podem encontrar algumas leituras relacionadas e o nosso percurso até ao Hypersea' }, full: { en: 'We have been using the Hypersea concept by Mark A. S. McMenamin (Author), Dianna L. Schulte McMenamin as prompts to remember and reimagine. Inviting participants to reconsider their entanglement with water, to recall the partial liquidity of their own bodies, and to sense the connective tissue that water forms across ecosystems. Here you can fin some related reading and our path to the Hypersea…', pt: 'Temos vindo a utilizar o conceito «Hypersea», da autoria de Mark A. S. McMenamin (autor) e Dianna L. Schulte McMenamin, como pontos de partida para recordar e reimaginar. Convidamos os participantes a reconsiderar a sua relação com a água, a recordar a liquidez parcial dos seus próprios corpos e a sentir o tecido conjuntivo que a água forma entre os ecossistemas. Aqui podem encontrar algumas leituras relacionadas e o nosso percurso até ao Hypersea' } }],

    // ── HYPERSEA — glass text card (below book, spanning bottom-left)
    [['hypersea', 'sargassum'], 150, 504, 300, 248, null, { txt: { en: 'We created the glass sculptures working with the materiality of sand as an object of the Hypersea, a point of remembering. Sand is already sea, ground shell and rock and marine sediment gathered by the water, and in melting it into glass we make one more Hypersea gesture: sea-matter changing state, becoming a vessel that can hold field recordings from the Esposende coastline and the stories entangled with sargassum.', pt: 'Criámos as esculturas de vidro trabalhando com a materialidade da areia como um objeto do Hypersea, um ponto de memória. A areia já é mar, conchas trituradas, rocha e sedimentos marinhos reunidos pela água; e, ao fundi-la em vidro, fazemos mais um gesto do Hypersea: a matéria do mar muda de estado, tornando-se um recipiente capaz de conter gravações de campo da costa de Esposende e as histórias entrelaçadas com as algas sargaço.' }, full: { en: 'We created the glass sculptures working with the materiality of sand as an object of the Hypersea, a point of remembering. Sand is already sea, ground shell and rock and marine sediment gathered by the water, and in melting it into glass we make one more Hypersea gesture: sea-matter changing state, becoming a vessel that can hold field recordings from the Esposende coastline and the stories entangled with sargassum. The sculpture becomes a body of water in another form, a place where the ocean is remembered rather than extracted.', pt: 'Criámos as esculturas de vidro trabalhando com a materialidade da areia como um objeto do Hypersea, um ponto de memória. A areia já é mar, conchas trituradas, rocha e sedimentos marinhos reunidos pela água; e, ao fundi-la em vidro, fazemos mais um gesto do Hypersea: a matéria do mar muda de estado, tornando-se um recipiente capaz de conter gravações de campo da costa de Esposende e as histórias entrelaçadas com as algas sargaço. A escultura torna-se uma massa de água sob outra forma, um lugar onde o oceano é recordado em vez de extraído.' } }],

    // ── HYPERSEA — credits
    [['hypersea'], 150, 695, 300, 48, null, { credits: { en: '.credits: glass blown by @berlinglassworks and @vivianestroede', pt: 'Créditos: vidro soprado por @berlinglassworks e @vivianestroede' }, stackBelow: true, gap: 6, mtNotice: true }],

    // ── HYPERSEA — photos (scattered collage)

    [['hypersea', 'workshop'],   470, 478, 132, 106, null, { img: 'la/hypersea/IMG_8729.jpg', alt: 'Glass blowing workshop' }],

    // ── HYPERSEA — videos (lazy-play)
    [['hypersea', 'workshop'],   700, 636, 132, 96, null, { vid: 'la/hypersea/glass1.mp4' }],

    // ── LOCAL STORIES
    // ── LOCAL STORIES — text column
    [['local'], 2100,  180, 300,  70, null, { txt: { en: 'These are some stories our research group gleaned and experienced.', pt: 'Estas são algumas das histórias que o nosso grupo de investigação recolheu e viveu.' }, full: { en: 'These are some stories our research group gleaned and experienced.', pt: 'Estas são algumas das histórias que o nosso grupo de investigação recolheu e viveu.' } }],
    [['local'], 2100,  262, 300, 150, null, { txt: { en: 'The tradition is still close here. In Apúlia the sargaço was gathered by the sargaceiros and the sargaceiras, dried on the sand for three days, and carried onto the masseira fields as fertiliser. By royal decision it carried no tax. Today it goes mostly to pharmacy, cosmetics and food.\n\nEveryone we spoke to had a version of it. A grandmother who gathered, a field that used to be a masseira, a beach that used to be full of carts.', pt: 'A tradição ainda está próxima daqui. Na Apúlia o sargaço era recolhido pelos sargaceiros e pelas sargaceiras, seco na areia durante três dias e levado para os campos de masseira como fertilizante. Por decisão régia não pagava imposto. Hoje segue sobretudo para a farmácia, a cosmética e a alimentação.\n\nTodas as pessoas com quem falámos tinham uma versão disto. Uma avó que apanhava, um campo que já foi masseira, uma praia que já esteve cheia de carroças.' }, full: { en: 'The tradition is still close here. In Apúlia the sargaço was gathered by the sargaceiros and the sargaceiras, dried on the sand for three days, and carried onto the masseira fields as fertiliser. By royal decision it carried no tax. Today it goes mostly to pharmacy, cosmetics and food.\n\nEveryone we spoke to had a version of it. A grandmother who gathered, a field that used to be a masseira, a beach that used to be full of carts.', pt: 'A tradição ainda está próxima daqui. Na Apúlia o sargaço era recolhido pelos sargaceiros e pelas sargaceiras, seco na areia durante três dias e levado para os campos de masseira como fertilizante. Por decisão régia não pagava imposto. Hoje segue sobretudo para a farmácia, a cosmética e a alimentação.\n\nTodas as pessoas com quem falámos tinham uma versão disto. Uma avó que apanhava, um campo que já foi masseira, uma praia que já esteve cheia de carroças.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' }, sources: [{ href: 'https://www.visitesposende.com/en/fazer/monumentos/sargasso-museum', label: { en: 'Museu do Sargaço, Esposende', pt: 'Museu do Sargaço, Esposende' } }], stackBelow: true, gap: 14 }],
    [['local', 'sargassum'], 2100, 424, 250, 34, null, { goTo: 'sargassum', label: { en: 'The sargaço cluster →', pt: 'O grupo do sargaço →' }, stackBelow: true, gap: 12 }],
    [['local'], 2100,  470, 300, 180, null, { txt: { en: 'Rio Neiva is the association hosting us in Esposende. It was founded on 17 November 1989, is based in Antas, and works for the defence of the environment and the conservation of the Neiva river valley.\n\nTheir work runs across environmental education, nature based sports and projects, from biodiversity and citizen science to coastal conservation. We have been working out of their space, and much of what we gleaned came through them.\n\nAn interview and more of this story are coming soon.', pt: 'A Rio Neiva é a associação que nos acolhe em Esposende. Foi fundada a 17 de novembro de 1989, tem sede em Antas e trabalha pela defesa do ambiente e pela conservação do vale do rio Neiva.\n\nO seu trabalho passa pela educação ambiental, pelos desportos de natureza e por projetos, da biodiversidade e da ciência cidadã à conservação costeira. Temos trabalhado a partir do seu espaço, e muito do que recolhemos chegou através deles.\n\nUma entrevista e mais desta história chegam em breve.' }, full: { en: 'Rio Neiva is the association hosting us in Esposende. It was founded on 17 November 1989, is based in Antas, and works for the defence of the environment and the conservation of the Neiva river valley.\n\nTheir work runs across environmental education, nature based sports and projects, from biodiversity and citizen science to coastal conservation. We have been working out of their space, and much of what we gleaned came through them.\n\nAn interview and more of this story are coming soon.', pt: 'A Rio Neiva é a associação que nos acolhe em Esposende. Foi fundada a 17 de novembro de 1989, tem sede em Antas e trabalha pela defesa do ambiente e pela conservação do vale do rio Neiva.\n\nO seu trabalho passa pela educação ambiental, pelos desportos de natureza e por projetos, da biodiversidade e da ciência cidadã à conservação costeira. Temos trabalhado a partir do seu espaço, e muito do que recolhemos chegou através deles.\n\nUma entrevista e mais desta história chegam em breve.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' }, sources: [{ href: 'https://rioneiva.com/', label: { en: 'Rio Neiva, Associação de Defesa do Ambiente', pt: 'Rio Neiva, Associação de Defesa do Ambiente' } }], stackBelow: true, gap: 16 }],
    [['local', 'future'], 2100, 662, 290, 34, null, { goTo: 'future', label: { en: 'Our non human future products →', pt: 'Os nossos produtos futuros não humanos →' }, stackBelow: true, gap: 12 }],

    // ── LOCAL STORIES — the gleaned material
    [['local'], 2460,  180, 118, 158, 'A water memory', { img: 'la/local/gleaned-note.jpg', alt: { en: 'A water memory written by hand at one of the workshops', pt: 'Uma memória de água escrita à mão numa das oficinas' }, full: { en: 'The water flows through the river into the ocean.... with so many sounds and colours...\nIt whispers in the summer and it sings and roars in the winter\nIt incorporates the fragrances and smells of everything and everybody that goes by....', pt: 'A água corre pelo rio até ao oceano.... com tantos sons e tantas cores...\nSussurra no verão e canta e ruge no inverno\nIncorpora as fragrâncias e os cheiros de tudo e de todos os que passam....' } }],
    [['local', 'workshop'], 2600, 180, 160,  95, 'Postcards', { img: 'la/local/postcards.jpg', alt: { en: 'Postcards drawn at the launch workshops, pinned to the wall', pt: 'Postais desenhados nas oficinas de lançamento, afixados na parede' }, full: { en: 'At the launch workshops at the Museu do Sargaço we handed out postcards. The ocean has been collecting stories longer than we have. Draw your water memory here.\n\nPeople drew white foamy plains and hard rock, dunes and a group of friends, an ear and a list, collect tinny, sand, record the wind. Somebody wrote an equation instead.', pt: 'Nas oficinas de lançamento no Museu do Sargaço distribuímos postais. O oceano recolhe histórias há mais tempo do que nós. Desenha aqui a tua memória de água.\n\nAs pessoas desenharam planícies de espuma branca e rocha dura, dunas e um grupo de amigas, uma orelha e uma lista, apanhar latas, areia, gravar o vento. Alguém escreveu antes uma equação.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' } }],
    [['local'], 2620,  295, 130,  98, null, { img: 'la/local/fishing-lures.jpg', alt: { en: 'Fishing lures on a shop rack', pt: 'Iscas de pesca numa prateleira de loja' } }],
    [['local'], 2450,  358, 150, 112, 'Looking for shells', { img: 'la/local/shore.jpg', alt: { en: 'The rocky shore at low tide near Esposende', pt: 'A costa rochosa na maré baixa perto de Esposende' }, full: { en: 'We went out to find shells. We walked the sand at low tide and found almost nothing, a few broken pieces, nothing whole.\n\nWe met fishermen along the way and asked them. They all said the same thing. Go up north. There are more there. Everyone pointed further along the coast, as if the shells had moved and everybody knew it except us.\n\nWe kept looking. We came back with sand, with recordings, with a story about not finding what we came for.', pt: 'Saímos à procura de conchas. Andámos pela areia na maré baixa e não encontrámos quase nada, alguns pedaços partidos, nada inteiro.\n\nPelo caminho encontrámos pescadores e perguntámos. Diziam todos o mesmo. Vão mais para norte. Lá há mais. Toda a gente apontava mais adiante na costa, como se as conchas se tivessem mudado e todos soubessem menos nós.\n\nContinuámos à procura. Voltámos com areia, com gravações, e com uma história sobre não encontrar aquilo que fomos procurar.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' }, sources: [{ href: 'https://www.noaa.gov/education/resource-collections/ocean-coasts/ocean-acidification', label: { en: 'NOAA. Ocean acidification and what it does to shells', pt: 'NOAA. A acidificação dos oceanos e o que faz às conchas' } }] }],
    [['local', 'future'], 2450, 490, 100, 178, 'The lamprey', { img: 'la/local/lamprey.jpg', alt: { en: 'Sea lampreys in a tank, mouths pressed against the glass', pt: 'Lampreias num aquário, com as bocas contra o vidro' }, full: { en: 'We met a monster in a tank. A round mouth, a ring of teeth turning inwards, no jaw at all.\n\nIt is a sea lamprey, and it moves between the river and the ocean. It is born in fresh water, drifts downstream as a larva, grows at sea, and comes back up the river to spawn and die. It has been doing this for longer than there have been fish with jaws.\n\nHere it is also dinner. Lampreia is a season and a delicacy in the north, waited for every year.', pt: 'Encontrámos um monstro num aquário. Uma boca redonda, um anel de dentes virados para dentro, sem maxilar nenhum.\n\nÉ uma lampreia, e move-se entre o rio e o oceano. Nasce em água doce, desce como larva, cresce no mar e volta a subir o rio para desovar e morrer. Faz isto há mais tempo do que existem peixes com maxilares.\n\nAqui também é jantar. A lampreia é uma época e uma iguaria no norte, esperada todos os anos.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' } }],

    // ── SARGASSUM — text column (each card stacks under the one before it,

    [['sargassum'], 1080,  190, 180,  34, null, { link: 'https://www.visitesposende.com/en/fazer/monumentos/sargasso-museum', label: { en: 'Sargasso Museum →', pt: 'Museu do Sargaço →' } }],
    [['sargassum'], 1080,  238, 300, 260, null, { txt: { en: 'Esposende has an entanglement with sargassum that goes years and years back.\n\nWhen we set out for the research project, we asked how an old tradition reflects on the future. Futures of creating speculative ways of creating…', pt: 'Esposende tem uma ligação com as algas sargaço que remonta a muitos e muitos anos.\n\nQuando nos lançámos neste projeto de investigação, questionámo-nos sobre como uma tradição antiga se reflete no futuro. Futuros que envolvem formas…' }, full: { en: 'Esposende has an entanglement with sargassum that goes years and years back.\n\nWhen we set out for the research project, we asked how an old tradition reflects on the future. Futures of creating speculative ways of creating rituals, as an act of care, an act of observation, an act of listening, an act of remembering the water ecology we cohabit.\n\nAs Sargaceiros gleaned sargassum, today most interfaces glean data; we often think of this data as residing in an invisible cloud but forget the physical infrastructure it carries. As part of a speculative ritual, our project gleans memories of what has been and what could be for the futures of waters in Esposende.\n\nThe rising temperatures heavily affect the Esposende coast, as they do in a global network of water bodies. The changing water will also affect the kelp forests along the town\'s coast. We ask how we could speculate futures of tradition, how the kelp, once the heart of the livelihood of Esposende, could take its shape in communal futures.', pt: 'Esposende tem uma ligação com as algas sargaço que remonta a muitos e muitos anos.\n\nQuando nos lançámos neste projeto de investigação, questionámo-nos sobre como uma tradição antiga se reflete no futuro. Futuros que envolvem formas especulativas de criar rituais, como um ato de cuidado, um ato de observação, um ato de escuta, um ato de recordar a ecologia aquática com a qual coabitamos.\n\nTal como os Sargaceiros recolhiam sargaço, hoje em dia a maioria das interfaces recolhe dados; muitas vezes pensamos que esses dados residem numa nuvem invisível, mas esquecemo-nos da infraestrutura física que os suporta. Como parte de um ritual especulativo, o nosso projeto recolhe memórias do que foi e do que poderá ser para o futuro das águas em Esposende.\n\nO aumento das temperaturas afeta fortemente a costa de Esposende, tal como acontece numa rede global de massas de água. As alterações nas águas afetarão também as florestas de algas ao longo da costa da cidade. Questionamo-nos sobre como poderíamos especular sobre os futuros da tradição; como é que as algas, outrora o cerne do sustento de Esposende, poderiam assumir a sua forma em futuros comunitários.' } }],

    // ── CROSS: Sargassum × Exhibition
    // Tidal Archive — historical photograph opens the sargaco story.
    // Image credit: Biblioteca Municipal Manuel de Boaventura. If the file is
    // absent the card still opens; the <img> hides itself on error.
    [['sargassum', 'local'], 1580,  502, 166, 118, 'Tidal Archive', { img: 'la/sargassum/sargaceiro-historico.jpg', alt: { en: 'A sargaceiro pulling a net of sargaço onto the sand', pt: 'Um sargaceiro a puxar uma rede de sargaço para a areia' }, credit: { en: 'Esposende, 1936. Biblioteca Municipal Manuel de Boaventura', pt: 'Esposende, 1936. Biblioteca Municipal Manuel de Boaventura' }, full: { en: 'For centuries the sargaço was gathered along the sands of Apúlia, in Esposende, by the sargaceiros and the sargaceiras, who kept one foot in the sea and one in the field. They waded out with a graveta and a long net, hauled the weed ashore, and left it to dry in the sun for three days before it was carried, together with pilado, onto the masseira fields: plots dug down towards the water table and fed by whatever the tide had given up. By royal decision the seaweed was free of any tax, which is part of why the practice took such hold here.\n\nThe harvest thinned as chemical fertiliser arrived and the masseira fields gave way. What remained moved sideways rather than disappearing: sargaço is gathered today mainly for the pharmaceutical, cosmetic and food industries, and the Museu do Sargaço in Apúlia keeps the tools, the boats and the clothing of the older economy.\n\nOffshore, the same coast holds something the sargaceiras and the sargaceiros had no word for. The kelp forests of northern Portugal, largely Laminaria hyperborea and Saccorhiza polyschides, are estimated to store some 16.5 gigagrams of carbon across roughly 5,100 hectares, and to export around a third of the carbon captured each year by all of the country\'s marine plant habitats. Researchers at CIIMAR and MARE have also recorded a tropicalisation of Portuguese waters that puts those forests, and everything living in them, at risk.\n\nSo the question the tradition leaves open is not whether sargaço will be gathered, but what gathering will come to mean.', pt: 'Durante séculos o sargaço foi recolhido nos areais da Apúlia, em Esposende, pelos sargaceiros e pelas sargaceiras, que mantinham um pé no mar e outro na terra. Entravam na água com uma graveta e uma rede comprida, arrastavam a alga para a praia e deixavam-na secar ao sol durante três dias, antes de ser levada, juntamente com o pilado, para os campos de masseira: courelas cavadas em direção ao lençol freático e alimentadas pelo que a maré ia entregando. Por decisão régia, o sargaço estava isento de qualquer imposto, o que ajuda a explicar a força que a prática ganhou aqui.\n\nA apanha foi diminuindo à medida que chegou o adubo químico e os campos de masseira foram cedendo. O que restou deslocou-se em vez de desaparecer: hoje o sargaço é recolhido sobretudo para as indústrias farmacêutica, cosmética e alimentar, e o Museu do Sargaço, na Apúlia, guarda as alfaias, os barcos e o vestuário dessa economia mais antiga.\n\nAo largo, a mesma costa guarda algo para que as sargaceiras e os sargaceiros não tinham palavra. As florestas de kelp do norte de Portugal, sobretudo Laminaria hyperborea e Saccorhiza polyschides, armazenam cerca de 16,5 gigagramas de carbono em aproximadamente 5100 hectares e exportam perto de um terço do carbono captado anualmente por todos os habitats de plantas marinhas do país. Investigadores do CIIMAR e do MARE registaram também uma tropicalização das águas portuguesas que coloca em risco essas florestas e tudo o que nelas vive.\n\nA questão que a tradição deixa em aberto não é, portanto, se o sargaço continuará a ser recolhido, mas o que passará a significar recolhê-lo.' }, note: { en: 'Text written based on the sources below and edited with ML.', pt: 'Texto escrito com base nas fontes abaixo e editado com ML. Tradução automática.' }, sources: [{ href: 'https://www.visitesposende.com/en/fazer/monumentos/sargasso-museum', label: { en: 'Museu do Sargaço, Esposende. The harvesting tradition, the tools and the masseira fields', pt: 'Museu do Sargaço, Esposende. A tradição da apanha, as alfaias e os campos de masseira' } }, { href: 'https://www.ciimar.up.pt/marine-forests-in-northern-portugal-allies-in-the-fight-against-climate-change/', label: { en: 'CIIMAR. Marine forests in northern Portugal, allies against climate change', pt: 'CIIMAR. Florestas marinhas no norte de Portugal, aliadas contra as alterações climáticas' } }, { href: 'https://www.mare-centre.pt/en/kelp_carbon', label: { en: 'MARE. The carbon sequestration potential of kelp', pt: 'MARE. O potencial de sequestro de carbono do kelp' } }, { href: 'https://arquivos.rtp.pt/conteudos/o-sargaceiro-da-apulia/', label: { en: 'RTP Arquivos. O Sargaceiro da Apúlia', pt: 'RTP Arquivos. O Sargaceiro da Apúlia' } }, { href: 'https://observador.pt/2016/03/06/maresia-das-algas-do-areal-laboratorio/', label: { en: 'Observador. Maresia das algas, do areal ao laboratório', pt: 'Observador. Maresia das algas, do areal ao laboratório' } }] }],
