<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>she tells — constellation</title>
  <script src="lang.js?v=4"></script>
  <style>
    /* ── Fonts ── */
    @font-face {
      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 70, 255, 0.08);
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1rem; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 3.5vw, 52px);
      line-height: 1;
      color: #0046FF;
      letter-spacing: -0.02em;
      text-box: trim-both cap alphabetic;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(10px, 1.1vw, 15px);
      color: #0046FF;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.45em;
      padding-bottom: 2px;
    }

    .brand-line {
      width: clamp(24px, 2.8vw, 40px);
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .const-page-label {
      font-family: 'Celescript', cursive;
      font-size: clamp(9px, 1vw, 13px);
      color: rgba(0, 70, 255, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      align-self: center;
    }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #F4F2EE;
      user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner — pan/zoom target ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 3200px;
      height: 2200px;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── SVG loops ── */
    .loops-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 2px 6px rgba(0,0,0,0.13),
        0 0 0 1px rgba(0,0,0,0.055);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 10px 28px rgba(0,0,0,0.18),
        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
    }

    .card-body {
      width: 100%;
      height: 64%;
      background: #D2CFC8;
    }

    figcaption.card-label {
      font-family: 'Celescript', cursive;
      font-size: 9px;
      color: rgba(0,0,0,0.38);
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* ── Legend ── */
    .map-legend {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.2rem 1.1rem;
      padding: 0.5rem 1.5rem;
      background: #ffffff;
      border-top: 1px solid rgba(0, 70, 255, 0.08);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }

    .legend-item.dimmed { opacity: 0.22; }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    .legend-item:not(.dimmed):hover .legend-dot {
      transform: scale(1.4);
    }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: #0046FF;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Corner controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,70,255,0.28);
      background: rgba(255,255,255,0.82);
      color: #0046FF;
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .zoom-btn:hover {
      background: #0046FF;
      color: #ffffff;
      border-color: #0046FF;
    }

    .map-hint {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.28);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 20;
    }

    /* ── Category dim on filter ── */
    .card-wrap.dimmed {
      opacity: 0.1;
      transition: opacity 0.22s ease;
    }
    .card-wrap {
      transition: opacity 0.22s ease;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="const-header">
    <a href="index.html" style="text-decoration:none;">
      <div class="brand">
        <span class="brand-title">she tells</span>
        <span class="brand-sub">
          <svg class="brand-line" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55.87 5.06" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=".75"
              d="M.91,3.32c3.46.66,15.77,1.65,22.92.28,4.78-.91,15.54-2.85,19.76-2.83,3.81.02,8.93,0,11.38.86"/>
          </svg>
          sea shells
        </span>
      </div>
    </a>
    <span class="const-page-label">constellation</span>
  </header>

  <!-- ── Map ── -->
  <div class="map-viewport" id="viewport">
    <div class="canvas-inner" id="canvasInner">
      <svg class="loops-svg" id="loopsSvg" width="3200" height="2200" aria-hidden="true"></svg>
      <!-- Cards injected by JS -->
    </div>

    <div class="map-controls">
      <button class="zoom-btn" id="btnZoomIn"  aria-label="Zoom in">+</button>
      <button class="zoom-btn" id="btnZoomOut" aria-label="Zoom out">−</button>
    </div>

    <p class="map-hint">drag to explore · scroll to zoom</p>
  </div>

  <!-- ── Legend ── -->
  <footer class="map-legend" id="mapLegend"></footer>

  <script>
    /* ═══════════════════════════════════════════════════
       CATEGORY DATA
    ═══════════════════════════════════════════════════ */
    const CATS = [
      { key: 'hypersea',    label: 'Hypersea',            color: '#0046FF' },
      { key: 'local',       label: 'Local Stories',        color: '#C4622D' },
      { key: 'workshop',    label: 'Workshop',             color: '#D4B800' },
      { key: 'drawings',    label: 'Drawings',             color: '#7B5EA7' },
      { key: 'speculative', label: 'Speculative Futures',  color: '#1DB4C8' },
      { key: 'sargassum',   label: 'Sargassum',            color: '#4A7C59' },
      { key: 'exhibition',  label: 'Exhibition',           color: '#D4586A' },
      { key: 'toolkit',     label: 'Toolkit',              color: '#E8923A' },
      { key: 'data',        label: 'Data',                 color: '#6B8FA3' },
      { key: 'future',      label: 'Future Product',       color: '#9B2335' },
      { key: 'nonhuman',    label: 'Non-Human',            color: '#5C7A3E' },
    ];

    const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));

    /* ── Cards: [key, x, y, w, h] ── */
    const CARDS = [
      // HYPERSEA
      ['hypersea',    252,  380, 115,  85],
      ['hypersea',    395,  295,  80, 112],
      ['hypersea',    450,  460, 106,  76],
      ['hypersea',    290,  540,  92,  66],
      // LOCAL STORIES
      ['local',       730,  228, 100,  76],
      ['local',       870,  168,  82, 112],
      ['local',       940,  308, 106,  80],
      // WORKSHOP
      ['workshop',   1166,  268,  96,  92],
      ['workshop',   1300,  220, 116,  76],
      ['workshop',   1390,  380,  90,  70],
      ['workshop',   1240,  430, 100,  82],
      // DRAWINGS
      ['drawings',   1664,  190,  86, 112],
      ['drawings',   1790,  130, 106,  80],
      ['drawings',   1856,  295,  96,  82],
      ['drawings',   1700,  345,  80,  70],
      // SPECULATIVE FUTURES
      ['speculative',2030,  265, 106,  82],
      ['speculative',2174,  200,  86, 116],
      ['speculative',2254,  390, 116,  78],
      ['speculative',2094,  466,  96,  72],
      // SARGASSUM
      ['sargassum',   230,  950, 116,  82],
      ['sargassum',   364,  875,  82, 110],
      ['sargassum',   434, 1046, 100,  78],
      // EXHIBITION
      ['exhibition',  628,  820, 106,  80],
      ['exhibition',  756,  758,  90, 116],
      ['exhibition',  856,  920, 112,  80],
      ['exhibition',  720, 1000,  96,  78],
      ['exhibition',  630,  970,  78,  68],
      // TOOLKIT
      ['toolkit',    1268,  745,  96,  82],
      ['toolkit',    1390,  693, 106,  74],
      ['toolkit',    1456,  850,  90,  96],
      // DATA
      ['data',       1844,  706, 106,  78],
      ['data',       1976,  648,  90, 110],
      ['data',       2050,  810, 116,  78],
      ['data',       1910,  882,  82,  72],
      // FUTURE PRODUCT
      ['future',      396, 1456, 106,  82],
      ['future',      530, 1378,  90, 110],
      ['future',      590, 1546, 116,  76],
      // NON-HUMAN
      ['nonhuman',   1072, 1358,  96,  82],
      ['nonhuman',   1200, 1296,  84, 110],
      ['nonhuman',   1278, 1450, 106,  78],
      ['nonhuman',   1140, 1530,  90,  88],
    ];

    /* ── Loops: [key, cx, cy, rx, ry, rotation] ── */
    const LOOPS = [
      ['hypersea',    358,  448, 192, 204,  -8],
      ['local',       858,  272, 190, 150,   6],
      ['workshop',   1294,  350, 200, 180,  -4],
      ['drawings',   1764,  264, 190, 180,   7],
      ['speculative',2164,  364, 210, 200,  -9],
      ['sargassum',   342,  984, 190, 180,   5],
      ['exhibition',  776,  920, 230, 210,  -6],
      ['toolkit',    1390,  804, 194, 170,   4],
      ['data',       1970,  790, 210, 190,  -7],
      ['future',      514, 1490, 194, 180,   3],
      ['nonhuman',   1194, 1430, 200, 200,  -5],
    ];

    /* ═══════════════════════════════════════════════════
       BUILD SVG LOOPS
    ═══════════════════════════════════════════════════ */
    const svg = document.getElementById('loopsSvg');

    function hexRgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    LOOPS.forEach(([key, cx, cy, rx, ry, rot]) => {
      const { color } = CAT_MAP[key];
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      el.setAttribute('cx', cx);
      el.setAttribute('cy', cy);
      el.setAttribute('rx', rx);
      el.setAttribute('ry', ry);
      el.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`);
      el.setAttribute('fill', hexRgba(color, 0.055));
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', key === 'workshop' ? '2' : '1.5');
      el.setAttribute('stroke-opacity', key === 'workshop' ? '0.72' : '0.55');
      el.dataset.cat = key;
      svg.appendChild(el);
    });

    /* ═══════════════════════════════════════════════════
       BUILD CARDS
    ═══════════════════════════════════════════════════ */
    const canvasInner = document.getElementById('canvasInner');

    CARDS.forEach(([key, x, y, w, h]) => {
      const { color, label } = CAT_MAP[key];

      const wrap = document.createElement('figure');
      wrap.className = 'card-wrap';
      wrap.dataset.cat = key;
      wrap.style.cssText = `left:${x}px; top:${y}px; width:${w}px;`;

      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = `width:${w}px; height:${h}px;`;

      const band = document.createElement('div');
      band.className = 'card-band';
      band.style.background = color;

      const body = document.createElement('div');
      body.className = 'card-body';

      card.appendChild(band);
      card.appendChild(body);

      const caption = document.createElement('figcaption');
      caption.className = 'card-label';
      caption.textContent = label;

      wrap.appendChild(card);
      wrap.appendChild(caption);
      canvasInner.appendChild(wrap);
    });

    /* ═══════════════════════════════════════════════════
       BUILD LEGEND
    ═══════════════════════════════════════════════════ */
    const legendEl = document.getElementById('mapLegend');
    let activeFilter = null;

    CATS.forEach(({ key, label, color }) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.cat = key;

      const dot = document.createElement('div');
      dot.className = 'legend-dot';
      dot.style.background = color;

      const lbl = document.createElement('span');
      lbl.className = 'legend-label';
      lbl.textContent = label;

      item.appendChild(dot);
      item.appendChild(lbl);
      legendEl.appendChild(item);

      item.addEventListener('click', () => {
        if (activeFilter === key) {
          activeFilter = null;
          applyFilter(null);
        } else {
          activeFilter = key;
          applyFilter(key);
        }
      });
    });

    function applyFilter(key) {
      document.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
      });
      document.querySelectorAll('.card-wrap').forEach(el => {
        el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
      });
      svg.querySelectorAll('ellipse').forEach(el => {
        if (key === null) {
          el.style.opacity = '';
        } else {
          el.style.opacity = el.dataset.cat === key ? '1' : '0.06';
        }
      });
    }

    /* ═══════════════════════════════════════════════════
       PAN + ZOOM
    ═══════════════════════════════════════════════════ */
    const viewport = document.getElementById('viewport');
    let scale = 0.38;
    let tx = 0, ty = 0;
    let isPanning = false;
    let startX = 0, startY = 0;
    let hasMoved = false;

    function applyTransform() {
      canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    }

    function initView() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      scale = Math.min(vw / 3200, vh / 2200) * 0.9;
      tx = (vw - 3200 * scale) / 2;
      ty = (vh - 2200 * scale) / 2;
      applyTransform();
    }

    /* Pointer pan */
    viewport.addEventListener('pointerdown', e => {
      if (e.target.closest('.map-controls')) return;
      isPanning = true;
      hasMoved = false;
      startX = e.clientX;
      startY = e.clientY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', e => {
      if (!isPanning) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) hasMoved = true;
      tx += dx; ty += dy;
      startX = e.clientX; startY = e.clientY;
      applyTransform();
    });

    viewport.addEventListener('pointerup', () => {
      isPanning = false;
      viewport.classList.remove('panning');
    });

    /* Wheel zoom */
    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const newScale = Math.max(0.15, Math.min(3, scale * factor));
      const rect = viewport.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const canX = (cx - tx) / scale;
      const canY = (cy - ty) / scale;
      scale = newScale;
      tx = cx - canX * scale;
      ty = cy - canY * scale;
      applyTransform();
    }, { passive: false });

    /* Touch pinch */
    let t0 = null, t1 = null, pinchDist = 0;
    viewport.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        t0 = e.touches[0]; t1 = e.touches[1];
        pinchDist = Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY);
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = d / pinchDist;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = viewport.getBoundingClientRect();
      const pcx = cx - rect.left, pcy = cy - rect.top;
      const canX = (pcx - tx) / scale;
      const canY = (pcy - ty) / scale;
      scale = Math.max(0.15, Math.min(3, scale * factor));
      tx = pcx - canX * scale;
      ty = pcy - canY * scale;
      pinchDist = d;
      applyTransform();
    }, { passive: false });

    /* Button zoom */
    function zoomToCenter(factor) {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const cx = vw / 2, cy = vh / 2;
      const newScale = Math.max(0.15, Math.min(3, scale * factor));
      const canX = (cx - tx) / scale;
      const canY = (cy - ty) / scale;
      scale = newScale;
      tx = cx - canX * scale;
      ty = cy - canY * scale;
      applyTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click',  () => zoomToCenter(1.3));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomToCenter(0.77));

    /* Init */
    window.addEventListener('load', initView);
    window.addEventListener('resize', initView);
  </script>

</body>
</html>
