<html lang="en">
<head>

  <script src="lang.js?v=4"></script>
  <style>

      font-family: 'NaNTresorM';
      src: url('Fonts/NaNTresor/NaNTresorM-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'NaNTresorM';
      src: url('NaNTresorM-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Celescript';
      src: url('Celescript.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .const-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0.9rem 1.5rem 0.7rem;
      background: #ffffff;
      border-bottom: 1.5px solid rgba(0, 70, 255, 0.1);
      z-index: 100;
    }

    .brand { display: flex; align-items: flex-end; gap: 1rem; text-decoration: none; }

    .brand-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: clamp(28px, 3.5vw, 52px);
      line-height: 1;
      color: #0046FF;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'Celescript', cursive;
      font-size: clamp(10px, 1.1vw, 15px);
      color: #0046FF;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.45em;
      padding-bottom: 3px;
    }

    .brand-line {
      width: clamp(24px, 2.8vw, 40px);

    .const-page-label {

      letter-spacing: 0.12em;
      text-transform: uppercase;
      align-self: center;
    }

    /* ── Viewport ── */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.panning { cursor: grabbing; }

    /* ── Canvas inner ── */
    .canvas-inner {
      position: absolute;
      top: 0; left: 0;
      width: 3400px;
      height: 2300px;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Cards ── */
    .card-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .card {
      border-radius: 3px;
      overflow: hidden;
      box-shadow:

      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;

      box-shadow:

        0 0 0 1px rgba(0,0,0,0.07);
      z-index: 20;
    }

    .card-band {
      width: 100%;
      height: 36%;
      flex-shrink: 0;
    }

    .card-body {
      width: 100%;
      flex: 1;
      background: #DAD7D0;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }

    .card-title {
      font-family: 'NaNTresorM', Georgia, serif;
      font-weight: 200;
      font-size: 10px;
      color: rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    .card-cats-dots {
      display: flex;
      gap: 3px;
      justify-content: center;
    }

    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .map-legend {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.15rem 1rem;
      padding: 0.45rem 1.5rem;
      background: #ffffff;
      border-top: 1.5px solid rgba(0, 70, 255, 0.1);
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }

    .legend-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .legend-item:not(.dimmed):hover .legend-dot { transform: scale(1.45); }

    .legend-label {
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: #0046FF;
      letter-spacing: 0.04em;
      white-space: nowrap;

    /* ── Controls ── */
    .map-controls {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,70,255,0.25);

      font-family: 'NaNTresorM', Georgia, serif;

      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .zoom-btn:hover { background: #0046FF; color: #fff; border-color: #0046FF; }

    .map-hint {
      position: absolute;
      bottom: 16px; right: 16px;
      font-family: 'Celescript', cursive;
      font-size: 10px;
      color: rgba(0,0,0,0.2);

    /* ── Filter transitions ── */
    .card-wrap { transition: opacity 0.22s ease; }
    .card-wrap.dimmed { opacity: 0.08; }
  </style>
</head>

  <script>
  /* ═══════════════════════════════════════════════════
     CATEGORY DEFINITIONS
     Three color families from the landing page:
       Blue  #0046FF — water, ocean, data, future
       Yellow #F5DE0A — making, practice, tools
       Purple #6e00b0 — creative, human, cultural
  ═══════════════════════════════════════════════════ */
  const CATS = [
    // Blue family — ocean / water / knowledge
    { key: 'hypersea',    label: 'Hypersea',            color: '#0046FF' },
    { key: 'sargassum',   label: 'Sargassum',            color: '#0077CC' },
    { key: 'speculative', label: 'Speculative Futures',  color: '#3D9BE9' },
    { key: 'data',        label: 'Data',                 color: '#001F8A' },
    // Yellow family — making / process / production
    { key: 'workshop',    label: 'Workshop',             color: '#F5DE0A' },
    { key: 'toolkit',     label: 'Toolkit',              color: '#C4A800' },
    { key: 'future',      label: 'Future Product',       color: '#FFB800' },
    // Purple family — creative / human / cultural
    { key: 'drawings',    label: 'Drawings',             color: '#6e00b0' },
    { key: 'exhibition',  label: 'Exhibition',           color: '#9B40CC' },
    { key: 'local',       label: 'Local Stories',        color: '#4A0078' },
    { key: 'nonhuman',    label: 'Non-Human',            color: '#CC66FF' },
  ];
  const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));

  /* ── Cluster center coordinates for drawing connection lines ── */
  const CENTERS = {
    hypersea:    [360,  450],
    local:       [862,  275],
    workshop:    [1298, 352],
    drawings:    [1768, 268],
    speculative: [2170, 368],
    sargassum:   [345,  988],
    exhibition:  [780,  924],
    toolkit:     [1394, 808],
    data:        [1975, 795],
    future:      [518,  1495],
    nonhuman:    [1198, 1436],
  };

  /* ═══════════════════════════════════════════════════
     CONNECTION LINES
     Open bezier curves showing relationships between
     clusters. Not closed loops — they flow between nodes.
     color: '#0046FF' (blue) or '#F5DE0A' (yellow)
     bend: controls how far the curve deviates from straight line
           positive = curves one way, negative = other way
  ═══════════════════════════════════════════════════ */
  const CONNECTIONS = [
    // ── Blue connections (water / knowledge / ocean)
    { from: 'hypersea',    to: 'sargassum',   color: '#0046FF', bend: -0.45 },
    { from: 'sargassum',   to: 'nonhuman',    color: '#0046FF', bend:  0.38 },
    { from: 'hypersea',    to: 'local',       color: '#0046FF', bend: -0.30 },
    { from: 'data',        to: 'speculative', color: '#0046FF', bend: -0.35 },
    { from: 'nonhuman',    to: 'data',        color: '#0046FF', bend:  0.40 },
    { from: 'sargassum',   to: 'exhibition',  color: '#0046FF', bend:  0.28 },
    { from: 'hypersea',    to: 'speculative', color: '#0046FF', bend: -0.18 }, // long sweep

    // ── Yellow connections (making / practice / process)
    { from: 'workshop',    to: 'toolkit',     color: '#F5DE0A', bend: -0.40 },
    { from: 'workshop',    to: 'drawings',    color: '#F5DE0A', bend: -0.32 },
    { from: 'toolkit',     to: 'data',        color: '#F5DE0A', bend: -0.30 },
    { from: 'drawings',    to: 'speculative', color: '#F5DE0A', bend: -0.28 },
    { from: 'future',      to: 'toolkit',     color: '#F5DE0A', bend:  0.35 },
    { from: 'speculative', to: 'future',      color: '#F5DE0A', bend:  0.42 }, // long sweep

    // ── Cultural connections (purple curves, using blue as line)
    { from: 'local',       to: 'exhibition',  color: '#0046FF', bend:  0.32 },
    { from: 'exhibition',  to: 'drawings',    color: '#6e00b0', bend: -0.30 },
    { from: 'local',       to: 'nonhuman',    color: '#6e00b0', bend:  0.38 },
  ];

  /* ═══════════════════════════════════════════════════
     CARD DATA
     [cats[], x, y, w, h, title, url]
  ═══════════════════════════════════════════════════ */
  const CARDS = [
    // ── HYPERSEA
    [['hypersea'],               252,  380, 115,  85, null, null],
    [['hypersea'],               395,  295,  80, 112, null, null],
    [['hypersea'],               450,  460, 106,  76, null, null],
    [['hypersea'],               290,  540,  92,  66, null, null],
    [['hypersea'],               312,  440, 140,  95, 'Water Memory Stream', 'https://shetells.stream'],

    // ── LOCAL STORIES
    [['local'],                  730,  228, 100,  76, null, null],
    [['local'],                  870,  168,  82, 112, null, null],
    [['local'],                  940,  308, 106,  80, null, null],

    // ── CROSS: Hypersea × Local Stories
    [['hypersea','local'],       592,  308,  98,  74, 'Field Notes', null],

    // ── WORKSHOP
    [['workshop'],              1166,  268,  96,  92, null, null],
    [['workshop'],              1302,  220, 116,  76, null, null],
    [['workshop'],              1392,  382,  90,  70, null, null],
    [['workshop'],              1242,  432, 100,  82, null, null],
    [['workshop'],              1180,  310, 108,  80, 'Workshop Archive', null],

    // ── DRAWINGS
    [['drawings'],              1666,  192,  86, 112, null, null],
    [['drawings'],              1794,  130, 106,  80, null, null],
    [['drawings'],              1860,  298,  96,  82, null, null],
    [['drawings'],              1702,  348,  80,  70, null, null],

    // ── CROSS: Workshop × Drawings
    [['workshop','drawings'],   1546,  292,  92,  78, 'Making Session', null],

    // ── SPECULATIVE FUTURES
    [['speculative'],           2032,  268, 106,  82, null, null],
    [['speculative'],           2178,  202,  86, 116, null, null],
    [['speculative'],           2258,  394, 116,  78, null, null],
    [['speculative'],           2096,  470,  96,  72, null, null],
    [['speculative'],           2102,  332, 118,  84, 'Future Esposende', null],

    // ── CROSS: Drawings × Speculative Futures
    [['drawings','speculative'],1972,  202,  88,  72, 'Drawn Futures', null],

    // ── SARGASSUM
    [['sargassum'],              230,  952, 116,  82, null, null],
    [['sargassum'],              366,  876,  82, 110, null, null],
    [['sargassum'],              436, 1050, 100,  78, null, null],

    // ── EXHIBITION
    [['exhibition'],             630,  822, 106,  80, null, null],
    [['exhibition'],             758,  760,  90, 116, null, null],
    [['exhibition'],             858,  924, 112,  80, null, null],
    [['exhibition'],             722, 1004,  96,  78, null, null],
    [['exhibition'],             632,  972,  78,  68, null, null],
    [['exhibition'],             697,  862, 130,  88, 'Documentation', null],

    // ── CROSS: Sargassum × Exhibition
    [['sargassum','exhibition'], 540,  964,  94,  76, 'Tidal Archive', null],

    // ── TOOLKIT
    [['toolkit'],               1270,  748,  96,  82, null, null],
    [['toolkit'],               1392,  696, 106,  74, null, null],
    [['toolkit'],               1458,  854,  90,  96, null, null],

    // ── DATA
    [['data'],                  1846,  708, 106,  78, null, null],
    [['data'],                  1978,  650,  90, 110, null, null],
    [['data'],                  2052,  814, 116,  78, null, null],
    [['data'],                  1912,  886,  82,  72, null, null],

    // ── CROSS: Toolkit × Data
    [['toolkit','data'],        1624,  784, 102,  78, 'Methods & Measures', null],

    // ── FUTURE PRODUCT
    [['future'],                 398, 1458, 106,  82, null, null],
    [['future'],                 532, 1380,  90, 110, null, null],
    [['future'],                 592, 1550, 116,  76, null, null],

    // ── NON-HUMAN
    [['nonhuman'],              1074, 1360,  96,  82, null, null],
    [['nonhuman'],              1202, 1298,  84, 110, null, null],
    [['nonhuman'],              1280, 1454, 106,  78, null, null],
    [['nonhuman'],              1142, 1534,  90,  88, null, null],
    [['nonhuman'],              1088, 1398, 110,  82, 'Non-Human Voices', null],

    // ── CROSS: Non-Human × Sargassum
    [['nonhuman','sargassum'],   682, 1222,  98,  76, 'Seaweed Mapping', null],
  ];

  /* ═══════════════════════════════════════════════════
     CATMULL-ROM OPEN PATH
     For open (non-closed) smooth curves through points.
  ═══════════════════════════════════════════════════ */
  function catmullOpen(pts, tension = 0.38) {
    const n = pts.length;
    if (n < 2) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(i + 2, n - 1)];
      const cp1x = (p1[0] + (p2[0] - p0[0]) * tension).toFixed(1);
      const cp1y = (p1[1] + (p2[1] - p0[1]) * tension).toFixed(1);
      const cp2x = (p2[0] - (p3[0] - p1[0]) * tension).toFixed(1);
      const cp2y = (p2[1] - (p3[1] - p1[1]) * tension).toFixed(1);
      d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ═══════════════════════════════════════════════════
     QUADRATIC BEZIER CONNECTION between two cluster centers
     bend: how far the midpoint curves off the straight line
     (positive = left of direction, negative = right)
  ═══════════════════════════════════════════════════ */
  function connectionPath(x1, y1, x2, y2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    // Perpendicular unit vector
    const px = -dy / len, py = dx / len;
    const offset = len * bend;
    const cx = (x1 + x2) / 2 + px * offset;
    const cy = (y1 + y2) / 2 + py * offset;
    return `M ${x1.toFixed(0)},${y1.toFixed(0)} Q ${cx.toFixed(0)},${cy.toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`;
  }

  /* ═══════════════════════════════════════════════════
     BUILD CONNECTION LINES
  ═══════════════════════════════════════════════════ */
  const svg = document.getElementById('linesSvg');

  CONNECTIONS.forEach(({ from, to, color, bend }) => {
    const [x1, y1] = CENTERS[from];
    const [x2, y2] = CENTERS[to];
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', connectionPath(x1, y1, x2, y2, bend));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-opacity', color === '#F5DE0A' ? '0.7' : '0.45');
    path.setAttribute('stroke-linecap', 'round');
    path.dataset.connection = `${from}-${to}`;
    svg.appendChild(path);
  });

  /* ═══════════════════════════════════════════════════
     BUILD CARDS
  ═══════════════════════════════════════════════════ */
  const canvasInner = document.getElementById('canvasInner');

  CARDS.forEach(([cats, x, y, w, h, title, url]) => {
    const colors = cats.map(k => CAT_MAP[k].color);

    const wrap = document.createElement(url ? 'a' : 'figure');
    wrap.className = 'card-wrap';
    wrap.dataset.cats = cats.join(',');
    wrap.style.cssText = `left:${x}px; top:${y}px; width:${w}px;`;

    if (url) {
      wrap.href = url;
      wrap.target = '_blank';
      wrap.rel = 'noopener';
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = `width:${w}px; height:${h}px;`;

    const band = document.createElement('div');
    band.className = 'card-band';
    if (colors.length === 1) {
      band.style.background = colors[0];
    } else {
      const stops = colors.map((c,i) => {
        const pct = 100 / colors.length;
        return `${c} ${(i*pct).toFixed(0)}%, ${c} ${((i+1)*pct).toFixed(0)}%`;
      }).join(', ');
      band.style.background = `linear-gradient(to right, ${stops})`;
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    if (title) {
      const t = document.createElement('span');
      t.className = 'card-title';
      t.textContent = title;
      body.appendChild(t);
    }

    card.appendChild(band);
    card.appendChild(body);

    const dots = document.createElement('div');
    dots.className = 'card-cats-dots';
    cats.forEach(k => {
      const d = document.createElement('span');
      d.className = 'cat-dot';
      d.style.background = CAT_MAP[k].color;
      dots.appendChild(d);
    });

    wrap.appendChild(card);
    wrap.appendChild(dots);
    canvasInner.appendChild(wrap);
  });

  /* ═══════════════════════════════════════════════════
     BUILD LEGEND
  ═══════════════════════════════════════════════════ */
  const legendEl = document.getElementById('mapLegend');
  let activeFilter = null;

  CATS.forEach(({ key, label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cat = key;

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const lbl = document.createElement('span');
    lbl.className = 'legend-label';
    lbl.textContent = label;

    item.appendChild(dot);
    item.appendChild(lbl);
    legendEl.appendChild(item);

    item.addEventListener('click', () => {
      activeFilter = activeFilter === key ? null : key;
      applyFilter(activeFilter);
    });
  });

  function applyFilter(key) {
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', key !== null && el.dataset.cat !== key);
    });
    document.querySelectorAll('.card-wrap').forEach(el => {
      const cats = el.dataset.cats.split(',');
      el.classList.toggle('dimmed', key !== null && !cats.includes(key));
    });
    // Dim connections that don't involve the active category
    svg.querySelectorAll('path').forEach(el => {
      const conn = el.dataset.connection || '';
      const relevant = key === null || conn.includes(key);
      el.style.transition = 'opacity 0.22s ease';
      el.style.opacity = relevant ? '' : '0.04';
    });
  }

  /* ═══════════════════════════════════════════════════
     PAN + ZOOM
  ═══════════════════════════════════════════════════ */
  const viewport = document.getElementById('viewport');
  let scale = 0.36;
  let tx = 0, ty = 0;
  let isPanning = false;
  let startX = 0, startY = 0;

  function applyTransform() {
    canvasInner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  }

  function initView() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    // Fit to actual content bounds (clusters span roughly x:165–2385, y:83–1680)
    const PAD = 100;
    const cX = 165 - PAD, cY = 83 - PAD;
    const cW = 2385 - 165 + PAD * 2;
    const cH = 1680 - 83  + PAD * 2;
    scale = Math.min(vw / cW, vh / cH) * 0.92;
    tx = (vw - cW * scale) / 2 - cX * scale;
    ty = (vh - cH * scale) / 2 - cY * scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-controls')) return;
    isPanning = true;
    startX = e.clientX; startY = e.clientY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!isPanning) return;
    tx += e.clientX - startX;
    ty += e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    applyTransform();
  });

  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.11 : 0.90;
    const newScale = Math.max(0.15, Math.min(3, scale * factor));
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }, { passive: false });

  let pinchDist = 0;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const pcx = cx - rect.left, pcy = cy - rect.top;
    const canX = (pcx - tx) / scale;
    const canY = (pcy - ty) / scale;
    scale = Math.max(0.15, Math.min(3, scale * (d / pinchDist)));
    tx = pcx - canX * scale;
    ty = pcy - canY * scale;
    pinchDist = d;
    applyTransform();
  }, { passive: false });

  function zoomToCenter(f) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2, cy = vh / 2;
    const newScale = Math.max(0.15, Math.min(3, scale * f));
    const canX = (cx - tx) / scale;
    const canY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - canX * scale;
    ty = cy - canY * scale;
    applyTransform();
  }

  document.getElementById('btnZoomIn').addEventListener('click',  () => zoomToCenter(1.3));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomToCenter(0.77));

  // Init once layout is fully painted (requestAnimationFrame ensures flex heights are settled)
  if (document.readyState === 'complete') {
    requestAnimationFrame(initView);
  } else {
    window.addEventListener('load', () => requestAnimationFrame(initView));
  }
  window.addEventListener('resize', initView);
  </script>

</body>
</html>
