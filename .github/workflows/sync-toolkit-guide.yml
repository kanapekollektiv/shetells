# Copies Mario's DIY Shell Phone guide (github.com/marioguzzzman/diy-shell.phone)
# onto shetells.stream at /toolkit/build/.
#
# Runs only by hand, for now: "Run workflow" on the Actions tab.
# The daily run and the run on Mario's push are switched off; to bring them
# back, add under `on:`
#   schedule:
#     - cron: '17 5 * * *'   # every day at 05:17 UTC
#   repository_dispatch:
#     types: [shellphone-updated]   # needs tools/toolkit-sync/notify-shetells.yml in his repo
#
# Nothing is committed when his guide has not changed.
name: Sync DIY Shell Phone guide

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-toolkit-guide
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Mario's guide
        uses: actions/checkout@v5
        with:
          repository: marioguzzzman/diy-shell.phone
          path: _mario

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the pages
        run: |
          pip install --quiet markdown
          python tools/toolkit-sync/build.py _mario toolkit/build

      - name: Commit if the guide changed
        id: commit
        run: |
          git config user.name  "shellphone-sync"
          git config user.email "actions@users.noreply.github.com"
          git add toolkit/build
          if git diff --cached --quiet; then
            echo "No changes in the guide."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            sha=$(git -C _mario rev-parse --short HEAD)
            git commit -m "Sync the DIY Shell Phone guide from marioguzzzman/diy-shell.phone@$sha"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not always start a Pages build on its own
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request not accepted; the push will still publish."
