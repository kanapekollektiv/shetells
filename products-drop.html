<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>she tells — products drop</title>
<style>
  /* ─────────────────────────────────────────────
     4K transparent stage. No background anywhere.
     ───────────────────────────────────────────── */
  @font-face {
    font-family: 'NaNTresor';
    src: url('NaNTresorM-Regular.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Celescript';
    src: url('Celescript.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* Fixed 4K canvas — scaled to fit the window for preview,
     left at 1:1 when rendering frames (?render=1). */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3840px;
    height: 2160px;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    background: transparent;
  }

  .item {
    position: absolute;
    bottom: 150px;
    left: var(--cx);
    width: var(--w);
    margin-left: calc(var(--w) / -2);
    text-align: center;
  }

  /* Horizontal drift: falls in from a random X, eases to its column. */
  .drift {
    transform: translateX(var(--dx));
    animation: drift-in var(--dur) var(--delay) cubic-bezier(0.25, 0, 0.35, 1) both;
  }

  /* Vertical fall + squash/stretch + wiggle. */
  .art {
    transform-origin: bottom center;
    transform: translateY(-2600px) rotate(var(--rot-start));
    will-change: transform;
    animation: drop-wiggle var(--dur) var(--delay) linear both;
  }

  .art img {
    display: block;
    width: 100%;
    height: auto;
    /* Tint — see WHITE below. */
    filter: var(--tint, none);
  }

  .name {
    margin-top: 44px;
    font-family: 'Celescript', 'NaNTresor', cursive;
    font-size: 96px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    animation: name-in 0.55s calc(var(--delay) + var(--dur) * 0.56) ease-out both;
  }

  @keyframes drift-in {
    0%   { transform: translateX(var(--dx)); }
    55%  { transform: translateX(0); }
    100% { transform: translateX(0); }
  }

  /* translateY(0) = resting on the baseline.
     55% is the landing frame; everything after is the jelly settle. */
  @keyframes drop-wiggle {
    0% {
      transform: translateY(-2600px) rotate(var(--rot-start));
      animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.6);
    }
    /* impact — squash */
    55% {
      transform: translateY(0) scale(1.10, 0.84) rotate(var(--rot-end));
      animation-timing-function: ease-out;
    }
    /* rebound — stretch */
    61% {
      transform: translateY(-120px) scale(0.94, 1.10)
                 rotate(calc(var(--rot-end) - 7deg));
    }
    /* second impact */
    67% {
      transform: translateY(0) scale(1.05, 0.94)
                 rotate(calc(var(--rot-end) + 7deg));
    }
    71% {
      transform: translateY(-44px) scale(0.98, 1.03)
                 rotate(calc(var(--rot-end) - 3deg));
    }
    75% {
      transform: translateY(0) scale(1.02, 0.98)
                 rotate(calc(var(--rot-end) + 3deg));
    }
    /* wiggle settle */
    80%  { transform: translateY(0) scale(1) rotate(calc(var(--rot-end) - 4deg)); }
    86%  { transform: translateY(0) scale(1) rotate(calc(var(--rot-end) + 4deg)); }
    91%  { transform: translateY(0) scale(1) rotate(calc(var(--rot-end) - 2deg)); }
    96%  { transform: translateY(0) scale(1) rotate(calc(var(--rot-end) + 1deg)); }
    100% { transform: translateY(0) scale(1) rotate(var(--rot-end)); }
  }

  @keyframes name-in {
    0%   { opacity: 0; transform: translateY(26px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Replay control — preview only, never present in rendered frames. */
  #replay {
    position: fixed;
    right: 18px;
    bottom: 18px;
    padding: 9px 16px;
    font: 500 13px/1 -apple-system, Helvetica, Arial, sans-serif;
    letter-spacing: 0.06em;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 999px;
    cursor: pointer;
    z-index: 10;
  }
  body.rendering #replay { display: none; }
</style>
</head>
<body>

<div id="stage"></div>
<button id="replay">replay ⟲</button>

<script>
/* ─────────────────────────────────────────────────────────────
   she tells — product drop animation

   Preview:  products-drop.html
   Options:  ?t=2.5      freeze at 2.5 s (deterministic, for frame render)
             ?render=1   1:1 4K, no scaling, hide UI chrome
             ?colour=1   keep original brand colours (default is all white)
             ?only=2     render one product alone, centred in frame
             ?loop=1     restart automatically
   ───────────────────────────────────────────────────────────── */

const Q = new URLSearchParams(location.search);

const STAGE_W = 3840;
const STAGE_H = 2160;

/* Total animation length, in seconds — last item's delay + duration,
   plus a hold so the final wiggle has room to settle. */
const HOLD = 1.0;

const PRODUCTS = [
  { name: 'Shell Cream',         src: 'drawings/Asset 7.svg',  w: 700, rs: -6, re: -3 },
  { name: 'Acid Tabs',           src: 'drawings/Asset 11.svg', w: 380, rs:  5, re:  2 },
  { name: 'Sexy Dunes',          src: 'drawings/Asset 8.svg',  w: 620, rs: -4, re:  3 },
  { name: 'Deluxe O2',           src: 'drawings/Asset 9.svg',  w: 520, rs:  4, re: -2 },
  { name: 'Sargassum City',      src: 'drawings/Asset 14.svg', w: 820, rs: -5, re:  2 },
];

/* A lone product would only occupy a fifth of the frame at its group size,
   so solo clips are drawn larger. The art is vector, so this is real added
   detail rather than an upscale. */
const SOLO_SCALE = 2.0;

const STAGGER = 0.80;   // gap between drops — "one at a time"
const DURATION = 2.40;  // fall + settle per product

/* Seeded PRNG. Randomness must be identical on every load, otherwise
   each rendered frame would use a different set of start positions. */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260728);

const stage = document.getElementById('stage');
/* ?colour=1 keeps the original brand colours. The default renders every
   illustration pure white: brightness(0) flattens each asset to black while
   preserving its alpha, then invert(1) lifts it to white — so the coloured
   assets (Deluxe O2, Sargassum City) come out white too rather than inverted
   into their opposites. */
const WHITE = !Q.has('colour');

/* Draw the random entry offsets for all five up front, so picking a single
   product with ?only= does not shift the PRNG sequence for the others. */
const PAD = 170;
const LAYOUT = PRODUCTS.map((p, i) => ({
  cx: PAD + (STAGE_W - PAD * 2) * (i + 0.5) / PRODUCTS.length,
  dx: Math.round((rand() * 2 - 1) * 620),
  delay: i * STAGGER,
}));

/* ?only=N isolates one product: centred, dropping immediately, so the clip
   can be placed and timed on its own in an edit. */
const ONLY = Q.has('only') ? parseInt(Q.get('only'), 10) : null;
const SOLO = ONLY !== null && PRODUCTS[ONLY] !== undefined;
const PICKED = SOLO ? [PRODUCTS[ONLY]] : PRODUCTS;

PICKED.forEach((p, idx) => {
  const i = SOLO ? ONLY : idx;
  const cx = SOLO ? STAGE_W / 2 : LAYOUT[i].cx;
  const dx = LAYOUT[i].dx;
  const delay = SOLO ? 0 : LAYOUT[i].delay;

  const item = document.createElement('div');
  item.className = 'item';
  item.style.cssText =
    `--cx:${cx}px; --w:${p.w * (SOLO ? SOLO_SCALE : 1)}px; ` +
    `--dx:${dx * (SOLO ? SOLO_SCALE : 1)}px; --delay:${delay}s; ` +
    `--dur:${DURATION}s; --rot-start:${p.rs}deg; --rot-end:${p.re}deg; --tint:${WHITE ? 'brightness(0) invert(1)' : 'none'};`;

  item.innerHTML =
    `<div class="drift"><div class="art"><img src="${p.src}" alt=""></div></div>` +
    `<div class="name"><span>${p.name}</span></div>`;

  stage.appendChild(item);
});

const TOTAL = SOLO ? DURATION + HOLD
                   : (PRODUCTS.length - 1) * STAGGER + DURATION + HOLD;

/* Scale the 4K stage to fit the window. When rendering, the window is
   1920x1080 CSS px at deviceScaleFactor 2, so this fits at 0.5 and the
   captured bitmap comes back at a true 3840x2160 — the art is vector, so
   nothing is resampled. */
function fit() {
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  document.documentElement.style.setProperty('--fit', s);
}
fit();
addEventListener('resize', fit);

if (Q.has('render')) document.body.classList.add('rendering');

/* Wait for fonts + SVGs so nothing pops in after the first frame. */
/* Celescript is far wider than a sans at the same size, and the names are
   nowrap, so a fixed size makes long names collide with their neighbours.
   Measure every name once the font is live and drop to a single size that
   keeps the longest one inside its column — one size for all five, so the
   typography stays consistent. */
function fitNames() {
  const PITCH = (STAGE_W - 170 * 2) / PRODUCTS.length;   // per-column width
  const MAXW = SOLO ? STAGE_W - 400 : PITCH - 60;         // gutter between names
  const BASE = SOLO ? 96 * SOLO_SCALE : 96;

  let size = BASE;
  document.querySelectorAll('.name').forEach(n => {
    const w = n.querySelector('span').offsetWidth;
    if (w > MAXW) size = Math.min(size, Math.floor(BASE * MAXW / w));
  });
  if (size < BASE) {
    document.querySelectorAll('.name').forEach(n => n.style.fontSize = size + 'px');
  }
}

async function ready() {
  await document.fonts.ready;
  const imgs = [...document.querySelectorAll('img')];
  await Promise.all(imgs.map(img =>
    img.complete ? Promise.resolve()
                 : new Promise(r => { img.onload = r; img.onerror = r; })
  ));
  fitNames();
  if (SOLO) {
    /* Sit the artwork + name block in the vertical centre of the frame. */
    const item = document.querySelector('.item');
    item.querySelector('.name').style.marginTop = 44 * SOLO_SCALE + 'px';
    item.style.bottom = Math.round((STAGE_H - item.offsetHeight) / 2) + 'px';
  }
}

/* Freeze every animation at an exact time. Used one frame per Chrome
   launch, which makes the render fully deterministic. */
function seek(t) {
  document.getAnimations().forEach(a => {
    a.pause();
    a.currentTime = t * 1000;
  });
}

function restart() {
  document.getAnimations().forEach(a => { a.cancel(); a.play(); });
}

ready().then(() => {
  if (Q.has('t')) {
    seek(parseFloat(Q.get('t')) || 0);
    /* Signal to the render script that this frame is settled. */
    document.body.dataset.frameReady = '1';
    return;
  }

  if (Q.has('loop')) {
    setInterval(restart, TOTAL * 1000);
  }
});

document.getElementById('replay').addEventListener('click', restart);
addEventListener('keydown', e => { if (e.key === 'r') restart(); });

/* Exposed for the frame renderer. */
window.ANIM = { TOTAL, STAGE_W, STAGE_H, seek, restart };
</script>

</body>
</html>
